<script>
(() => {
"use strict";

const C=window.INVITE;
const $=id=>document.getElementById(id);
const root=document.documentElement;
const clamp=(n,min=0,max=1)=>Math.max(min,Math.min(max,n));
const smooth=x=>x*x*(3-2*x);
const lerp=(a,b,t)=>a+(b-a)*t;
const pct=v=>`${Math.round(v*100)}%`;
const numeric=(value,fallback)=>{
  if(value===null || value===undefined || value==="") return fallback;
  const n=Number(value);
  return Number.isFinite(n)?n:fallback;
};

const reduced=matchMedia("(prefers-reduced-motion:reduce)");
const landscapeQuery=matchMedia("(orientation: landscape)");

let paused=reduced.matches;
let entered=false;
let requested=false;
let leaving=false;
let revealed=false;

let toastTimer;
let revealTimer;
let transitionTimer;

let scratchHelpKey="intro.help";
let announceKey="";
let chapelStatusKey="details.chapelPhotoLoading";

/* ==========================================================
   語言：網址 ?lang= → 上次選擇 → 預設繁體中文
   ========================================================== */
const LANG_KEY="mj-invite-lang";

function pickLang(){
  try{
    const q=new URLSearchParams(location.search).get("lang");
    if(q && C.languages[q]) return q;
  }catch{}
  try{
    const saved=localStorage.getItem(LANG_KEY);
    if(saved && C.languages[saved]) return saved;
  }catch{}
  return C.defaultLang;
}

let lang=pickLang();

const vars={names:C.names,initials:C.initials,chapel:C.chapel,hotel:C.hotel,mapUrl:C.mapUrl,guestName:""};

function lookup(obj,path){
  return path.split(".").reduce((v,k)=>v==null?undefined:v[k],obj);
}
function get(path){
  const value=lookup(C.languages[lang],path);
  return value!==undefined?value:lookup(C.languages[C.defaultLang],path);
}
function format(value,extra={}){
  const values={...vars,...extra};
  return String(value??"").replace(/\{([A-Za-z0-9_]+)\}/g,
    (match,key)=>Object.prototype.hasOwnProperty.call(values,key)?String(values[key]??""):match);
}
function copy(path,extra={}){return format(get(path),extra)}
function put(id,path,extra={}){
  const el=$(id);
  if(el) el.textContent=copy(path,extra);
}
function toast(path){
  put("toast",path);
  $("toast").hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$("toast").hidden=true,5000);
}
function link(id,value){
  try{
    const url=new URL(String(value||""));
    if(!["http:","https:"].includes(url.protocol)) throw new Error("Unsupported link protocol");
    $(id).href=url.href;
    $(id).hidden=false;
  }catch{
    $(id).hidden=true;
  }
}

function isStatic(){return reduced.matches}
function applyStaticClass(){document.body.classList.toggle("journey-static",isStatic())}
applyStaticClass();

/* ==========================================================
   頂部列高度
   ========================================================== */
const topbar=document.querySelector(".topbar");

function syncTopbarHeight(){
  if(!topbar) return;
  const height=Math.ceil(topbar.getBoundingClientRect().height);
  root.style.setProperty("--topbar-height",`${height}px`);
}

syncTopbarHeight();

if("ResizeObserver" in window){
  new ResizeObserver(()=>{
    syncTopbarHeight();
    measureEntrance();
    requestEntranceUpdate();
    requestCoupleLayout();
  }).observe(topbar);
}else{
  addEventListener("resize",syncTopbarHeight,{passive:true});
}

document.fonts?.ready.then(()=>{
  syncTopbarHeight();
  requestCoupleLayout();
  storyMeasured=false;        // 字體改變卡片高度 → 故事卡重新檢查空間
  requestEntranceUpdate();
});


(function setOpeningPaper(){
  const path=String(C.openingPaperUrl||"").trim();
  if(!path) return;
  try{
    const url=new URL(path,document.baseURI).href;
    root.style.setProperty("--opening-paper",`url(${JSON.stringify(url)})`);
  }catch(error){
    console.warn("Opening paper path error:",error);
  }
})();

link("mapLink",C.mapUrl);
link("chapelWebsiteLink",C.chapelWebsiteUrl);

/* ==========================================================
   手繪教堂：元素
   ========================================================== */
const entrance=$("chapelEntrance");
const entranceSticky=$("entranceSticky");
const entranceStage=$("entranceStage");
const entranceZoom=$("entranceZoom");
const entranceVeil=$("entranceVeil");
const entranceImage=$("entranceImage");
const entranceSource=$("entranceDesktopSource");
const entranceFallback=$("entranceFallback");
const entranceCard=$("entranceCard");

const sceneInterior=$("sceneInterior");
const interiorStage=$("interiorStage");
const interiorZoom=$("interiorZoom");
const interiorImage=$("interiorImage");
const interiorSource=$("interiorDesktopSource");
const interiorFallback=$("interiorFallback");
const interiorCard=$("interiorCard");

const coupleFigure=$("coupleFigure");
const coupleImage=$("coupleImage");

const fgFigure=$("foregroundFigure");
const fgImage=$("foregroundImage");
const fgSource=$("foregroundDesktopSource");

let entranceHasImage=false;
let entranceStarted=false;
let entranceSettled=false;

let interiorHasImage=false;
let interiorStarted=false;
let interiorWanted=false;

let coupleStarted=false;
let coupleReady=false;
let coupleTicking=false;

let fgStarted=false;
let fgReady=false;
let fgAlpha=null;
let fgLastNote="";

root.style.setProperty("--entrance-pos-portrait",String(C.entrancePositionPortrait||"50% 58%"));
root.style.setProperty("--entrance-pos-landscape",String(C.entrancePositionLandscape||"50% 56%"));
root.style.setProperty("--interior-pos-portrait",String(C.interiorPositionPortrait||"50% 52%"));
root.style.setProperty("--interior-pos-landscape",String(C.interiorPositionLandscape||"50% 50%"));

let usingDoorImg=false;   // true = 入口位置用緊 doorway 圖
let fracA=.5;

let fracD=0;
let fracH=.2;            // Checkpoint 4：室內停留佔比
let fracO=0;             // Checkpoint 4：走出段佔比（0 = 未啟用）
let walkOutFailed=false; // 走出素材失敗 → 取消走出段
// (舊敲鐘段 fracB / bellFailed 已移除:敲鐘已整合入資訊背景)



let fracT=.22;
let fracW=1;             // 走出段 + 故事段之中,「走路」所佔比例(1 = 冇故事段)
let storyMeasured=false; // 故事卡空間檢查:resize / 轉向 / 換語言(measureEntrance)後重新量度

let doorFailed=false;   // 近景圖載入失敗 → 取消近景段,回到原本流程

function setJourneyScroll(){
  const a=clamp(numeric(C.entranceScrollScreens,1.6),.5,4);
  const d=(C.door && C.door.enabled!==false && !doorFailed)?clamp(numeric(C.door.scrollScreens,1.3),.4,3):0;
  const t=clamp(numeric(C.interiorTransitionScreens,.7),.3,2);
  const h=clamp(numeric(C.interiorHoldScreens,.9),.3,3);
  const wo=C.walkOut||{};
  const o=(wo.enabled!==false && String(wo.sheetUrl||"").trim() && !walkOutFailed)?clamp(numeric(wo.scrollScreens,1.4),.4,3):0;
  const stc=C.story||{};

  const sScr=(o>0 && stc.enabled!==false && (C.infoFlow||{}).enabled!==false)?clamp(numeric(stc.scrollScreens,1.2),0,3):0;
  const oAll=o+sScr;
  const total=a+d+t+h+oAll;
  fracW=oAll>0?o/oAll:1;


  fracA=a/total;
  fracD=d/total;
  fracT=t/total;
  fracH=h/total;
  fracO=oAll/total;

  const unit=window.CSS?.supports?.("height","1svh")?"svh":"vh";
  root.style.setProperty("--entrance-scroll",`${(total*100).toFixed(1)}${unit}`);
  const flowCfg=C.infoFlow||{};
  const ovlMax=sScr>0?sScr:o;
  const ovl=(flowCfg.enabled!==false && o>0)?clamp(Math.min(numeric(flowCfg.overlapScreens,ovlMax),ovlMax),0,3):0;

  root.style.setProperty("--info-overlap",`${(ovl*100).toFixed(1)}${unit}`);

}
setJourneyScroll();


/* 入口圖片 */
function entranceDone(){
  entranceSettled=true;
  if(interiorWanted) startInteriorImage();
}
function showEntranceImage(){
  entranceHasImage=true;
  entranceImage.hidden=false;
  entranceImage.classList.add("is-loaded");
  entranceFallback.hidden=true;
  measureEntrance();
  requestEntranceUpdate();
  entranceDone();
startDecor();   // Checkpoint 2：背景圖成功載入後，先載入裝飾及背面新人
  if(usingDoorImg) startLeafSheet();   // Checkpoint 3:載入門扇素材表(失敗 → 程式畫嘅木門)

}
function showEntranceFallback(){
  entranceHasImage=false;
  entranceImage.hidden=true;
  entranceFallback.hidden=false;
  requestEntranceUpdate();
  entranceDone();
}
function entranceLoadFailed(){
  if(usingDoorImg && !doorFailed){
    console.warn("Doorway image failed; falling back to the original entrance image and flow.");
    doorFailed=true;
    setJourneyScroll();
    if(startEntranceSources(false)) return;
  }
  showEntranceFallback();
}
entranceImage.addEventListener("load",()=>{
  if(entranceImage.naturalWidth>0) showEntranceImage();
  else entranceLoadFailed();
});
entranceImage.addEventListener("error",()=>{
  console.warn("Chapel entrance image failed.");
  entranceLoadFailed();
});
// useDoorSet=true:用 doorway 圖做整段戶外背景;false:用原本 chapel-entrance 圖
function startEntranceSources(useDoorSet){
  const D=C.door||{};
  const mobileUrl=String((useDoorSet?D.mobileUrl:C.entranceMobileUrl)||"").trim();
  const desktopUrl=String((useDoorSet?D.desktopUrl:C.entranceDesktopUrl)||"").trim();
  if(!mobileUrl && !desktopUrl) return false;
  usingDoorImg=useDoorSet;
  root.style.setProperty("--entrance-pos-portrait",String((useDoorSet?D.positionPortrait:C.entrancePositionPortrait)||"50% 58%"));
  root.style.setProperty("--entrance-pos-landscape",String((useDoorSet?D.positionLandscape:C.entrancePositionLandscape)||"50% 56%"));
  if(desktopUrl) entranceSource.srcset=desktopUrl;
  else entranceSource.removeAttribute("srcset");
  entranceImage.src=mobileUrl||desktopUrl;
  return true;
}
function startEntranceImage(){
  if(entranceStarted) return;
  entranceStarted=true;
  const wantDoor=!!(C.door && C.door.enabled!==false && !doorFailed);
  if(wantDoor){
    if(startEntranceSources(true)) return;
    doorFailed=true;
    setJourneyScroll();
  }
  if(!startEntranceSources(false)) showEntranceFallback();
}

if(document.readyState==="complete"){
  setTimeout(startEntranceImage,600);
}else{
  addEventListener("load",()=>setTimeout(startEntranceImage,600),{once:true});
}

/* 室內圖片 */
function showInteriorImage(){
  interiorHasImage=true;
  interiorImage.hidden=false;
  interiorImage.classList.add("is-loaded");
  interiorFallback.hidden=true;
  requestEntranceUpdate();
  startCoupleImage();
  startForegroundImage();   // 室內圖載入後先下載花草
  updateCoupleVisibility();
  updateForegroundVisibility();
}
function showInteriorFallback(){
  interiorHasImage=false;
  interiorImage.hidden=true;
  interiorFallback.hidden=false;
  requestEntranceUpdate();
  updateCoupleVisibility();
  updateForegroundVisibility(); // 室內圖失敗：花草唔會浮喺佔位上面
}
interiorImage.addEventListener("load",()=>{
  if(interiorImage.naturalWidth>0) showInteriorImage();
  else showInteriorFallback();
});
interiorImage.addEventListener("error",()=>{
  console.warn("Chapel interior image failed; showing placeholder.");
  showInteriorFallback();
});
function startInteriorImage(){
  if(interiorStarted) return;
  interiorStarted=true;
  const mobileUrl=String(C.interiorMobileUrl||"").trim();
  const desktopUrl=String(C.interiorDesktopUrl||"").trim();
  if(desktopUrl) interiorSource.srcset=desktopUrl;
  else interiorSource.remove();
  if(mobileUrl || desktopUrl) interiorImage.src=mobileUrl||desktopUrl;
  else showInteriorFallback();
}
function queueInterior(){
  interiorWanted=true;
  if(entranceSettled) startInteriorImage();
}

/* ==========================================================
   新人插畫（室內；已確認，未改）
   ========================================================== */
function startCoupleImage(){
  if(coupleStarted) return;
  coupleStarted=true;
  const url=String(C.coupleUrl||"").trim();
  if(!url){
    hideCouple();
    return;
  }
  coupleImage.src=url;
}

function hideCouple(){
  coupleReady=false;
  coupleFigure.hidden=true;
  coupleFigure.classList.remove("is-loaded");
  requestCoupleLayout();
}

function cornersOpaque(img){
  try{
    const canvas=document.createElement("canvas");
    const w=canvas.width=Math.max(1,Math.min(64,img.naturalWidth));
    const h=canvas.height=Math.max(1,Math.min(64,img.naturalHeight));
    const ctx=canvas.getContext("2d");
    ctx.drawImage(img,0,0,w,h);
    const data=ctx.getImageData(0,0,w,h).data;
    const points=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]];
    return points.every(([x,y])=>data[(y*w+x)*4+3]>=250);
  }catch(error){
    console.info("Couple illustration: transparency could not be checked here (e.g. opened via file://).",error);
    return false;
  }
}

coupleImage.addEventListener("load",()=>{
  if(!(coupleImage.naturalWidth>0)){
    hideCouple();
    return;
  }
  if(C.coupleHideIfOpaque!==false && cornersOpaque(coupleImage)){
    console.warn("Couple illustration: all four corners are opaque. The background may not be removed. Hidden for now. Set coupleHideIfOpaque:false to show anyway.");
    hideCouple();
    return;
  }
  coupleReady=true;
  updateCoupleVisibility();
});

coupleImage.addEventListener("error",()=>{
  console.warn("Couple illustration failed to load; hidden.");
  hideCouple();
});

function updateCoupleVisibility(){
  const show=coupleReady && interiorHasImage;
  coupleFigure.hidden=!show;
  if(!show){
    coupleFigure.classList.remove("is-loaded");
    requestCoupleLayout();
    return;
  }
  layoutCouple();
  requestAnimationFrame(()=>coupleFigure.classList.add("is-loaded"));
  requestCoupleLayout();
}

function layoutCouple(){
  if(coupleFigure.hidden || !coupleImage.naturalWidth) return;

  const W=interiorStage.offsetWidth;
  const H=interiorStage.offsetHeight;
  if(!W || !H) return;

  const cardTop=interiorCard.offsetTop-interiorStage.offsetTop;
  const cardRight=interiorCard.offsetLeft+interiorCard.offsetWidth-interiorStage.offsetLeft;

  const ratio=coupleImage.naturalWidth/coupleImage.naturalHeight;
  const landscape=landscapeQuery.matches;
  const gap=Math.max(10,H*.02);

  let h,w,left,bottom;

  if(!landscape){
    const feet=Math.min(cardTop-gap,H*.92);
    const want=clamp(numeric(C.coupleHeightPortrait,.36),.15,.6)*H;
    h=Math.min(want,feet-H*.14);
    w=h*ratio;
    const maxW=W*.72;
    if(w>maxW){w=maxW;h=w/ratio}
    const cx=clamp(numeric(C.coupleCenterPortrait,.5),.2,.8)*W;
    left=cx-w/2;
    bottom=H-feet;
  }else{
    h=clamp(numeric(C.coupleHeightLandscape,.5),.15,.75)*H;
    w=h*ratio;
    const maxW=W*.42;
    if(w>maxW){w=maxW;h=w/ratio}
    bottom=clamp(numeric(C.coupleBottomLandscape,.08),0,.4)*H;
    const cx=clamp(numeric(C.coupleCenterLandscape,.56),.2,.85)*W;
    const minLeft=cardRight+gap;
    const maxRight=W*.96;
    left=Math.max(cx-w/2,minLeft);
    if(left+w>maxRight){
      w=Math.max(0,maxRight-left);
      h=w/ratio;
    }
  }

  if(!(h>=70)){
    coupleFigure.style.visibility="hidden";
    return;
  }

  coupleFigure.style.visibility="";
  coupleFigure.style.width=`${w.toFixed(1)}px`;
  coupleFigure.style.height=`${h.toFixed(1)}px`;
  coupleFigure.style.left=`${left.toFixed(1)}px`;
  coupleFigure.style.bottom=`${bottom.toFixed(1)}px`;
}

/* ==========================================================
   花草前景（室內；已確認，未改）
   ========================================================== */
function startForegroundImage(){
  if(fgStarted) return;
  fgStarted=true;
  const mobileUrl=String(C.foregroundMobileUrl||"").trim();
  const desktopUrl=String(C.foregroundDesktopUrl||"").trim();
  if(!mobileUrl && !desktopUrl){
    hideForeground();
    return;
  }
  if(desktopUrl) fgSource.srcset=desktopUrl;
  else fgSource.remove();
  fgImage.src=mobileUrl||desktopUrl;
}

function hideForeground(){
  fgFigure.hidden=true;
  fgFigure.classList.remove("is-loaded");
}

function readAlpha(img){
  try{
    const w=Math.max(1,Math.min(240,img.naturalWidth));
    const h=Math.max(1,Math.round(w*img.naturalHeight/img.naturalWidth));
    const canvas=document.createElement("canvas");
    canvas.width=w;
    canvas.height=h;
    const ctx=canvas.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(img,0,0,w,h);
    const data=ctx.getImageData(0,0,w,h).data;
    let solid=0,soft=0;
    for(let i=3;i<data.length;i+=4){
      if(data[i]>=250) solid++;
      else if(data[i]>8) soft++;
    }
    const total=w*h;
    return {src:img.currentSrc||img.src,w,h,data,opaque:solid/total,soft:soft/total};
  }catch(error){
    return null;
  }
}

fgImage.addEventListener("load",()=>{
  if(!(fgImage.naturalWidth>0)){
    fgReady=false;
    hideForeground();
    return;
  }
  fgAlpha=readAlpha(fgImage);
  const file=(fgImage.currentSrc||fgImage.src).split("/").pop();

  if(fgAlpha){
    console.info(`Foreground ${file}: ${fgImage.naturalWidth}×${fgImage.naturalHeight}px; opaque ${pct(fgAlpha.opaque)}, semi-transparent ${pct(fgAlpha.soft)}, transparent ${pct(1-fgAlpha.opaque-fgAlpha.soft)}. (Edge quality must still be checked by eye.)`);
    if(C.foregroundHideIfOpaque!==false && fgAlpha.opaque>.85){
      console.warn(`Foreground ${file}: most pixels are opaque — the background may not be removed (white or checkerboard). Hidden.`);
      fgReady=false;
      hideForeground();
      return;
    }
  }else{
    console.info(`Foreground ${file}: transparency and overlap could not be checked here (e.g. opened via file://). Shown as-is.`);
  }

  fgReady=true;
  updateForegroundVisibility();
});

fgImage.addEventListener("error",()=>{
  console.warn("Foreground image failed to load; hidden.");
  fgReady=false;
  hideForeground();
});

function updateForegroundVisibility(){
  const show=fgReady && interiorHasImage;
  if(!show){
    hideForeground();
    return;
  }
  fgFigure.hidden=false;
  layoutForeground();
}

function setForeground(visible,note){
  fgFigure.style.visibility=visible?"":"hidden";
  if(visible) requestAnimationFrame(()=>fgFigure.classList.add("is-loaded"));
  else fgFigure.classList.remove("is-loaded");
  if(note && note!==fgLastNote){
    fgLastNote=note;
    console.info(note);
  }
}

function parsePos(value){
  const parts=String(value||"50% 50%").trim().split(/\s+/);
  const f=s=>{
    const m=/^(-?\d+(?:\.\d+)?)%$/.exec(s||"");
    return m?clamp(Number(m[1])/100):.5;
  };
  return [f(parts[0]),f(parts[1])];
}

function coverage(r,map){
  const a=fgAlpha;
  const kx=a.w/fgImage.naturalWidth;
  const ky=a.h/fgImage.naturalHeight;
  const x0=(r.x-map.ox)/map.s*kx, x1=(r.x+r.w-map.ox)/map.s*kx;
  const y0=(r.y-map.oy)/map.s*ky, y1=(r.y+r.h-map.oy)/map.s*ky;
  const area=Math.max(1,(x1-x0)*(y1-y0));
  const sx0=Math.max(0,Math.floor(x0)), sx1=Math.min(a.w,Math.ceil(x1));
  const sy0=Math.max(0,Math.floor(y0)), sy1=Math.min(a.h,Math.ceil(y1));
  let hit=0;
  for(let y=sy0;y<sy1;y++){
    for(let x=sx0;x<sx1;x++){
      if(a.data[(y*a.w+x)*4+3]>48) hit++;
    }
  }
  return Math.min(1,hit/area);
}

function layoutForeground(){
  if(fgFigure.hidden || !fgImage.naturalWidth) return;

  const W=interiorStage.offsetWidth;
  const H=interiorStage.offsetHeight;
  if(!W || !H) return;

  if(H<numeric(C.foregroundMinStageHeight,340)){
    setForeground(false,"Foreground hidden: interior area is too small on this screen.");
    return;
  }

  if(fgAlpha && fgAlpha.src!==(fgImage.currentSrc||fgImage.src)){
    setForeground(false,"");
    return;
  }

  const iw=fgImage.naturalWidth;
  const ih=fgImage.naturalHeight;
  const ratio=iw/ih;
  const landscape=landscapeQuery.matches;

  let mode=String(C.foregroundFit||"auto");
  if(mode!=="frame" && mode!=="bottom"){
    const r2=interiorImage.naturalWidth/interiorImage.naturalHeight;
    mode=(r2 && Math.abs(ratio/r2-1)<.04)?"frame":"bottom";
  }

  const st=fgFigure.style;
  let map;

  if(mode==="frame"){
    fgFigure.classList.remove("is-bottom");
    st.inset="";
    st.left="";
    st.bottom="";
    st.width="";
    st.height="";
    const s=Math.max(W/iw,H/ih);
    const [px,py]=parsePos(landscape?C.interiorPositionLandscape:C.interiorPositionPortrait);
    map={s,ox:(W-iw*s)*px,oy:(H-ih*s)*py};
  }else{
    let w=W,h=W/ratio;
    const maxH=clamp(numeric(C.foregroundBottomMaxHeight,.55),.2,1)*H;
    if(h>maxH){h=maxH;w=h*ratio}
    const left=(W-w)/2;
    fgFigure.classList.add("is-bottom");
    st.inset="auto";
    st.left=`${left.toFixed(1)}px`;
    st.bottom="0px";
    st.width=`${w.toFixed(1)}px`;
    st.height=`${h.toFixed(1)}px`;
    map={s:w/iw,ox:left,oy:H-h};
  }

  fgFigure.dataset.mode=mode;

  if(!fgAlpha){
    setForeground(true,`Foreground shown (${mode} mode); overlap not checked.`);
    return;
  }

  const cx=clamp(numeric(landscape?C.coupleCenterLandscape:C.coupleCenterPortrait,landscape?.56:.5),.2,.85)*W;
  const aisle=landscape
    ?{x:cx-.08*W,y:.4*H,w:.16*W,h:.42*H}
    :{x:cx-.1*W,y:.35*H,w:.2*W,h:.4*H};
  const aisleHit=coverage(aisle,map);

  let coupleHit=0;
  if(!coupleFigure.hidden && coupleFigure.style.visibility!=="hidden" && coupleFigure.offsetWidth){
    coupleHit=coverage({
      x:coupleFigure.offsetLeft,
      y:coupleFigure.offsetTop,
      w:coupleFigure.offsetWidth,
      h:coupleFigure.offsetHeight
    },map);
  }

  const maxCouple=clamp(numeric(C.foregroundMaxCoupleOverlap,.05),0,1);
  const maxAisle=clamp(numeric(C.foregroundMaxAisleOverlap,.08),0,1);

  if(coupleHit>maxCouple || aisleHit>maxAisle){
    setForeground(false,`Foreground hidden (${mode} mode): would cover couple ${pct(coupleHit)} / aisle ${pct(aisleHit)} (limits ${pct(maxCouple)} / ${pct(maxAisle)}).`);
    return;
  }

  setForeground(true,`Foreground shown (${mode} mode): covers couple ${pct(coupleHit)}, aisle ${pct(aisleHit)}.`);
}

function layoutDecorInterior(){
  coupleTicking=false;
  layoutCouple();
  layoutForeground();
}

function requestCoupleLayout(){
  if(coupleTicking) return;
  coupleTicking=true;
  requestAnimationFrame(layoutDecorInterior);
}

if("ResizeObserver" in window){
  new ResizeObserver(requestCoupleLayout).observe(interiorCard);
}

/* ==========================================================
   Checkpoint 2：入口景深裝飾 + 背面新人
   - 入口背景係合併圖，唔可以拆層；呢度只加獨立素材疊層。
   - 疊層喺 #entranceStage 內（唔受背景 zoom 影響），
     所以用數學方式把「背景圖比例座標」換算成畫面座標，
     並套用同背景一樣嘅 zoom / shift，令佢哋貼住背景移動。
   - 前景花葉：移動幅度最大；中景：背面新人；遠景：水紋（極細微）。
   - 任何素材載入失敗／未去背 → 只隱藏該素材。
   ========================================================== */
const decorEl=$("entranceDecor");
const decorFar=$("decorFar");
const decorMid=$("decorMid");
const decorNear=$("decorNear");
const WI=C.walkIn||{};
const DP=C.depth||{};
const FL=DP.florals||{};
const RP=DP.ripples||{};

let decorStarted=false;
const sheets={walk:null,floral:null,ripple:null};
let geom=null;            // 背景圖喺畫面嘅換算資料
let curShiftX=0;   // Checkpoint 3:推近時水平位移(令門洞移向畫面中心)
let curZoom=1, curShift=0;

let walker=null;          // {box,img}
let nearItems=[], farItems=[];

function sheetOpaque(im,name){
  try{
    const c=document.createElement("canvas");
    c.width=32;c.height=32;
    const ctx=c.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(im,0,0,32,32);
    const d=ctx.getImageData(0,0,32,32).data;
    const pts=[[0,0],[31,0],[0,31],[31,31]];
    const opaque=pts.every(([x,y])=>d[(y*32+x)*4+3]>=250);
    if(opaque) console.warn(`${name}: all four corners are opaque — probably a black (not transparent) background. Hidden. (No pixels were modified.)`);
    return opaque;
  }catch(error){
    console.info(`${name}: transparency could not be checked here (e.g. opened via file://). Shown as-is; if you see black boxes, test via a local server or set enabled:false.`);
    return false;
  }
}

function loadSheet(key,url,name){
  const raw=String(url||"").trim();
  if(!raw) return;
  let abs;
  try{abs=new URL(raw,document.baseURI).href}catch(error){console.warn(name,"path error:",error);return}
  const im=new Image();
  im.onload=()=>{
    if(!(im.naturalWidth>0)) return;
    if(sheetOpaque(im,name)) return;
    sheets[key]={url:abs};
    buildDecor();
    requestEntranceUpdate();
  };
  im.onerror=()=>console.warn(`${name} failed to load; that decoration is hidden.`);
  im.src=abs;
}

function startDecor(){
  if(decorStarted) return;
  decorStarted=true;
  if(WI.enabled!==false) loadSheet("walk",WI.sheetUrl,"Walk-in sheet");
  if(DP.enabled!==false){
    loadSheet("floral",FL.sheetUrl,"Florals sheet");
    loadSheet("ripple",RP.sheetUrl,"Sea ripples sheet");
  }
}

function makeSprite(url){
  const box=document.createElement("div");
  box.className="deco";
  const clip=document.createElement("div");
  clip.className="deco-clip";
  const img=document.createElement("img");
  img.alt="";
  img.draggable=false;
  img.decoding="async";
  img.addEventListener("error",()=>{box.hidden=true});
  img.src=url;
  clip.append(img);
  box.append(clip);
  return {box,img};
}

// 以素材表 crop（sheetRef 單位）顯示，boxW = 畫面上嘅闊度（px）。回傳高度。
function fitSprite(sp,ref,crop,boxW,dx=0,dy=0){
  const k=boxW/crop.w;
  sp.box.style.width=`${boxW.toFixed(1)}px`;
  sp.box.style.height=`${(crop.h*k).toFixed(1)}px`;
  sp.img.style.width=`${(ref*k).toFixed(1)}px`;
  sp.img.style.left=`${(-(crop.x+dx)*k).toFixed(1)}px`;
  sp.img.style.top=`${(-(crop.y+dy)*k).toFixed(1)}px`;
  return crop.h*k;
}

function buildDecor(){
  const land=landscapeQuery.matches;

  if(sheets.walk && WI.enabled!==false && !walker){
    walker=makeSprite(sheets.walk.url);
    const shadow=document.createElement("div");
    shadow.className="deco-shadow";
    walker.box.prepend(shadow);
    decorMid.append(walker.box);
  }

  decorNear.replaceChildren();
  nearItems=[];
  if(sheets.floral && DP.enabled!==false){
    for(const cfg of (land?FL.landscape:FL.portrait)||[]){
      const crop=(FL.crops||{})[cfg.crop];
      if(!crop) continue;
      const sp=makeSprite(sheets.floral.url);
      decorNear.append(sp.box);
      nearItems.push({sp,cfg,crop});
    }
  }

  decorFar.replaceChildren();
  farItems=[];
  if(sheets.ripple && DP.enabled!==false){
    for(const cfg of (land?RP.landscape:RP.portrait)||[]){
      const crop=(RP.crops||{})[cfg.crop];
      if(!crop) continue;
      const sp=makeSprite(sheets.ripple.url);
      decorFar.append(sp.box);
      farItems.push({sp,cfg,crop});
    }
  }
}

function imgToStage(u,v){
  const bx=geom.ox+u*geom.iw*geom.s;
  const by=geom.oy+v*geom.ih*geom.s;
  return {
    x:geom.fx+(bx-geom.fx)*curZoom+curShiftX,

    y:geom.fy+(by-geom.fy)*curZoom+curShift
  };
}

function decorWanted(){
  return !isStatic() && !paused && entranceHasImage && !!geom && (!!walker || nearItems.length>0 || farItems.length>0);
}

function updateDecor(pe,pd=0){

  const on=decorWanted();
  decorEl.hidden=!on;
  entrance.classList.toggle("walker-on",on && !!walker);
  if(!on) return;

  const land=landscapeQuery.matches;
  const dFadeS=numeric(DP.fadeStart,.84), dFadeE=Math.max(dFadeS+.01,numeric(DP.fadeEnd,.96));
  const fadeOut=1-smooth(clamp((pe-dFadeS)/(dFadeE-dFadeS)));
  const fadeIn=smooth(clamp(pe/.1));

  /* 遠景：水紋（跟背景，只做細微水平漂移） */
  for(const it of farItems){
    const c=it.cfg;
    const p=imgToStage(numeric(c.u,.5),numeric(c.v,.6));
    const bw=numeric(c.w,.12)*geom.iw*geom.s*curZoom;
    const bh=fitSprite(it.sp,numeric(RP.sheetRef,1024),it.crop,bw);
    const mx=numeric(c.moveX,0)*pe;
    it.sp.box.style.transform=`translate3d(${(p.x-bw/2+mx).toFixed(1)}px,${(p.y-bh/2).toFixed(1)}px,0)`;
    it.sp.box.style.opacity=(numeric(c.opacity,.5)*fadeIn*fadeOut).toFixed(3);
  }

  /* 中景：背面新人 */
  if(walker){
    const T=WI.timing||{};
const L=(unifiedDoor()?(land?WI.landscape:WI.portrait):(land?WI.landscapeEntrance:WI.portraitEntrance))||{};

    const ap=smooth(clamp((pe-T.appearStart)/Math.max(.01,T.appearEnd-T.appearStart)));
const uniW=unifiedDoor();
    const eS=numeric(T.enterStart,.42), eE=Math.max(eS+.05,numeric(T.enterEnd,.92)), eF=numeric(T.enterFadeStart,.62);
    const eN=uniW?clamp((pd-eS)/(eE-eS)):0;   // 入門進度
    const lp=uniW
      ?smooth(clamp((pd-eF)/Math.max(.01,eE-eF)))
      :smooth(clamp((pe-numeric(T.leaveStart,.84))/Math.max(.01,numeric(T.leaveEnd,.95)-numeric(T.leaveStart,.84))));

    const alpha=ap*(1-lp);
    if(alpha<=.003){
      walker.box.style.opacity="0";
    }else{
      const wp=clamp((pe-T.walkStart)/Math.max(.01,T.walkEnd-T.walkStart));
		const X=lerp(lerp(L.startX,L.endX,wp),numeric(L.inX,L.endX),eN);

		const Y=lerp(lerp(L.startY,L.endY,wp),numeric(L.inY,L.endY),eN);

const Hn=lerp(lerp(L.startH,L.endH,wp),numeric(L.inH,L.endH),eN);

      const order=(WI.frameOrder&&WI.frameOrder.length)?WI.frameOrder:[0,1,2,3];
      const n=order.length;
const idx=eN>0?Math.floor(eN*numeric(WI.enterCycles,1.5)*n)%n:Math.floor(wp*numeric(WI.cycles,5)*n)%n;   // 停留時定格喺第一格

      const f=(WI.frames||[])[order[idx]]||{x:0,y:0};
      const crop={x:f.x,y:f.y,w:numeric(WI.cropW,400),h:numeric(WI.cropH,480)};
      const boxH=Hn*geom.ih*geom.s*curZoom;
      const boxW=boxH*crop.w/crop.h;
      fitSprite(walker.sp||walker,numeric(WI.sheetRef,1024),crop,boxW,numeric(f.dx,0),numeric(f.dy,0));
      const p=imgToStage(X,Y);
      const bottom=p.y+numeric(WI.feetInset,.04)*boxH;
      walker.box.style.transform=`translate3d(${(p.x-boxW/2).toFixed(1)}px,${(bottom-boxH).toFixed(1)}px,0)`;
      walker.box.style.opacity=alpha.toFixed(3);
    }
  }

  /* 前景：花葉（移動幅度最大） */
  for(const it of nearItems){
    const c=it.cfg;
    const bw=numeric(c.w,.25)*geom.W;
    const bh=fitSprite(it.sp,numeric(FL.sheetRef,1024),it.crop,bw);
    const s=1+numeric(c.grow,0)*pe;
    const cx=numeric(c.x,.5)*geom.W+numeric(c.moveX,0)*pe;
    const cy=numeric(c.y,.9)*geom.H+numeric(c.moveY,0)*pe;
    it.sp.box.style.transform=`translate3d(${(cx-bw/2).toFixed(1)}px,${(cy-bh/2).toFixed(1)}px,0) scale(${c.flip?-s:s},${s})`;
    it.sp.box.style.opacity=(numeric(c.opacity,.9)*fadeIn*fadeOut).toFixed(3);
  }
}

/* ==========================================================
   scroll 控制：入口走近 → 紙色 → 室內
   ========================================================== */
let zoomMax=1;
let focusY=.62;
let stageHeight=0;
let entranceTicking=false;

function parseFocusY(value,fallback){
  const parts=String(value||"").trim().split(/\s+/);
  const match=/^(-?\d+(?:\.\d+)?)%$/.exec(parts[1]||"");
  return match?clamp(Number(match[1])/100):fallback;
}
function parseFocusX(value,fallback){
  const parts=String(value||"").trim().split(/\s+/);
  const match=/^(-?\d+(?:\.\d+)?)%$/.exec(parts[0]||"");
  return match?clamp(Number(match[1])/100):fallback;
}

function measureEntrance(){
  const landscape=landscapeQuery.matches;
  const focus=String((landscape?C.entranceFocusLandscape:C.entranceFocusPortrait)||"").trim()||(landscape?"50% 72%":"50% 62%");
  entranceZoom.style.transformOrigin=focus;
  focusY=parseFocusY(focus,landscape?.72:.62);
  const focusX=parseFocusX(focus,.5);

  const rect=entranceStage.getBoundingClientRect();
  stageHeight=rect.height;

  const configured=clamp(numeric(C.entranceZoomMax,1.5),1,2);
  let allowed=configured;

  if(entranceImage.naturalWidth && rect.width && rect.height){
    const cover=Math.max(rect.width/entranceImage.naturalWidth,rect.height/entranceImage.naturalHeight);
    const dpr=Math.min(devicePixelRatio||1,2);
    const sharpness=clamp(numeric(C.entranceMinSharpness,.5),.2,1);
    allowed=1/(cover*dpr*sharpness);

    // Checkpoint 2：背景圖換算資料（object-fit:cover + object-position）
    const iw=entranceImage.naturalWidth, ih=entranceImage.naturalHeight;
    const W=entranceStage.offsetWidth, H=entranceStage.offsetHeight;
    const s=Math.max(W/iw,H/ih);
const [px,py]=parsePos(unifiedDoor()?(landscape?DR.positionLandscape:DR.positionPortrait):(landscape?C.entrancePositionLandscape:C.entrancePositionPortrait));

    geom={W,H,iw,ih,s,ox:(W-iw*s)*px,oy:(H-ih*s)*py,fx:focusX*W,fy:focusY*H};
  }else{
    geom=null;
  }

  zoomMax=clamp(allowed,Math.min(configured,1.15),configured);
  measureDoor();
  storyMeasured=false;   // 尺寸／方向／語言改變 → 故事卡重新檢查空間
}

/* ==========================================================
   Checkpoint 3:開門(門扇層)
   - 門扇層 #doorCanvas 放喺 #entranceZoom 內,貼住背景圖(cover)換算位置。
   - doorway 背景圖失敗時,由 entranceLoadFailed() 回到原入口圖流程。
   ========================================================== */
const DR=C.door||{};
const doorCanvas=$("doorCanvas");
const doorPatch=$("doorPatch");
const doorLeaves=$("doorLeaves");
const leafL=$("leafL");
const leafR=$("leafR");

let doorLeafSheet="";


function startLeafSheet(){
  const L=DR.leaves||{};
  const url=String(L.sheetUrl||"").trim();
  if(L.source==="plain" || !url){applyLeafLook();return}
  let abs;
  try{abs=new URL(url,document.baseURI).href}catch(error){console.warn("Door sheet path error:",error);applyLeafLook();return}
  const im=new Image();
  im.onload=()=>{
    if(im.naturalWidth>0 && !sheetOpaque(im,"Door sheet")) doorLeafSheet=abs;
    applyLeafLook();
    requestEntranceUpdate();
  };
  im.onerror=()=>{console.warn("Door sheet failed to load; using plain wooden leaves.");applyLeafLook()};
  im.src=abs;
}

function cropLeaf(el,c){
  const L=DR.leaves||{};
  const sw=numeric(L.sheetW,1024), sh=numeric(L.sheetH,1024);
  el.classList.remove("plain");
  el.style.backgroundImage=`url(${JSON.stringify(doorLeafSheet)})`;
  el.style.backgroundSize=`${(sw/c.w*100).toFixed(2)}% ${(sh/c.h*100).toFixed(2)}%`;
  el.style.backgroundPosition=`${sw>c.w?(c.x/(sw-c.w)*100).toFixed(2):0}% ${sh>c.h?(c.y/(sh-c.h)*100).toFixed(2):0}%`;
}

function applyLeafLook(){
  leafLookDone=true;

  const cfg=(landscapeQuery.matches?DR.landscape:DR.portrait)||{};
  if(doorLeafSheet && cfg.leafL && cfg.leafR){
    cropLeaf(leafL,cfg.leafL);
    cropLeaf(leafR,cfg.leafR);
  }else{
    for(const el of [leafL,leafR]){
      el.style.backgroundImage="";
      el.classList.add("plain");
    }
  }
}
/* ==========================================================
   Checkpoint 3(統一畫面版):doorway 圖做整段戶外背景

   - 門扇 + 墊底層放入 #entranceZoom,同背景一齊縮放。
   - 新人(decor 層)用同一組 geom / curZoom / curShift 換算。
   - 冇任何全畫面遮罩:開門後鏡頭推近,室內圖直接交叉淡入。
   ========================================================== */
doorCanvas.hidden=true;
let leafLookDone=false;

let doorEnd={zoom:3};
if(DR.debug){
  doorPatch.style.outline="2px solid #e33";
  leafL.style.outline="2px solid #36e";
  leafR.style.outline="2px solid #36e";
}

function unifiedDoor(){
  return usingDoorImg && entranceHasImage && !doorFailed && DR.enabled!==false;
}

function measureDoor(){
  if(!unifiedDoor() || !geom){doorCanvas.hidden=true;return}
  const land=landscapeQuery.matches;
  const cfg=(land?DR.landscape:DR.portrait)||{};
  const o=cfg.opening;
  if(!o){doorCanvas.hidden=true;return}

  const cw=geom.iw*geom.s, ch=geom.ih*geom.s;
  const cs=doorCanvas.style;
  cs.left=`${geom.ox.toFixed(1)}px`;
  cs.top=`${geom.oy.toFixed(1)}px`;
  cs.width=`${cw.toFixed(1)}px`;
  cs.height=`${ch.toFixed(1)}px`;

  for(const el of [doorPatch,doorLeaves]){
    el.style.left=`${(o.l*100).toFixed(2)}%`;
    el.style.top=`${(o.t*100).toFixed(2)}%`;
    el.style.width=`${((o.r-o.l)*100).toFixed(2)}%`;
    el.style.height=`${((o.b-o.t)*100).toFixed(2)}%`;
  }
  doorPatch.style.borderRadius=cfg.archRadius||"0";
  doorPatch.style.backgroundImage="none";
  doorPatch.style.backgroundColor=DR.backingColor||"#b98a5e";
  doorPatch.style.boxShadow="none";
  doorLeaves.style.perspective=`${Math.max(300,(o.r-o.l)*cw*4).toFixed(0)}px`;

  // 推近中心 = 門洞中心(跟背景同一座標系)
  geom.fx=geom.ox+((o.l+o.r)/2)*cw;
  geom.fy=geom.oy+(o.t+(o.b-o.t)*numeric(DR.focusInDoor,.55))*ch;
  entranceZoom.style.transformOrigin=`${geom.fx.toFixed(1)}px ${geom.fy.toFixed(1)}px`;
  doorEnd={zoom:Math.max(1,numeric(cfg.zoomEnd,3))};

  if(leafLookDone) applyLeafLook();
}

function updateDoorLayers(on,pe,pd,pt){
  doorCanvas.hidden=!on;
  if(!on) return;
  const T=DR.timing||{};
  const oS=numeric(T.openStart,.08);
  const oE=Math.max(oS+.05,numeric(T.openEnd,.6));
  const open=smooth(clamp((pd-oS)/(oE-oS)));
  const ang=open*numeric(DR.maxAngle,82);
  const leafFade=1-smooth(clamp(pt/Math.max(.01,numeric(T.leafFadePt,.35))));
  const ready=leafLookDone;   // 門扇外觀未準備好前唔顯示,避免閃一下

  doorPatch.style.opacity="0";
  doorLeaves.style.opacity=ready?leafFade.toFixed(3):"0";

  leafL.style.transform=`rotateY(${ang.toFixed(2)}deg)`;
  leafR.style.transform=`rotateY(${(-ang).toFixed(2)}deg)`;
}

/* VENUE 外景:固定在畫面原位,只用 opacity 淡入/淡出。
   淡入與 #infoBackdrop 退出互補(同一個 fadeOutScreens);淡出在 footer 進入前完成。
   把 #venueArt 移到 #infoBackdrop 之前(同層 z-index:0,後者畫在上面),
   令新人及鐘不會被 VENUE 外景遮住。 */
(function placeVenueArt(){
  const a=$("venueArt"), b=$("infoBackdrop");
  if(a && b && b.parentNode) b.parentNode.insertBefore(a,b);
})();

function updateVenueBack(){
  const art=$("venueArt"), zone=$("venueZone");
  if(!art || !zone || !detailsMain) return;
  const vh=innerHeight||1;
  const dm=detailsMain.getBoundingClientRect();
  const zr=zone.getBoundingClientRect();
  const fo=Math.max(.2,numeric((C.infoFlow||{}).fadeOutScreens,.5));
  const inV=1-smooth(clamp(dm.bottom/(vh*fo)));          // 日期時間區結束時淡入
  const outV=smooth(clamp(zr.bottom/(vh*.7)));            // 「出發之前」結束、footer 前淡出
  art.style.opacity=(inV*outV).toFixed(3);
}

function updateEntrance(){
  applyStoryMode();

  updateInfoFlow();
  updateVenueBack();

  entranceTicking=false;


  if(isStatic()){
    entranceZoom.style.transform="none";
    entranceVeil.style.opacity="0";
    sceneInterior.style.opacity="";
    interiorZoom.style.transform="";
    entrance.classList.remove("is-walking");
    curZoom=1;curShift=0;curShiftX=0;
    updateDecor(0);
    updateDoorLayers(false,0,0,0);
    setCards(true,true);
    return;
  }

  const rect=entrance.getBoundingClientRect();
  const p=clamp(-rect.top/journeyDistance());
  const pe=clamp(p/fracA);
  const pd=fracD>0?clamp((p-fracA)/fracD):0;
  const pt=clamp((p-fracA-fracD)/fracT);

  if(pe>.3 && rect.bottom>0) startInteriorImage();
if(pe>.3 && rect.bottom>0) startWalkOut();
  
  const poAll=fracO>0?clamp((p-fracA-fracD-fracT-fracH)/fracO):0;   // 走出段 + 故事段
  const pw=fracW>0?clamp(poAll/fracW):0;                              // 走路進度(與原本走出段相同)
  const ps=fracW<1?clamp((poAll-fracW)/(1-fracW)):0;                  // 故事段進度
  const sq=(fracO>0 && fracW<1 && unifiedDoor() && !!geom)?smooth(clamp(ps/Math.max(.05,numeric((C.story||{}).backdropEnd,.45)))):0;
  const bq=sq;

  entrance.classList.toggle("is-walking",pe>.03);

  if(paused){
    const inside=pt>=.5;
    entranceZoom.style.transform="none";
    entranceVeil.style.opacity="0";
    sceneInterior.style.opacity=inside?"1":"0";
    interiorZoom.style.transform="none";
    curZoom=1;curShift=0;curShiftX=0;
    updateDecor(pe,pd);                 // 暫停 → 裝飾、新人隱藏
    updateDoorLayers(false,0,0,0);      // 暫停 → 門扇隱藏,只顯示 doorway 圖本身
    setCards(!inside,inside);
    return;
  }

  const uni=unifiedDoor() && !!geom;

  if(uni){
    const zWalk=numeric(DR.zoomWalk,1.1), zOpen=numeric(DR.zoomOpen,1.45);
    const zThru=Math.max(1,doorEnd.zoom/(zWalk*zOpen));
const zoomIn=lerp(1,zWalk,smooth(pe))*lerp(1,zOpen,smooth(pd))*lerp(1,zThru,smooth(pt));
    const zoom=bq>0?lerp(zoomIn,Math.min(zoomIn,1),bq):zoomIn;   // 故事段:鏡頭拉回至完整門口外景


    // 推近同時,逐步將門洞移向畫面中心(限制位移,避免露出圖片邊緣)
const c=clamp(.6*smooth(pd)+.4*smooth(clamp(pt/.6)))*(1-bq);

    const W=geom.W, H=geom.H;
    let tx=(W*.5-geom.fx)*c, ty=(H*.5-geom.fy)*c;
    tx=clamp(tx,-(W-geom.fx)*(zoom-1),geom.fx*(zoom-1));
    ty=clamp(ty,-(H-geom.fy)*(zoom-1),geom.fy*(zoom-1));
    entranceZoom.style.transform=`translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) scale(${zoom.toFixed(4)})`;
    curZoom=zoom;curShift=ty;curShiftX=tx;
  }else if(entranceHasImage){
    // 後備(舊入口圖 / 近景段取消):原本推近
    const eased=smooth(pe);
    const zoom=1+(zoomMax-1)*eased;
    let shift=(.5-focusY)*stageHeight*.35*eased;
    const slackDown=(zoom-1)*focusY*stageHeight;
    const slackUp=(zoom-1)*(1-focusY)*stageHeight;
    shift=clamp(shift,-slackUp,slackDown);
    entranceZoom.style.transform=`translate(0,${shift.toFixed(1)}px) scale(${zoom.toFixed(4)})`;
    curZoom=zoom;curShift=shift;curShiftX=0;
  }else{
    entranceZoom.style.transform="none";
    curZoom=1;curShift=0;curShiftX=0;
  }

  updateDecor(pe,pd);
updateDoorLayers(uni,pe,pd,pt);


  // 統一畫面:冇任何全畫面遮罩。只有後備流程先用舊暖紙色過渡。
  const veil=uni?0:.55*clamp((pe-.82)/.18)+.37*clamp(pt/.45);
  entranceVeil.style.opacity=veil.toFixed(3);

  // 室內圖喺鏡頭推近門洞期間直接交叉淡入
  const fade=(uni?smooth(clamp((pt-.15)/.6)):smooth(clamp((pt-.3)/.6)))*(1-bq);

  sceneInterior.style.opacity=fade.toFixed(3);

  const settle=interiorHasImage?1+.05*(1-smooth(pt)):1;
  interiorZoom.style.transform=`scale(${settle.toFixed(4)})`;
  updateWalkOut(pw);
  updateStory(pw,ps);
  const ph=fracH>0?clamp((p-fracA-fracD-fracT)/fracH):1;   // 室內停留進度
  setCards(pt<.45,pt>=.5 && poAll<.02 && (fracO<=0 || ph<clamp(numeric(STORY.welcomeHideAt,.8),.3,.98)));


}

/* ==========================================================
   Checkpoint 4：室內停留 → 新人走出
   - 人物放喺室內畫面內（interiorZoom），跟室內插畫位置起步，向畫面下方走出並放大。
   - 素材缺少／失敗／疑似黑底 → 取消走出段，流程退回之前嘅室內停留 → 請帖。
   ========================================================== */
const WO=C.walkOut||{};
let outSprite=null;
let outReady=false;
let outStarted=false;

function outFail(){
  if(walkOutFailed) return;
  walkOutFailed=true;
  outReady=false;
  setJourneyScroll();
  requestEntranceUpdate();
}

function startWalkOut(){
  const raw=String(WO.sheetUrl||"").trim();
  if(WO.enabled===false || !raw || outStarted || walkOutFailed) return;
  outStarted=true;
  let abs;
  try{abs=new URL(raw,document.baseURI).href}catch(error){console.warn("Walk-out path error:",error);outFail();return}
  const im=new Image();
  im.onload=()=>{
    if(!(im.naturalWidth>0) || sheetOpaque(im,"Walk-out sheet")){outFail();return}
    outSprite=makeSprite(abs);
    outSprite.box.classList.add("out-sprite");
    interiorZoom.append(outSprite.box);
    outReady=true;
    requestEntranceUpdate();
  };
  im.onerror=()=>{console.warn("Walk-out sheet failed to load; skipping the walk-out.");outFail()};
  im.src=abs;
}

function updateWalkOut(po){
  const on=po>0 && outReady && !!outSprite && !isStatic() && !paused;
  coupleFigure.classList.toggle("out-on",on);
  if(!on){
    coupleFigure.style.opacity="";
    if(outSprite) outSprite.box.style.opacity="0";
    return;
  }
  const W=interiorStage.offsetWidth, H=interiorStage.offsetHeight;
  if(!W || !H) return;

  const L=(landscapeQuery.matches?WO.landscape:WO.portrait)||{};
  const T=WO.timing||{};
  let sx=numeric(L.startX,.5), sy=numeric(L.startY,.85), sh=numeric(L.startH,.3);
  if(L.followCouple!==false && !coupleFigure.hidden && coupleFigure.offsetWidth>0){
    sx=(coupleFigure.offsetLeft+coupleFigure.offsetWidth/2)/W;
    sy=(coupleFigure.offsetTop+coupleFigure.offsetHeight)/H;
    sh=coupleFigure.offsetHeight/H*numeric(L.startHScale,1);
  }

  const swapEnd=Math.max(.02,numeric(T.swapEnd,.14));
  const swap=smooth(clamp(po/swapEnd));
  const wp=clamp((po-swapEnd*.5)/(1-swapEnd*.5));
  const e=smooth(wp);
  const fo=numeric(T.fadeOutStart,.82);
  const outFade=1-smooth(clamp((po-fo)/Math.max(.01,1-fo)));

  const X=lerp(sx,numeric(L.endX,sx),e);
  const Y=lerp(sy,numeric(L.endY,1.12),e);
  const Hn=lerp(sh,numeric(L.endH,.6),e);

  const order=(WO.frameOrder&&WO.frameOrder.length)?WO.frameOrder:[0,1,2,3];
  const n=order.length;
  const idx=Math.floor(wp*numeric(WO.cycles,3)*n)%n;
  const f=(WO.frames||[])[order[idx]]||{x:0,y:0};
  const crop={x:f.x,y:f.y,w:numeric(WO.cropW,400),h:numeric(WO.cropH,480)};
  const boxH=Hn*H;
  const boxW=boxH*crop.w/crop.h;
  fitSprite(outSprite,numeric(WO.sheetRef,1024),crop,boxW,numeric(f.dx,0),numeric(f.dy,0));
  const bottom=Y*H+numeric(WO.feetInset,.04)*boxH;
  outSprite.box.style.transform=`translate3d(${(X*W-boxW/2).toFixed(1)}px,${(bottom-boxH).toFixed(1)}px,0)`;
  outSprite.box.style.opacity=(swap*outFade).toFixed(3);
  coupleFigure.style.opacity=(1-swap).toFixed(3);   // 室內插畫同走出人物交叉淡換
}

/* ==========================================================
   素材探測(新人動作表、鐘共用)
   - 只做載入及四角 alpha 檢查。四角全不透明 → 當未去背而不顯示(唔改任何像素)。
   - ⚠️ 四角檢查不能證明整張素材去背良好;黑框、殘邊仍須肉眼檢查。
   ========================================================== */

function bellProbe(url,name){
  return new Promise(resolve=>{
    let abs;
    try{abs=new URL(String(url||"").trim(),document.baseURI).href}catch(error){console.warn(name,"path error:",error);resolve(null);return}
    const im=new Image();
    im.onload=()=>resolve(im.naturalWidth>0 && !sheetOpaque(im,name)?abs:null);
    im.onerror=()=>{console.warn(`${name} failed to load.`);resolve(null)};
    im.src=abs;
  });
}


/* ==========================================================
   資訊與故事並行(Checkpoint 4 調整)
   - 走出段:請帖資訊升起;場景淡出,同時 fixed 淡背景淡入。
   - 新人靜止,鐘持續輕擺(無敲鐘、無聲音)。

   - 全部由 scroll 位置決定顯示,唔鎖 scroll;素材失敗只隱藏裝飾。
   ========================================================== */
const FLOW=C.infoFlow||{};
const BB=C.bellBack||{};
const infoBackdrop=$("infoBackdrop");
const bellBackEl=$("bellBack");
const bellBackImg=$("bellBackImage");
const bellBackSource=$("bellBackDesktopSource");
const bellGap=$("bellGap");
const bellFigs=$("stageFigures");
const letterEl=document.querySelector(".letter");
const noticeEl=document.querySelector("#detailsMain .notice");

let bbClock=0, bbLastTick=0;



const detailsMain=$("detailsMain");

let bbStarted=false, bbImageOK=false, bbSpritesOK=false;
let bbCouple=null, bbBell=null, bbGeom=null;
let bbVisible=false, bbRaf=0;


bellBackImg.addEventListener("load",()=>{
  if(bellBackImg.naturalWidth>0){
    bbImageOK=true;
    bellBackImg.classList.add("is-loaded");
    requestEntranceUpdate();
  }
});
bellBackImg.addEventListener("error",()=>{
  bbImageOK=false;
  console.warn("Bell backdrop image failed; backdrop skipped (invitation unaffected).");
});

function startInfoBack(){
  if(bbStarted || FLOW.enabled===false || BB.enabled===false) return;
  bbStarted=true;
  const m=String(BB.mobileUrl||"").trim(), d=String(BB.desktopUrl||"").trim();
  if(!m && !d) return;
  if(d) bellBackSource.srcset=d; else bellBackSource.remove();
 bellBackImg.src=m||d;


  const cu=String(BB.coupleUrl||"").trim(), bu=String(BB.bellUrl||"").trim();
  if(!cu || !bu) return;
  Promise.all([bellProbe(cu,"Bell action sheet"),bellProbe(bu,"Wedding bell")]).then(([cAbs,bAbs])=>{
    if(!cAbs || !bAbs){
      console.warn("Bell figures skipped: asset missing, failed, or not transparent. Backdrop only.");
      return;
    }
    bbCouple=makeSprite(cAbs);
    bbBell=makeSprite(bAbs);
    const shadow=document.createElement("div");
    shadow.className="bell-shadow";
    bbCouple.box.prepend(shadow);
    bbCouple.box.style.opacity="1";
    bbBell.box.style.opacity="1";
    bellFigs.append(bbBell.box,bbCouple.box);   // 鐘喺後,新人喺前
    bbSpritesOK=true;
    requestEntranceUpdate();
  });
}

/* 電腦版新人可用嘅水平空間:文字欄靠右(寬 min(560px,58vw)),左邊留俾新人及鐘。
   數值對應 CSS 嘅 body.fig-on 排版,必須同步。 */
function figSpaceLandscape(){
  const vw=document.documentElement.clientWidth||innerWidth;
  const pad=vw<=760?20:24;
  const cw=Math.min(980,vw-pad*2);
  const textW=Math.min(560,vw*.58);
  const textLeft=(vw-cw)/2+cw-textW;
  return {x0:16,x1:textLeft-20};
}

/* 決定新人及鐘係咪顯示(body.fig-on),並計算位置。回傳 true = 顯示。
   - 手機:新人及鐘喺文件內 #bellGap,隨內容捲動。
   - 電腦:新人及鐘喺固定背景層左側,文字靠右,左右分區。
   - 放唔落(太窄／太矮)、背景圖或素材失敗 → 不顯示,文字回復置中,冇空位留低。 */
function layoutBellBack(){
  bbGeom=null;
  const land=landscapeQuery.matches;
  const assets=FLOW.enabled!==false && BB.enabled!==false && bbImageOK && bbSpritesOK;
  let ok=false, host=bellGap, g=null;

  if(assets){
    const L=(land?BB.landscape:BB.portrait)||{};
    const cropW=numeric(BB.cropW,390), cropH=numeric(BB.cropH,490);
    const ref=numeric(BB.bellRef,1024), sc=numeric(BB.bellScale,.27);
    const feet=numeric(BB.feetInset,.09);
    // 新人框 + 鐘嘅合併範圍(裁切框座標)
    const bx=numeric(BB.handX,339)-numeric(BB.bellGripX,512)*sc;
    const by=numeric(BB.handY,124)-numeric(BB.bellGripY,650)*sc;
    const uL=Math.min(0,bx), uR=Math.max(cropW,bx+ref*sc), uT=Math.min(0,by);
    const uW=uR-uL, vis=cropH*(1-feet)-uT;   // 由最高點到腳底嘅高度
    const vw=document.documentElement.clientWidth||innerWidth;
    let W,H,x0,x1,topLimit=0;

    if(land){
      host=infoBackdrop;
      W=vw; H=innerHeight||1;
      const sp=figSpaceLandscape();
      x0=sp.x0; x1=sp.x1;
      topLimit=(topbar?topbar.offsetHeight:0)+12;
    }else{
      host=bellGap;
      const r=bellGap.getBoundingClientRect();
      if(r.height>0){W=r.width;H=r.height}
      else{
        const pad=vw<=760?20:24;
        W=Math.min(980,vw-pad*2);
        H=clamp(.36*(innerHeight||1),240,380);
      }
      x0=0; x1=W;
    }

    const bottomFrac=numeric(L.bottom,.04);
    const maxH=land
      ?Math.min(H*numeric(L.h,.62),H-topLimit-H*bottomFrac)
      :H*numeric(L.h,.92);
    const availW=(x1-x0)*(land?1:.92);
    const k=Math.min(availW/uW,maxH/vis);

    if(k>0 && cropH*k>=numeric(BB.minHeightPx,150)){
      const left=x0+((x1-x0)-uW*k)/2;
      const bottomY=H*(1-bottomFrac);
      g={gx:left-uL*k,gy:bottomY-cropH*(1-feet)*k,boxW:cropW*k,boxH:cropH*k,k};
      ok=true;
    }
  }
  const wasOn=document.body.classList.contains("fig-on");
  document.body.classList.toggle("fig-on",ok);
  if(wasOn!==ok) requestAnimationFrame(requestEntranceUpdate);

  if(!ok) return false;
  if(bellFigs.parentNode!==host) host.append(bellFigs);
  bbGeom=g;
  return true;
}

/* 新版(唯一生效):內部時鐘 bbClock 只在播放時累計;暫停即凍結 */
function renderBellBack(clock){
  if(!bbSpritesOK || !bbGeom) return;
  const g=bbGeom, SW=BB.swing||{};
  const idx=clamp(Math.round(numeric(BB.staticFrame,3)),0,Math.max(0,(BB.frames||[]).length-1));
  // 鐘:平滑正弦循環。clock 只在播放且可見時累計 → 暫停凍結、恢復不跳位;減少動態 = 不擺
  const period=Math.max(1,numeric(SW.periodSec,5.5));
  const ang=isStatic()?0:numeric(SW.maxDeg,2.5)*Math.sin(2*Math.PI*(clock/1000)/period);


  const cropW=numeric(BB.cropW,390), cropH=numeric(BB.cropH,490);
  const f=(BB.frames||[])[idx]||{x:0,y:0};
  fitSprite(bbCouple,numeric(BB.sheetRef,1024),{x:f.x,y:f.y,w:cropW,h:cropH},g.boxW,numeric(f.dx,0),numeric(f.dy,0));
  bbCouple.box.style.transform=`translate3d(${g.gx.toFixed(1)}px,${g.gy.toFixed(1)}px,0)`;   // 與鐘共用同一組 g.gx / g.gy

  const ref=numeric(BB.bellRef,1024), sc=numeric(BB.bellScale,.27);
  const bx=g.gx+(numeric(BB.handX,339)-numeric(BB.bellGripX,512)*sc)*g.k;
  const by=g.gy+(numeric(BB.handY,124)-numeric(BB.bellGripY,650)*sc)*g.k;
  fitSprite(bbBell,ref,{x:0,y:0,w:ref,h:ref},ref*sc*g.k);
  bbBell.box.style.transformOrigin=`${(numeric(BB.bellPivotX,510)/ref*100).toFixed(2)}% ${(numeric(BB.bellPivotY,80)/ref*100).toFixed(2)}%`;
  bbBell.box.style.transform=`translate3d(${bx.toFixed(1)}px,${by.toFixed(1)}px,0) rotate(${ang.toFixed(2)}deg)`;
}

function bbTick(now){
  bbRaf=0;
  if(!bbVisible || document.hidden){bbLastTick=0;return}
  const running=!paused && !isStatic();
  if(running && bbLastTick) bbClock+=Math.min(100,now-bbLastTick);
  bbLastTick=now;
  renderBellBack(bbClock);

  if(running) bbRaf=requestAnimationFrame(bbTick);
  else bbLastTick=0;
}

function updateInfoFlow(){
  if(FLOW.enabled===false || BB.enabled===false){
    entranceSticky.style.opacity="";
    infoBackdrop.hidden=true;
    document.body.classList.remove("fig-on");
    bbVisible=false;
    return;
  }
  const vh=innerHeight||1;
  const topH=topbar?topbar.offsetHeight:0;
  const stat=isStatic();
  const land=landscapeQuery.matches;
  const dm=detailsMain.getBoundingClientRect();

  // inP = 旅程場景退出、背景進場進度(減少動態:跟信件接近程度)
  let inP=1;
  if(stat){
    entranceSticky.style.opacity="";
    startInfoBack();
    const lt=letterEl?letterEl.getBoundingClientRect().top:0;
    inP=smooth(clamp((vh-lt)/(vh*.5)));
  }else{
    const rect=entrance.getBoundingClientRect();
    const p=clamp(-rect.top/journeyDistance());
    if(p>fracA*.3) startInfoBack();
    const po=fracO>0?clamp((p-fracA-fracD-fracT-fracH)/fracO):clamp((p-.9)/.1);
    const sf=Array.isArray(FLOW.sceneFade)?FLOW.sceneFade:[.72,1];
    const f0=clamp(numeric(sf[0],.72),0,.95), f1=Math.max(f0+.05,numeric(sf[1],1));
    inP=smooth(clamp((po-f0)/(f1-f0)));
    entranceSticky.style.opacity=(1-inP).toFixed(3);
  }

  // 背景持續到 #detailsMain 結束;只喺其底部接近畫面頂部時柔和退出(去到 VENUE 前)
  const out=smooth(clamp(dm.bottom/(vh*Math.max(.2,numeric(FLOW.fadeOutScreens,.5)))));
  const BO=FLOW.backdropOpacity||{};
  const maxO=clamp(numeric(land?BO.landscape:BO.portrait,.6),0,1);
  const bd=maxO*inP*out;
  const showBack=bbImageOK && bd>.004;
  infoBackdrop.hidden=!showBack;
  if(showBack){
    bellBackEl.style.opacity=bd.toFixed(3);
    bellBackImg.style.objectPosition=String((land?BB.positionLandscape:BB.positionPortrait)||"50% 50%");
  }

  // 新人及鐘:決定係咪顯示(fig-on)及位置
  const ok=layoutBellBack();
  const sr=bellGap.getBoundingClientRect();
  let frac=0;
  if(ok && !land && sr.height>0){
    frac=Math.max(0,Math.min(sr.bottom,vh)-Math.max(sr.top,topH))/sr.height;
  }
  const nr=noticeEl?noticeEl.getBoundingClientRect():dm;
  const appear=smooth(clamp((vh*.92-nr.top)/(vh*.2)));   // 重要提醒升到畫面下段才柔和淡入;捲過之後保持 1
  const figAlpha=inP*out*appear;

  bellFigs.style.opacity=ok?figAlpha.toFixed(3):"0";
  bbVisible=ok && !document.hidden && (land?(showBack && appear>.01):frac>0);


  if(!bbVisible) return;

  if(stat){renderBellBack(bbClock);return}

  if(!paused){
    if(!bbRaf){bbLastTick=0;bbRaf=requestAnimationFrame(bbTick)}
  } else{
    renderBellBack(bbClock);
  }

}


/* ==========================================================
   海邊結尾(footer):圖片 + 水紋/花葉緩慢動態
   - 只用 getBoundingClientRect 判斷接近/可見(冇 IntersectionObserver,所以冇不支援問題)。
   - 動畫時鐘 endClock 只在「可見 + 未暫停 + 非減少動態 + 分頁可見」時累計;暫停即凍結。
   - 減少動態:靜態裝飾;暫停:凍結喺當前幀。
   - 素材四角全不透明/載入失敗 → CSS 水紋/葉形後備(不改任何像素)。
   - 圖片失敗 → 隱藏裝飾,文字卡照常。
   ========================================================== */
const EB=C.endingBack||{};
const endArt=$("endingArt");
const endImg=$("endingImage");
const endSrc=$("endingDesktopSource");
const endDecor=$("endingDecor");
let endImgStarted=false, endImgOK=false, endAssets=null;
let endItems=[], endBuiltFor="", endSizeKey="";
let endClock=0, endLast=0, endRaf=0, endVisible=false;

root.style.setProperty("--end-pos-portrait",String(EB.positionPortrait||"50% 50%"));
root.style.setProperty("--end-pos-landscape",String(EB.positionLandscape||"50% 50%"));
if(EB.enabled===false) endArt.hidden=true;


endImg.addEventListener("load",()=>{
  if(endImg.naturalWidth>0){
    endImgOK=true;
    endImg.hidden=false;
    endImg.classList.add("is-loaded");
    endArt.classList.remove("is-empty");
    endSizeKey="";
    requestEndingUpdate();

  }
});
endImg.addEventListener("error",()=>{
  endImgOK=false;
  endImg.hidden=true;
  endArt.classList.add("is-empty");
  console.warn("Ending image failed; CSS fallback used (footer text unaffected).");
  requestEndingUpdate();

});

function startEndingImage(){
  if(endImgStarted) return;
  endImgStarted=true;
  const m=String(EB.mobileUrl||"").trim(), d=String(EB.desktopUrl||"").trim();
  if(!m && !d){endArt.classList.add("is-empty");return}
  if(d) endSrc.srcset=d; else endSrc.remove();
  endImg.src=m||d;
  if(DP.enabled===false){endAssets={rip:null,flo:null};return}
  Promise.all([
    bellProbe((DP.ripples||{}).sheetUrl,"Ending ripples sheet"),
    bellProbe((DP.florals||{}).sheetUrl,"Ending florals sheet")
  ]).then(([rip,flo])=>{
    endAssets={rip,flo};
    endBuiltFor="";
    requestEndingUpdate();

  });
}

function buildEnding(land){
  endDecor.replaceChildren();
  endItems=[];
  endSizeKey="";
  const key=land?"landscape":"portrait";
  const groups=[
    ["rip",DP.ripples||{},(EB.ripples||{})[key],endAssets.rip],
    ["flo",DP.florals||{},(EB.florals||{})[key],endAssets.flo]
  ];
  for(const [kind,sheet,list,abs] of groups){
    for(const cfg of list||[]){
      const crop=(sheet.crops||{})[cfg.crop];
      if(abs && crop){
        const sp=makeSprite(abs);
        sp.box.style.transformOrigin=kind==="flo"?"50% 100%":"50% 50%";
        endDecor.append(sp.box);
        endItems.push({kind,cfg,sp,crop,ref:numeric(sheet.sheetRef,1024)});
      }else{
        const el=document.createElement("i");
        el.className=kind==="rip"?"end-fb end-fb-wave":"end-fb end-fb-leaf";
        el.style.left=`${(numeric(cfg.u,.5)*100).toFixed(1)}%`;
        el.style.top=`${(numeric(cfg.v,.5)*100).toFixed(1)}%`;
        if(kind==="rip") el.style.width=`${(numeric(cfg.w,.2)*100).toFixed(1)}%`;
        el.style.opacity=numeric(cfg.opacity,.6).toFixed(2);
        el.style.setProperty("--ao",numeric(cfg.opacity,.6).toFixed(2));
        const FM=EB.motion||{};
        const per=Math.max(2,numeric(kind==="rip"?FM.rippleSec:FM.floralSec,6));
        el.style.setProperty("--as",`${per}s`);
        el.style.animationDelay=`${(-numeric(cfg.phase,0)*per).toFixed(2)}s`;
        endDecor.append(el);
        endItems.push({kind,cfg,fb:true,el});


      }
    }
  }
  endBuiltFor=land?"L":"P";
  console.info(`Ending decor (${key}): sheet=${endItems.filter(i=>!i.fb).length}, css-fallback=${endItems.filter(i=>i.fb).length}. DOM 內 .deco = 素材,.end-fb = CSS 後備。`);

}

function layoutEnding(){
  const W=endArt.offsetWidth, H=endArt.offsetHeight;
  const iw=endImg.naturalWidth, ih=endImg.naturalHeight;
  if(!W || !H || !iw || !ih) return false;
  const land=landscapeQuery.matches;
  const key=`${W}x${H}|${iw}x${ih}|${land?"L":"P"}`;
  if(key===endSizeKey) return true;
  endSizeKey=key;
  // 同 CSS object-fit:cover + object-position 一樣嘅換算:u,v,w 都相對圖片
  const s=Math.max(W/iw,H/ih);
  const [px,py]=parsePos(land?EB.positionLandscape:EB.positionPortrait);
  const ox=(W-iw*s)*px, oy=(H-ih*s)*py;
  for(const it of endItems){
      const x=ox+numeric(it.cfg.u,.5)*iw*s;
    const y=oy+numeric(it.cfg.v,.5)*ih*s;
    const bw=numeric(it.cfg.w,.2)*iw*s;
    const LM=EB.motion||{};
    const k=clamp(W/900,.55,1.5);   // 動態幅度按藝術區闊度縮放,手機/電腦視覺接近
    if(it.fb){
      const st=it.el.style;
      st.left=`${x.toFixed(1)}px`;
      st.top=`${y.toFixed(1)}px`;
      if(it.kind==="rip"){
        st.width=`${bw.toFixed(1)}px`;
        st.height=`${Math.max(8,bw*.06).toFixed(1)}px`;
        st.setProperty("--ad",`${(numeric(LM.rippleDriftPx,26)*k).toFixed(1)}px`);
        st.setProperty("--ab",`${(numeric(LM.rippleBobPx,5)*k).toFixed(1)}px`);
      }else{
        st.width=`${(bw*.4).toFixed(1)}px`;
        st.height=`${(bw*.75).toFixed(1)}px`;
        st.setProperty("--af",`${numeric(LM.floralSwayDeg,7)}deg`);
      }
      continue;
    }
    it.k=k;
    it.bw=bw;

    it.bh=fitSprite(it.sp,it.ref,it.crop,bw);
    it.x=x;
    it.y=y;
  }
  return true;
}

function renderEnding(clock){
  const M=EB.motion||{};
  const T=Math.PI*2, t=clock/1000;
  const rs=Math.max(2,numeric(M.rippleSec,6)), rd=numeric(M.rippleDriftPx,26), rb=numeric(M.rippleBobPx,5);
  const rp=numeric(M.ripplePulse,.04), rf=clamp(numeric(M.rippleFade,.3),0,.9);
  const fs=Math.max(2,numeric(M.floralSec,5)), fd=numeric(M.floralSwayDeg,7);
  const fbr=numeric(M.floralBreath,.03), fx=numeric(M.floralShiftPx,5);
  for(const it of endItems){
    if(it.fb) continue;
    const ph=numeric(it.cfg.phase,0)*T, k=it.k||1, base=numeric(it.cfg.opacity,.6);
    const bx=it.x-it.bw/2, by=it.y-it.bh/2;
    const box=it.sp.box.style;
    if(it.kind==="rip"){
      // 水平漂移(兩個頻率疊加)+ 垂直浮動 + 縮放呼吸 + 透明度起伏,各自週期不同
      const dx=(Math.sin(T*t/rs+ph)+.35*Math.sin(T*t/(rs*.63)+ph*1.7))*rd/1.35*k;
      const dy=Math.sin(T*t/(rs*1.3)+ph+1.2)*rb*k;
      const z=1+rp*Math.sin(T*t/(rs*.8)+ph+.6);
      box.transform=`translate3d(${(bx+dx).toFixed(1)}px,${(by+dy).toFixed(1)}px,0) scale(${z.toFixed(4)})`;
      box.opacity=(base*(1-rf*(.5+.5*Math.sin(T*t/(rs*1.1)+ph*1.3)))).toFixed(3);
    }else{
      // 花葉以莖部為軸搖曳(兩個頻率疊加)+ 輕微呼吸縮放 + 細小水平位移
      const a=(Math.sin(T*t/fs+ph)+.35*Math.sin(T*t/(fs*.61)+ph*1.9))*fd/1.35;
      const dx=Math.sin(T*t/(fs*1.2)+ph+.5)*fx*k;
      const b=1+fbr*Math.sin(T*t/(fs*1.4)+ph+.8);
      const sx=(it.cfg.flip?-1:1)*b;
      box.transform=`translate3d(${(bx+dx).toFixed(1)}px,${by.toFixed(1)}px,0) rotate(${a.toFixed(2)}deg) scale(${sx.toFixed(4)},${b.toFixed(4)})`;
      box.opacity=base.toFixed(3);
    }
  }
}


function endTick(now){
  endRaf=0;
  if(!endVisible || document.hidden || paused || isStatic()){endLast=0;return}
  if(endLast) endClock+=Math.min(100,now-endLast);
  endLast=now;
  renderEnding(endClock);
  endRaf=requestAnimationFrame(endTick);
}

function updateEndingBack(){
  if(EB.enabled===false || !endArt) return;
  const vh=innerHeight||1;
  const r=endArt.getBoundingClientRect();
  if(r.top<vh*Math.max(1,numeric(EB.preloadScreens,2.5))) startEndingImage();
  const vis=r.bottom>0 && r.top<vh && !document.hidden;
  const live=vis && !paused && !isStatic();
  endArt.classList.toggle("ending-live",live);   // 後備 CSS 動畫:只切換 play-state,唔重設位置
  endDecor.hidden=!endImgOK;
  endVisible=false;
  if(!endImgOK || !endAssets) return;
  const land=landscapeQuery.matches;
  if(endBuiltFor!==(land?"L":"P")) buildEnding(land);
  if(!vis || !layoutEnding()) return;
  endVisible=true;
  if(live){
    if(!endRaf){endLast=0;endRaf=requestAnimationFrame(endTick)}
  }else{
    endLast=0;
    renderEnding(isStatic()?0:endClock);   // 暫停:停喺當前幀;減少動態:靜態
  }
}

/* ==========================================================
   故事文字(原地淡入／淡出)
   - 副本在 #storyLayer(aria-hidden);原請帖資訊仍留在文件內。
   - 只喺動畫運行時顯示(body.story-on);暫停、減少動態、
     直接閱讀、走出素材失敗時,自動改為顯示原請帖內容。
   ========================================================== */
const STORY=C.story||{};
const storyNames=$("storyNames");
const storyCountdown=$("storyCountdown");
let directReading=false;
let storyFit=true;
function storyBase(){
  return STORY.enabled!==false && (C.infoFlow||{}).enabled!==false
    && fracO>0 && fracW<1 && !directReading && !isStatic() && !paused;
}
function storyActive(){return storyBase() && storyFit}

/* 空間不足(卡片太高,會壓住人物)→ 唔用故事副本,改為顯示原請帖內容,不截字 */
function measureStoryFit(){
  storyFit=true;
  document.body.classList.add("story-on");   // 暫時顯示,以便量度
  const avail=Math.max(1,innerHeight-(topbar?topbar.offsetHeight:0)-28);
  const need=Math.max(storyNames.offsetHeight,storyCountdown.offsetHeight);
  storyFit=need<=avail*(landscapeQuery.matches?.92:.5);
}
function applyStoryMode(){
  const base=storyBase();
  if(base && !storyMeasured){measureStoryFit();storyMeasured=true}
  if(!base) storyMeasured=false;
  document.body.classList.toggle("story-on",base && storyFit);
}
function updateStory(pw,ps){
  if(!storyActive()){
    storyNames.style.opacity="";
    storyCountdown.style.opacity="";
    return;
  }
  const win=(x,r)=>smooth(clamp((x-r[0])/Math.max(.01,r[1]-r[0])));
  const N=STORY.names||{}, K=STORY.countdown||{};
  const nIn=win(pw,rangeOf(N.in,[.03,.12])), nOut=win(pw,rangeOf(N.out,[.30,.38]));
  const kIn=win(pw,rangeOf(K.in,[.40,.52])), kOut=win(ps,rangeOf(K.out,[.08,.32]));
  storyNames.style.opacity=(nIn*(1-nOut)).toFixed(3);
  storyCountdown.style.opacity=(kIn*(1-kOut)).toFixed(3);
}


function journeyDistance(){

/* ==========================================================
   倒數（已確認，未改）
   ========================================================== */
const ceremonyTime=Date.parse(C.event.ceremonyStart);
const calStart=Date.parse(C.event.doorsOpen);
const calEnd=Date.parse(C.event.expectedEnd);
const pad=n=>String(n).padStart(2,"0");
let cdTimer;

function updateCountdown(){
  const mirror=document.querySelectorAll("[data-cd]");   // 故事副本(aria-hidden),同一計算結果
  if(!Number.isFinite(ceremonyTime)){
    ["cdDays","cdHours","cdMinutes","cdSeconds"].forEach(id=>$(id).textContent="—");
    mirror.forEach(el=>el.textContent="—");
    return;
  }
  const diff=ceremonyTime-Date.now();
  const started=diff<=0;
  $("countdownGrid").hidden=started;
  $("countdownStarted").hidden=!started;
  $("storyCdGrid").hidden=started;
  $("storyCdStarted").hidden=!started;
  if(started) return;

  const total=Math.ceil(diff/1000);
  const v={
    d:Math.floor(total/86400),
    h:pad(Math.floor(total%86400/3600)),
    m:pad(Math.floor(total%3600/60)),
    s:pad(total%60)
  };
  $("cdDays").textContent=v.d;
  $("cdHours").textContent=v.h;
  $("cdMinutes").textContent=v.m;

function utcStamp(ms){
  return new Date(ms).toISOString().replace(/\.\d{3}Z$/,"Z").replace(/[-:]/g,"");
}
function calendarText(){
  return {
    title:copy("calendar.title"),
    location:copy("calendar.location"),
    description:(get("calendar.description")||[]).map(line=>format(line)).join("\n")
  };
}
function calendarValid(){
  return Number.isFinite(calStart) && Number.isFinite(calEnd) && calEnd>calStart;
}
function updateGoogleLink(){
  const a=$("googleCalLink");
  if(!calendarValid()){
    a.hidden=true;
    return;
  }
  const t=calendarText();
  const enc=encodeURIComponent;
  a.href="https://calendar.google.com/calendar/render?action=TEMPLATE"+
    "&text="+enc(t.title)+
    "&dates="+utcStamp(calStart)+"/"+utcStamp(calEnd)+
    "&details="+enc(t.description)+
    "&location="+enc(t.location)+
    "&ctz=Asia%2FTokyo";
  a.hidden=false;
}
function icsEscape(value){
  return String(value).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
}
const utf8=new TextEncoder();
function foldLine(line){
  const out=[];
  let current="";
  let bytes=0;
  for(const ch of line){
    const size=utf8.encode(ch).length;
    if(bytes+size>75){
      out.push(current);
      current=" "+ch;
      bytes=1+size;
    }else{
      current+=ch;
      bytes+=size;
    }
  }
  out.push(current);
  return out.join("\r\n");
}
function buildICS(){
  const t=calendarText();
  const language=get("htmlLang")||lang;
  const lines=[
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Marco and Jenny//Wedding Invitation//EN",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    `UID:${C.calendarUid}`,
    `DTSTAMP:${utcStamp(Date.now())}`,
    `DTSTART:${utcStamp(calStart)}`,
    `DTEND:${utcStamp(calEnd)}`,
    `SUMMARY;LANGUAGE=${language}:${icsEscape(t.title)}`,
    `LOCATION;LANGUAGE=${language}:${icsEscape(t.location)}`,
    `DESCRIPTION;LANGUAGE=${language}:${icsEscape(t.description)}`,
    `URL:${C.mapUrl}`,
    "TRANSP:OPAQUE",
    "END:VEVENT",
    "END:VCALENDAR"
  ];
  return lines.map(foldLine).join("\r\n")+"\r\n";
}
$("icsButton").addEventListener("click",()=>{

/* ==========================================================
   音樂：唯一入口係音樂掣（已確認，未改）
   ========================================================== */
let audioContext;
let master;
let audioElement;
let musicPlaying=false;
let audioBusy=false;
let audioToken=0;
let musicTimer;
let noteIndex=0;
let nextNote=0;

const voices=new Set();
const volume=clamp(numeric(C.musicVolume,.22));
const melody=[72,76,79,76,74,77,81,77,71,74,79,74,72,76,79,84,81,79,76,74,72,76,74,67,69,72,76,72,67,71,74,71];
const bass=[48,53,55,48,57,53,50,55];

function musicUI(){
  const button=$("musicButton");
  put("musicButton",musicPlaying?"controls.musicStop":"controls.musicPlay");
  const label=copy(musicPlaying?"controls.musicOnLabel":"controls.musicOffLabel");
  button.setAttribute("aria-label",label);
  button.title=label;
  button.classList.toggle("is-playing",musicPlaying);
}

function tone(midi,when,duration,strength){
  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();
  osc.type="sine";
  osc.frequency.value=440*Math.pow(2,(midi-69)/12);
  gain.gain.setValueAtTime(0,when);
  gain.gain.linearRampToValueAtTime(strength,when+.025);
  gain.gain.exponentialRampToValueAtTime(.0001,when+duration);
  osc.connect(gain);
  gain.connect(master);
  voices.add(osc);
  osc.onended=()=>{
    voices.delete(osc);
    osc.disconnect();
    gain.disconnect();
  };
  osc.start(when);
  osc.stop(when+duration+.05);
}

function scheduleMusic(){
  if(!musicPlaying || audioContext?.state!=="running") return;
  if(nextNote<audioContext.currentTime) nextNote=audioContext.currentTime+.04;
  while(nextNote<audioContext.currentTime+.3){
    tone(melody[noteIndex%melody.length],nextNote,1.6,.23);
    if(noteIndex%4===0){
      const r=bass[Math.floor(noteIndex/4)%bass.length];
      tone(r,nextNote,2.7,.16);
      tone(r+7,nextNote,2.5,.065);
    }
    noteIndex++;
    nextNote+=.49;
  }
}

function stopMusic(){
  audioToken++;
  musicPlaying=false;
  clearInterval(musicTimer);
  audioElement?.pause();
  for(const osc of voices){
    try{osc.stop()}catch{}
  }
  voices.clear();
  if(audioContext?.state==="running") audioContext.suspend().catch(()=>{});
  musicUI();
}

async function startMusic(){
  if(musicPlaying || audioBusy || document.hidden) return;
  audioBusy=true;
  const token=++audioToken;
  $("musicButton").disabled=true;

  try{
    if(String(C.musicUrl||"").trim()){
      if(!audioElement){
        audioElement=new Audio(C.musicUrl);
        audioElement.loop=true;
        audioElement.volume=volume;
        audioElement.addEventListener("error",()=>{
          stopMusic();
          toast("messages.musicFileFailed");
        });
      }
      await audioElement.play();
    }else{
      const API=window.AudioContext||window.webkitAudioContext;
      if(!API) throw new Error("Web Audio unavailable");
      if(!audioContext){
        audioContext=new API();
        master=audioContext.createGain();
        master.gain.value=volume;
        master.connect(audioContext.destination);
      }
      await audioContext.resume();
      if(audioContext.state!=="running") throw new Error("Audio blocked");
    }

    if(token!==audioToken || document.hidden){
      audioElement?.pause();
      if(audioContext?.state==="running") await audioContext.suspend();
      return;
    }

    musicPlaying=true;

    if(!audioElement){
      nextNote=audioContext.currentTime+.04;
      scheduleMusic();
      clearInterval(musicTimer);
      musicTimer=setInterval(scheduleMusic,120);
    }
  }catch(error){
    console.warn(error);
    musicPlaying=false;
    if(token===audioToken) toast("messages.musicBlocked");
  }finally{
    audioBusy=false;
    $("musicButton").disabled=false;
    musicUI();
  }
}

$("musicButton").addEventListener("click",()=>{
  if(musicPlaying) stopMusic();
  else startMusic().catch(error=>console.warn("Music error:",error));
});

/* ==========================================================
   第一幕：櫻花持續飄落（Checkpoint 2 狀態修正）
   - 花瓣數量直接讀 sakuraLayer.childElementCount，唔再用另一個計數器。
   - 減少動態：立即清走所有花瓣；關閉後恢復生成。
   - 暫停：停止生成並凍結現有花瓣；恢復後繼續。
   - 永遠只有一個 sakuraTimer。
   ========================================================== */
const sakuraLayer=$("sakuraLayer");
const sakuraCfg=C.sakura||{};
let sakuraActive=false;
let sakuraSheetOK=false;
let sakuraSheetUrl="";
let sakuraTimer=0;

function rangeOf(value,fallback){
  const a=Array.isArray(value)?value:fallback;
  const lo=numeric(a[0],fallback[0]);
  const hi=numeric(a[1],fallback[1]);
  return [Math.min(lo,hi),Math.max(lo,hi)];
}
function rand([lo,hi]){return lo+Math.random()*(hi-lo)}

function sakuraCanSpawn(){
  return sakuraActive && sakuraSheetOK && !paused && !reduced.matches && !document.hidden;
}

function spawnPetal(){
  if(!sakuraCanSpawn()) return null;
  const maxActive=Math.max(1,Math.round(numeric(sakuraCfg.maxActive,8)));
  if(sakuraLayer.childElementCount>=maxActive) return null;

  const size=rand(rangeOf(sakuraCfg.sizePx,[22,40]));
  const dur=rand(rangeOf(sakuraCfg.durationSec,[12,20]));
  const drift=rand(rangeOf(sakuraCfg.driftPx,[30,130]))*(Math.random()<.5?-1:1);
  const sway=rand(rangeOf(sakuraCfg.swayPx,[10,40]))*(Math.random()<.5?-1:1);
  const rot=rand(rangeOf(sakuraCfg.rotateDeg,[120,360]))*(Math.random()<.5?-1:1);
  const op=rand(rangeOf(sakuraCfg.opacity,[.55,.85]));
  const index=Math.floor(Math.random()*6);
  const col=index%3;
  const row=Math.floor(index/3);

  const el=document.createElement("i");
  el.className="sakura-petal";
  el.style.left=`${(Math.random()*100).toFixed(1)}%`;
  el.style.width=`${size.toFixed(1)}px`;
  el.style.height=`${(size*1.5).toFixed(1)}px`;
  el.style.backgroundImage=`url(${JSON.stringify(sakuraSheetUrl)})`;
  el.style.backgroundPosition=`${col*50}% ${row*100}%`;
  el.style.setProperty("--dur",`${dur.toFixed(1)}s`);
  el.style.setProperty("--drift",`${drift.toFixed(0)}px`);
  el.style.setProperty("--sway",`${sway.toFixed(0)}px`);
  el.style.setProperty("--rot",`${rot.toFixed(0)}deg`);
  el.style.setProperty("--op",op.toFixed(2));
  el.addEventListener("animationend",()=>el.remove(),{once:true});
  sakuraLayer.append(el);
  return el;
}

function sakuraSchedule(){
  clearTimeout(sakuraTimer);
  sakuraTimer=0;
  if(!sakuraCanSpawn()) return;
  const wait=rand(rangeOf(sakuraCfg.spawnIntervalMs,[1600,3200]));
  sakuraTimer=setTimeout(()=>{
    sakuraTimer=0;
    spawnPetal();
    sakuraSchedule();
  },Math.max(200,wait));
}

// 狀態改變（暫停／播放、減少動態、分頁可見性、離開第一幕）後同步一次
function sakuraSync(){
  if(reduced.matches && sakuraLayer.childElementCount) sakuraLayer.replaceChildren();
  if(sakuraCanSpawn()){
    if(!sakuraTimer) sakuraSchedule();
  }else{
    clearTimeout(sakuraTimer);
    sakuraTimer=0;
  }
}

function startSakura(){
  const url=String(sakuraCfg.sheetUrl||"").trim();
  if(!url){
    console.info("Sakura: no sheetUrl set; petals disabled.");
    return;
  }
  try{
    sakuraSheetUrl=new URL(url,document.baseURI).href;
  }catch(error){
    console.warn("Sakura path error:",error);
    return;
  }
  sakuraActive=true;
  const probe=new Image();
  probe.onload=()=>{
    if(!(probe.naturalWidth>0)){
      console.warn("Sakura sheet has no size; petals disabled.");
      return;
    }
    sakuraSheetOK=true;
    if(!sakuraActive) return;
    const burst=Math.max(0,Math.round(numeric(sakuraCfg.initialBurst,3)));
    for(let i=0;i<burst;i++){
      const el=spawnPetal();
      if(el){
        const dur=parseFloat(el.style.getPropertyValue("--dur"))||16;
        el.style.animationDelay=`${(-Math.random()*dur*.5).toFixed(1)}s`;
      }
    }
    sakuraSync();
  };
  probe.onerror=()=>{
    console.warn("Sakura sheet failed to load; petals disabled (intro still works).");
    sakuraSheetOK=false;
  };
  probe.src=sakuraSheetUrl;
}

function stopSakura(){
  sakuraActive=false;
  clearTimeout(sakuraTimer);
  sakuraTimer=0;
}

function clearSakura(){
  stopSakura();
  sakuraLayer.replaceChildren();
  sakuraLayer.hidden=true;
}

try{
  fogContext=fog.getContext("2d",{willReadFrequently:true});
  if(!fogContext) throw new Error("Canvas unavailable");
  const ctx=fogContext;

  const bg=ctx.createLinearGradient(0,0,600,750);
  bg.addColorStop(0,"#f3ece0");
  bg.addColorStop(.5,"#faf6ee");
  bg.addColorStop(1,"#e8eee9");
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,600,750);

  for(let i=0;i<35;i++){
    const x=(Math.sin(i*7.19)+1)*300;
    const y=(Math.cos(i*4.73)+1)*375;
    const r=80+(i%5)*25;
    const gradient=ctx.createRadialGradient(x,y,0,x,y,r);
    gradient.addColorStop(0,"rgba(255,253,247,.55)");
    gradient.addColorStop(1,"rgba(255,253,247,0)");
    ctx.fillStyle=gradient;
    ctx.fillRect(x-r,y-r,r*2,r*2);
  }

  const tints=[
    [80,110,170,"rgba(169,200,211,.20)"],
    [520,150,150,"rgba(191,209,197,.18)"],
    [500,650,180,"rgba(217,179,168,.14)"]
  ];
  for(const [x,y,r,color] of tints){
    const gradient=ctx.createRadialGradient(x,y,0,x,y,r);
    gradient.addColorStop(0,color);
    gradient.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=gradient;
    ctx.fillRect(x-r,y-r,r*2,r*2);
  }

  let grain=7;
  for(let i=0;i<1600;i++){
    grain=(grain*16807)%2147483647;
    const x=grain%600;
    grain=(grain*16807)%2147483647;
    const y=grain%750;
    ctx.fillStyle=i%2?"rgba(120,108,88,.05)":"rgba(255,255,255,.35)";
    ctx.fillRect(x,y,1.3,1.3);
  }
}catch(error){
  console.warn(error);
  fog.hidden=true;
  $("fogHint").hidden=true;
  scratchHelpKey="intro.helpUnavailable";
}

const sampleCanvas=document.createElement("canvas");
sampleCanvas.width=60;
sampleCanvas.height=75;
let sampleContext=null;
try{
  sampleContext=sampleCanvas.getContext("2d",{willReadFrequently:true});
}catch(error){
  console.warn("Scratch sampler unavailable:",error);
}

function localPoint(event){
  const rect=fog.getBoundingClientRect();
  return {
    x:clamp((event.clientX-rect.left)/rect.width)*600,
    y:clamp((event.clientY-rect.top)/rect.height)*750
  };
}

function stamp(x,y){
  const radius=58;
  const ctx=fogContext;
  const brush=ctx.createRadialGradient(x,y,radius*.48,x,y,radius);
  brush.addColorStop(0,"rgba(0,0,0,1)");
  brush.addColorStop(1,"rgba(0,0,0,0)");
  ctx.globalCompositeOperation="destination-out";
  ctx.fillStyle=brush;
  ctx.fillRect(x-radius,y-radius,radius*2,radius*2);
}

function checkCoverage(force=false){
  if(!sampleContext || revealed) return;
  const now=performance.now();
  if(!force && now-lastSample<140) return;
  lastSample=now;
  try{
    sampleContext.clearRect(0,0,60,75);
    sampleContext.drawImage(fog,0,0,60,75);
    const pixels=sampleContext.getImageData(0,0,60,75).data;
    let alpha=0;
    for(let i=3;i<pixels.length;i+=4) alpha+=pixels[i];
    const erased=1-alpha/(60*75*255);
    const threshold=clamp(numeric(C.revealThreshold,.35),.1,.8);
    if(erased>=threshold) revealPhoto();
  }catch(error){
    console.warn("Coverage sampling failed:",error);
  }
}

function eraseTo(point){
  if(!fogContext || revealed) return;
  intro.classList.add("scratching");
  const from=previousPoint||point;
  const steps=Math.max(1,Math.ceil(Math.hypot(point.x-from.x,point.y-from.y)/12));
  for(let i=1;i<=steps;i++){
    const p=i/steps;
    stamp(from.x+(point.x-from.x)*p,from.y+(point.y-from.y)*p);
  }
  previousPoint=point;
  checkCoverage();
}

fog.addEventListener("pointerdown",event=>{
  if(revealed || requested || !event.isPrimary || event.button!==0 || !fogContext) return;
  pointerId=event.pointerId;
  previousPoint=null;
  try{fog.setPointerCapture(event.pointerId)}catch{}
  eraseTo(localPoint(event));
});
fog.addEventListener("pointermove",event=>{
  if(event.pointerId===pointerId && !revealed) eraseTo(localPoint(event));
});
function endScratch(event){
  if(event.pointerId!==pointerId) return;
  pointerId=null;
  previousPoint=null;
  checkCoverage(true);
}
fog.addEventListener("pointerup",endScratch);
fog.addEventListener("pointercancel",endScratch);
fog.addEventListener("lostpointercapture",endScratch);

function instantMotion(){return reduced.matches || paused}

function hideIntro(){
  clearSakura();     // 離開第一幕：停止並清走所有花瓣
  intro.hidden=true;
  intro.inert=true;
}

function unlockPage(){
  startEntranceImage();
  document.body.classList.remove("waiting");
  document.body.classList.add("entered");
  $("mainContent").inert=false;
  entrance.classList.add("is-shown");
  setTimeout(()=>entrance.classList.add("cards-ready"),1900);
  measureEntrance();
  requestEntranceUpdate();
  requestCoupleLayout();
}

/* 跳到名字/日期卡,倒數標題在其下,不會被頂部列遮住 */

function focusInvitation(){
  directReading=true;      // 直接閱讀:顯示原請帖內容,隱藏故事副本
  applyStoryMode();

  $("infoLead").scrollIntoView({behavior:"instant",block:"start"});   // html 的 scroll-padding-top 已避開頂部列
  $("countdownHeading").focus({preventScroll:true});
}

function enterChapel(){

  if(!revealed || requested || entered) return;
  requested=true;
  leaving=true;
  stopSakura();      // 按入場：不再生成新花瓣（淡出期間現有花瓣隨第一幕淡出）
  clearTimeout(revealTimer);
  $("enterButton").disabled=true;
  window.scrollTo({top:0,left:0,behavior:"instant"});
  unlockPage();
  queueInterior();
  intro.inert=true;
  intro.classList.add("leaving");
  transitionTimer=setTimeout(()=>{
    leaving=false;
    entered=true;
    hideIntro();
    $("entranceHeading").focus({preventScroll:true});
  },instantMotion()?0:700);
}

function skipAll(){
  clearTimeout(revealTimer);
  clearTimeout(transitionTimer);
  requested=true;
  leaving=false;
  entered=true;
  unlockPage();
  hideIntro();
  focusInvitation();
}

$("enterButton").addEventListener("click",enterChapel);
$("skipButton").addEventListener("click",skipAll);
$("entranceSkip").addEventListener("click",focusInvitation);
$("interiorSkip").addEventListener("click",focusInvitation);


document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    stopMusic();
    clearTimeout(revealTimer);
    clearTimeout(cdTimer);
    sakuraSync();
  }else{
    scheduleCountdown();
    requestEntranceUpdate();
    sakuraSync();
    if(revealed && !requested && !entered && $("revealMessage").hidden) showRevealMessage(false);
  }
});
addEventListener("pageshow",()=>{
  scheduleCountdown();
  measureEntrance();
  requestEntranceUpdate();
  requestCoupleLayout();
  sakuraSync();
});
addEventListener("pagehide",()=>{
  stopMusic();
  clearTimeout(cdTimer);
  clearTimeout(sakuraTimer);
  sakuraTimer=0;
});

/* 初始化 */
applyLanguage(false);
scheduleCountdown();
$("motionButton").hidden=false;
$("musicButton").hidden=false;
syncTopbarHeight();
$("mainContent").inert=true;
intro.hidden=false;
document.body.classList.add("waiting");
window.scrollTo({top:0,left:0,behavior:"instant"});
startSakura();   // 第一幕櫻花開始

})();
</script>
</body>
</html>

#intro{position:fixed;inset:0;z-index:35;overflow-y:auto;overscroll-behavior:contain;scroll-padding-top:calc(var(--topbar-height) + 16px);background:var(--paper-warm);transition:opacity .7s ease}
#intro.leaving{opacity:0;pointer-events:none}
.intro-paper{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse 60% 45% at 50% 50%,#fffaf1cc,transparent 70%),var(--paper-warm)}
.intro-paper::before,.intro-paper::after{content:"";position:absolute;background-image:var(--opening-paper);background-repeat:no-repeat}
@media (orientation:portrait){
  .intro-paper::before{left:0;right:0;top:var(--topbar-height);height:50vw;background-size:100vw auto;background-position:center top;-webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent);mask-image:linear-gradient(to bottom,#000 62%,transparent)}
  .intro-paper::after{left:0;right:0;bottom:0;height:50vw;background-size:100vw auto;background-position:center bottom;-webkit-mask-image:linear-gradient(to top,#000 62%,transparent);mask-image:linear-gradient(to top,#000 62%,transparent)}
}
@media (orientation:landscape){
  .intro-paper::before{top:0;bottom:0;left:0;width:50vh;background-size:auto 100vh;background-position:left center;-webkit-mask-image:linear-gradient(to right,#000 62%,transparent);mask-image:linear-gradient(to right,#000 62%,transparent)}
  .intro-paper::after{top:0;bottom:0;right:0;width:50vh;background-size:auto 100vh;background-position:right center;-webkit-mask-image:linear-gradient(to left,#000 62%,transparent);mask-image:linear-gradient(to left,#000 62%,transparent)}
}

/* ===== 第一幕櫻花 =====
   花瓣層：fixed、pointer-events:none，放喺文字層後面，唔會擋住任何操作。
   素材表 3 欄 × 2 行，用 background-size 300% 200% 裁切。 */
.sakura-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:strict}
.sakura-petal{position:absolute;top:0;left:0;pointer-events:none;background-repeat:no-repeat;background-size:300% 200%;
  opacity:0;will-change:transform,opacity;animation:sakuraFall linear forwards;
  animation-duration:var(--dur,16s)}
@keyframes sakuraFall{
  0%{transform:translate3d(0,-12vh,0) rotate(0deg);opacity:0}
  8%{opacity:var(--op,.7)}
  50%{transform:translate3d(calc(var(--drift,60px)*.5 + var(--sway,20px)),52vh,0) rotate(calc(var(--rot,200deg)*.5))}
  92%{opacity:var(--op,.7)}
  100%{transform:translate3d(var(--drift,60px),112vh,0) rotate(var(--rot,200deg));opacity:0}
}
body.motion-paused .sakura-petal{animation-play-state:paused}

.intro-inner{position:relative;z-index:1;width:min(100%,760px);min-height:100%;margin:auto;padding:calc(var(--topbar-height) + 18px) 22px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .55s ease,transform .7s ease}
#intro.leaving .intro-inner{opacity:0;transform:scale(.97)}
#intro .eyebrow{color:var(--sea)}
.intro-heading{margin:9px 0 20px;font-size:clamp(23px,4.5vw,33px);line-height:1.6;color:var(--ink)}
.photo-card{position:relative;width:min(340px,76vw,42svh);padding:12px 12px 6px;background:var(--ivory);border:1px solid #ece3d3;border-radius:4px;box-shadow:0 1px 0 #fff inset,0 24px 50px -28px rgba(80,90,78,.45),0 5px 14px -8px rgba(80,90,78,.2)}
.photo-card::before{content:"";position:absolute;width:92px;height:26px;left:calc(50% - 46px);top:-13px;z-index:5;background:linear-gradient(90deg,rgba(169,200,211,.62),rgba(191,209,197,.62));
  clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,88% 0,92% 10%,96% 0,100% 8%,100% 92%,96% 100%,92% 90%,88% 100%,12% 100%,8% 90%,4% 100%,0 92%);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(80,90,78,.08);pointer-events:none}
.photo-window{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;border-radius:2px;background:#ebe3d4;isolation:isolate}
.photo-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;background:radial-gradient(circle at 30% 22%,#fffbf2,transparent 62%),linear-gradient(160deg,#e6eeea,#f3ebe0 55%,#efe0da)}
.photo-fallback .heart{font-size:54px;color:var(--blush);line-height:1.5}
.photo-fallback .names{font:22px/1.8 var(--cute);color:var(--ink)}
.photo-fallback .small{font-size:10px;margin:2px 0 0;line-height:1.9}
.photo-fallback .note{margin-top:10px;padding:2px 12px;border:1px dashed #b9c6bd;border-radius:20px;font-size:10px;color:#7d8a80}
#couplePhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#fogCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none;cursor:crosshair;transition:opacity 1s ease}
#fogHint{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12px;color:#6c7c71;pointer-events:none;transition:opacity .3s ease;font:20px/1.8 var(--cute);text-shadow:0 1px 4px #fffdf7}
#fogHint .symbol{font:32px/1.7 Georgia,serif;color:var(--blush)}
#fogHint small{font-size:12px;color:#7f8b82}
#intro.scratching #fogHint,#intro.revealed #fogHint{opacity:0}
#intro.revealed #fogCanvas{opacity:0;pointer-events:none}
.photo-caption{padding:10px 0 6px;font:italic 11px/1.8 Georgia,serif;letter-spacing:.18em;color:var(--sea)}
#scratchHelp{margin:16px 0 0;color:#6f7d73}
#revealMessage{width:100%;margin-top:15px;animation:messageIn .65s ease both}
#revealMessage h2{font-size:clamp(23px,4vw,29px);line-height:1.65;margin:0 0 15px;color:var(--ink)}
#enterButton.primary{border:0;background:var(--sage-deep);color:#fffaf1;box-shadow:0 10px 24px -12px rgba(64,86,79,.55)}
#enterButton.primary:hover{background:#48615a}
.intro-links{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
@keyframes messageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ===== 手繪教堂：入口 → 紙色 → 室內 ===== */
main{position:relative;z-index:2}
.chapel-entrance{position:relative;height:calc(100vh + var(--entrance-scroll));height:calc(100svh + var(--entrance-scroll));background:var(--paper-warm)}
.entrance-sticky{position:sticky;top:0;height:100vh;height:100svh;min-height:480px;overflow:hidden;background:var(--paper-warm)}
.scene{position:absolute;inset:0;overflow:hidden}
.scene-entrance{z-index:1}
.scene-interior{z-index:3;opacity:0;pointer-events:none;background:var(--paper-warm)}
.entrance-stage,.interior-stage{position:absolute;left:0;right:0;bottom:0;top:var(--topbar-height);overflow:hidden}
.entrance-stage::after,.interior-stage::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(to bottom,var(--paper-warm) 0,rgba(244,236,223,0) 7%,rgba(244,236,223,0) 76%,rgba(244,236,223,.82) 100%)}
.entrance-visual{position:absolute;inset:0;opacity:0;transform:scale(1.025);transition:opacity 1.1s ease .15s,transform 1.6s cubic-bezier(.2,.6,.2,1) .15s}
.chapel-entrance.is-shown .entrance-visual{opacity:1;transform:none}
.entrance-zoom,.interior-zoom{position:absolute;inset:0;transform:none;will-change:transform}
.entrance-zoom{transform-origin:50% 62%}
.interior-zoom{transform-origin:50% 60%}
.entrance-zoom picture,.entrance-zoom img,.interior-zoom picture,.interior-zoom img{display:block;width:100%;height:100%}
.entrance-zoom img,.interior-zoom img{object-fit:cover;opacity:0;transition:opacity .8s ease}
.entrance-zoom img{object-position:var(--entrance-pos-portrait)}
.interior-zoom img{object-position:var(--interior-pos-portrait)}
.entrance-zoom img.is-loaded,.interior-zoom img.is-loaded{opacity:1}
@media (orientation:landscape){
  .entrance-zoom img{object-position:var(--entrance-pos-landscape)}
  .interior-zoom img{object-position:var(--interior-pos-landscape)}
}
.entrance-veil{position:absolute;inset:0;z-index:1;background:var(--paper-warm);opacity:0;pointer-events:none}
.entrance-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 24px 30%;
  background:radial-gradient(ellipse 70% 50% at 50% 40%,#fffaf1,transparent 70%),linear-gradient(#e4eef0,var(--paper-warm) 62%);color:#7d8a80;font-size:12px;text-align:center}
.entrance-fallback .arch{width:min(150px,34vw);aspect-ratio:3/4;border:2px solid #b9c8bd;border-bottom:0;border-radius:50% 50% 0 0 / 38% 38% 0 0}

/* ===== Checkpoint 2：入口景深裝飾 + 背面新人 =====
   整層 pointer-events:none、aria-hidden，唔會擋住捽霧、按鈕、連結、鍵盤或捲動。
   z-index:3 喺漸變遮罩之上，但喺文字卡（同層、DOM 較後）之下。 */
.entrance-decor{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 1.2s ease .5s}
.chapel-entrance.is-shown .entrance-decor{opacity:1}
.decor-layer{position:absolute;inset:0;pointer-events:none}
.deco{position:absolute;left:0;top:0;pointer-events:none;opacity:0;will-change:transform,opacity;transform-origin:50% 50%}
.deco-clip{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.deco-clip img{position:absolute;display:block;max-width:none;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none}
.deco-shadow{position:absolute;left:0;right:0;bottom:6%;height:12%;pointer-events:none;
  background:
    radial-gradient(ellipse 12% 45% at 22% 50%,rgba(70,82,70,.38),rgba(70,82,70,0) 100%),
    radial-gradient(ellipse 34% 45% at 62% 50%,rgba(70,82,70,.30),rgba(70,82,70,0) 100%)}



body.motion-paused .entrance-decor{transition:none}

/* 直屏：文字卡會遮住小路。新人開始行之後，收起標題及說明，
   只保留「向下滑動」提示及跳過按鈕；返回頂部時自動展開。 */
@media (orientation:portrait){
  .entrance-card .eyebrow,.entrance-card h2,.entrance-card .entrance-note{max-height:10em;overflow:hidden;
    transition:max-height .5s ease,opacity .4s ease,margin .4s ease}
  body:not(.motion-paused):not(.journey-static) .chapel-entrance.walker-on.is-walking .entrance-card .eyebrow,
  body:not(.motion-paused):not(.journey-static) .chapel-entrance.walker-on.is-walking .entrance-card h2,
  body:not(.motion-paused):not(.journey-static) .chapel-entrance.walker-on.is-walking .entrance-card .entrance-note{
    max-height:0;opacity:0;margin-top:0;margin-bottom:0}
}

/* ===== Checkpoint 3:開門(門扇層放喺 #entranceZoom 內,同背景一齊縮放) ===== */
.door-canvas{position:absolute;left:0;top:0;width:100%;height:100%}

.door-patch{position:absolute;overflow:hidden;opacity:0;background:#f3ead9 center/cover no-repeat;box-shadow:inset 0 0 22px rgba(255,248,230,.55);pointer-events:none}
.door-leaves{position:absolute;opacity:0;pointer-events:none}
.door-leaf{position:absolute;top:0;bottom:0;width:50%;backface-visibility:hidden;background-repeat:no-repeat;pointer-events:none}
#leafL{left:0;transform-origin:0 50%}
#leafR{right:0;transform-origin:100% 50%}
.door-leaf.plain{background:linear-gradient(90deg,#a98262,#c29d78 45%,#a98262);box-shadow:inset 0 0 0 3px rgba(90,62,40,.35)}


/* ===== 資訊與故事並行:背景層、開場卡、日期時間、VENUE ===== */
.chapel-entrance{background:transparent}
.info-backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bell-back{position:absolute;inset:0;pointer-events:none}

.bell-back picture,.bell-back img{display:block;width:100%;height:100%}
.bell-back img{object-fit:cover;opacity:0;transition:opacity .6s ease}
.bell-back img.is-loaded{opacity:1}
/* 減少動態:背景及靜止新人照常顯示(由 JavaScript 控制) */


body.journey-static .content{margin-top:0}

.info-lead{position:relative;padding:0 0 40px;text-align:center}
/* 統一卡片:紙色、邊框、陰影、圓角集中喺呢度;各卡只保留自己嘅尺寸/內距/特色(倒數拱形、信件) */
.lead-card,.intro-card,.countdown-card,.paper,.details-main-inner,.venue-inner,.details-rest > div:first-child{background:var(--card-bg);border:1px solid var(--card-line);border-radius:var(--card-radius);box-shadow:var(--card-shadow)}
.lead-card{max-width:520px;margin:0 auto;padding:24px 22px 16px}
.intro-card{max-width:600px;margin:0 auto;padding:22px 22px 14px}
.lead-card .eyebrow,.intro-card .eyebrow,.letter .eyebrow,.details-main .eyebrow{color:var(--eyebrow)}
.intro-card .section-title{margin:6px 0 10px}
.intro-card .small{margin:0}
.time-list li,.detail-row strong,.plan-row h4{overflow-wrap:anywhere}
.actions .pill{max-width:100%}


/* ===== 門口背景 + 新人 + 鐘(持續到信件及日期時間結束) =====
   手機:新人及鐘放喺文件流程入面嘅透明空位(.bell-gap),隨內容捲動,卡片不會遮住。
   電腦:新人及鐘固定喺左側空位,文字靠右,左右分區。
   body.fig-on 由 JavaScript 在「背景圖及新人素材都載入成功、且位置放得落」時才加上。 */
.bell-gap{display:none;position:relative;height:clamp(240px,36vh,380px);height:clamp(240px,36svh,380px);margin:14px 0 4px;pointer-events:none}

body.fig-on .bell-gap{display:block}
.stage-figures{position:absolute;inset:0;pointer-events:none}
@media (orientation:landscape){
  body.fig-on .bell-gap{display:none}
  body.fig-on .container > .details-main > .details-main-inner{width:min(560px,58vw);max-width:none;margin-left:auto;margin-right:0}
}
.details-main .tbc{color:#7a5a4b}

.details-main .notice strong{color:#7a4f43}
#countdownHeading:focus{outline:3px solid #a27856;outline-offset:6px}


.lead-names{margin:2px 0 0;font:clamp(30px,8vw,46px)/1.5 var(--cute);letter-spacing:.06em;color:var(--sage-deep)}
.lead-date{margin:0;font:15px/1.9 var(--serif);color:var(--ink)}

.details-main{position:relative;isolation:isolate;padding:70px 0 40px}
.details-main-inner{max-width:640px;margin:0 auto;padding:6px 26px 14px}

.paper.letter p{color:#5a675f}


.venue-band{position:relative;isolation:isolate;padding:90px 0}

/* 外景背景:viewport 固定,原位淡入/淡出(opacity 由 JS 按捲動位置控制);位置/裁切不隨捲動改變 */
.venue-art{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;opacity:0}
.venue-art-sticky{position:absolute;inset:0}
.venue-art picture{display:block;width:100%;height:100%}



.venue-art img{display:block;width:100%;height:100%;object-fit:cover;object-position:var(--venue-pos-portrait,50% 55%);opacity:var(--venue-opacity,.6)}
@media (orientation:landscape){.venue-art img{object-position:var(--venue-pos-landscape,50% 55%)}}
.venue-art::after{content:"";position:absolute;inset:0;background:rgba(255,251,242,var(--venue-wash,.45))}
.venue-inner{position:relative;max-width:560px;margin:0 auto;padding:22px 26px 14px}

.venue-inner .detail-row{border-bottom:0;padding:6px 0}
.venue-art-note{margin:6px 0 0;font-size:11px;line-height:1.9;color:var(--text-soft)}

.details-rest{position:relative;isolation:isolate}
.details.details-rest{padding-bottom:120px}
.details-rest > div{min-width:0}
.details-rest > div:first-child{align-self:start;padding:6px 26px 14px}


/* ===== Checkpoint 4:幸福鐘(舊版,已停用) ===== */

/* (舊 .bell-layer 已移除;.bell-shadow 為新人腳下影,仍使用) */

.bell-shadow{position:absolute;left:0;right:0;bottom:4%;height:9%;pointer-events:none;
  background:
    radial-gradient(ellipse 34% 45% at 36% 50%,rgba(70,82,70,.30),rgba(70,82,70,0) 100%),
    radial-gradient(ellipse 12% 45% at 64% 50%,rgba(70,82,70,.38),rgba(70,82,70,0) 100%)}


/* ===== Checkpoint 4：新人走出（室內場景內） ===== */

.out-sprite{z-index:1}
.interior-zoom .out-sprite .deco-clip img{opacity:1;transition:none}
.couple-figure.out-on{transition:none}
body.motion-paused .out-sprite,body.journey-static .out-sprite{display:none}
body.motion-paused .couple-figure.is-loaded{opacity:1!important}


/* ===== 新人插畫 ===== */


.couple-figure{position:absolute;z-index:1;margin:0;pointer-events:none;opacity:0;transition:opacity .9s ease}
.couple-figure.is-loaded{opacity:1}
.couple-figure img{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:contain;object-position:50% 100%;opacity:1}
.couple-figure::before{content:"";position:absolute;left:0;right:0;bottom:3%;height:9%;z-index:0;
  background:
    radial-gradient(ellipse 12% 45% at 30% 50%,rgba(70,82,70,.40),rgba(70,82,70,0) 100%),
    radial-gradient(ellipse 30% 45% at 66% 50%,rgba(70,82,70,.32),rgba(70,82,70,0) 100%)}


/* ===== 花草前景 ===== */
.foreground-figure{position:absolute;inset:0;z-index:2;margin:0;pointer-events:none;opacity:0;transition:opacity .9s ease}
.foreground-figure.is-loaded{opacity:1}
.foreground-figure img{object-fit:cover;object-position:var(--interior-pos-portrait);opacity:1;user-select:none;-webkit-user-drag:none}
@media (orientation:landscape){.foreground-figure img{object-position:var(--interior-pos-landscape)}}
.foreground-figure.is-bottom img{object-fit:contain;object-position:50% 100%}

.entrance-card,.interior-card{position:absolute;z-index:3;left:50%;bottom:max(18px,env(safe-area-inset-bottom));width:min(360px,calc(100% - 36px));margin-left:max(-180px,calc(-50% + 18px));
  padding:16px 20px 8px;background:rgba(255,253,247,.92);border:1px solid #ece3d3;border-radius:4px;box-shadow:0 18px 40px -26px rgba(80,90,78,.45);text-align:center}
.entrance-card{opacity:0;translate:0 10px;transition:opacity .8s ease .9s,translate .8s ease .9s}
.chapel-entrance.is-shown .entrance-card{opacity:1;translate:0 0}
.chapel-entrance.cards-ready .entrance-card{transition:opacity .45s ease,translate .45s ease}
.chapel-entrance.is-shown .entrance-card.is-off{opacity:0;translate:0 -6px;pointer-events:none}
.interior-card{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s ease,visibility 0s linear .5s}
.interior-card.is-on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .6s ease,visibility 0s}

.entrance-card .eyebrow,.interior-card .eyebrow{color:var(--sea)}
.entrance-card h2,.interior-card h2{margin:4px 0 6px;font-size:clamp(20px,5vw,24px);line-height:1.6;color:var(--ink)}
.interior-names{margin:0 0 4px;font:clamp(22px,5.5vw,27px)/1.6 var(--cute);letter-spacing:.06em;color:var(--sage-deep)}
.entrance-note{margin:0;font-size:10px;line-height:1.8;color:#7f8b82}
.entrance-actions{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px 14px;margin-top:6px}
.scroll-cue{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sage-deep);transition:opacity .4s ease}
.chapel-entrance.is-walking .entrance-card .scroll-cue{opacity:.55}
.scroll-cue .arrow{display:inline-block;animation:cueBob 2.4s ease-in-out infinite}
@keyframes cueBob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
body.motion-paused .scroll-cue .arrow{animation:none}
@media (orientation:landscape){
  .entrance-card,.interior-card{left:max(4%,env(safe-area-inset-left));margin-left:0;bottom:8%;width:min(340px,38vw);text-align:left}
  .entrance-actions{justify-content:flex-start}
}
@media (orientation:landscape) and (max-height:520px){
  .entrance-card,.interior-card{padding:10px 14px 4px}
  .entrance-card h2,.interior-card h2{font-size:18px}
  .interior-names{font-size:20px}
}
body.motion-paused #intro,body.motion-paused .intro-inner,body.motion-paused .entrance-visual,
body.motion-paused .entrance-card,body.motion-paused .interior-card,
body.motion-paused .entrance-zoom img,body.motion-paused .interior-zoom img,
body.motion-paused .couple-figure,body.motion-paused .foreground-figure{transition:none!important}

body.journey-static .chapel-entrance{height:auto}
body.journey-static .entrance-sticky{position:relative;height:auto;min-height:0;overflow:visible}
body.journey-static .scene{position:relative;inset:auto;height:100vh;height:100svh;min-height:480px}
body.journey-static .scene-interior{opacity:1!important;pointer-events:auto}
body.journey-static .entrance-zoom,body.journey-static .interior-zoom{transform:none!important}
body.journey-static .entrance-veil{display:none}
body.journey-static .entrance-decor{display:none}

body.journey-static .interior-card{opacity:1;visibility:visible;pointer-events:auto}

/* ===== 故事文字(原地淡入／淡出;只改 opacity,不位移) =====
   只在 body.story-on 時顯示;暫停、減少動態、直接閱讀時隱藏,改為顯示原請帖內容。 */
.story-layer{position:absolute;inset:0;z-index:5;display:none;pointer-events:none;overflow:hidden}
body.story-on .story-layer{display:block}

/* ===== 海邊結尾(footer) =====
   手機:圖在上(頂部/底部漸隱),文字卡在下並稍為疊入圖底。
   電腦(橫屏 ≥1200×700):文字卡放右側開闊海面。較窄橫屏同手機一樣上圖下文。
   圖按比例 cover,不拉伸;失敗時用暖白/淡海色漸變,並收窄高度。 */
footer.ending{position:relative;width:100vw;margin-left:calc(50% - 50vw);text-align:center;padding:0 0 max(40px,env(safe-area-inset-bottom))}
.ending-art{position:relative;width:100%;aspect-ratio:576/1024;max-height:1100px;overflow:hidden;pointer-events:none;
  background:linear-gradient(#f7f4eb,#e4eef0 55%,#f7f4eb)}

.ending-art.is-empty{aspect-ratio:auto;height:140px;max-height:none}
.ending-art[hidden] + .ending-panel{margin-top:0}

.ending-art picture{display:block;width:100%;height:100%;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent);
  mask-image:linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent)}

#endingImage{display:block;width:100%;height:100%;object-fit:cover;object-position:var(--end-pos-portrait,50% 50%);opacity:0;transition:opacity .8s ease}
#endingImage.is-loaded{opacity:1}
.ending-decor{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 5%,#000 95%,transparent);
  mask-image:linear-gradient(to bottom,transparent,#000 5%,#000 95%,transparent)}


.end-fb{position:absolute;translate:-50% -50%;pointer-events:none;will-change:transform,opacity}
.end-fb-wave{height:9px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(110,165,188,.75),transparent)}
.end-fb-leaf{width:30px;height:56px;border-radius:0 100% 0 100%;background:rgba(130,155,128,.6);transform-origin:50% 100%}
@keyframes endDrift{
  0%,100%{transform:translate3d(calc(var(--ad,12px)*-1),calc(var(--ab,2px)*-1),0) scale(.97);opacity:calc(var(--ao,.6)*.65)}
  50%{transform:translate3d(var(--ad,12px),var(--ab,2px),0) scale(1.03);opacity:var(--ao,.6)}
}
@keyframes endSway{0%,100%{transform:rotate(calc(var(--af,6deg)*-1))}50%{transform:rotate(var(--af,6deg))}}
.end-fb-wave{animation:endDrift var(--as,6s) ease-in-out infinite;animation-play-state:paused}
.end-fb-leaf{animation:endSway var(--as,5s) ease-in-out infinite;animation-play-state:paused}
.ending-live .end-fb{animation-play-state:running}

.ending-panel{position:relative;z-index:2;width:min(560px,calc(100% - 40px));margin:-40px auto 0;padding:26px 26px 22px;background:var(--card-bg);border:1px solid var(--card-line);border-radius:var(--card-radius);box-shadow:var(--card-shadow)}

.ending-panel .small{margin:0}

.jp{margin:0;font:13px/2 "Noto Serif JP",var(--serif);color:#7d6a55;letter-spacing:.08em}
.disclaimer{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:11px;line-height:1.9;color:var(--text-soft)}
@media (orientation:landscape){
  .ending-art{aspect-ratio:1024/576;max-height:none}
  #endingImage{object-position:var(--end-pos-landscape,50% 50%)}
}

@media (orientation:landscape) and (min-width:1200px) and (min-height:700px){

  .ending-art.is-empty + .ending-panel{position:relative;right:auto;top:auto;transform:none;width:min(560px,calc(100% - 40px));margin:-20px auto 0}
}

#toast{position:fixed;z-index:70;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:90%;padding:12px 18px;border-radius:12px;background:#40564ff2;color:#fffaf0;font-size:12px}

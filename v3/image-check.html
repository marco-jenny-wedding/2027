<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圖片檢查工具（只讀）</title>
<style>
body{margin:16px;font:14px/1.6 system-ui,-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;color:#333;background:#fafafa}
h1{font-size:20px}h2{font-size:17px;margin-top:28px}
table{border-collapse:collapse;font-size:12px;margin:8px 0;background:#fff}
th,td{border:1px solid #ccc;padding:4px 6px;text-align:left;vertical-align:top;white-space:pre-line}
th{background:#f0f0f0}
.muted{color:#888}
.controls{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:8px 0}
.view{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
figure{margin:0}figcaption{font-size:12px;color:#555;max-width:420px;overflow-wrap:anywhere}
canvas{display:block;max-width:90vw;height:auto;border:1px solid #999;cursor:crosshair;background:#fff}
textarea{width:100%;height:200px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace}
ul{font-size:13px}
</style>
</head>
<body>
<h1>圖片檢查工具（只會讀取，唔會修改任何檔案）</h1>
<p>請用本機伺服器開啟，例如 <code>http://localhost:8000/image-check.html</code>。直接雙擊開（file://）會讀唔到。建議用電腦 Chrome 或 Edge。</p>
<p id="status">讀取中…</p>
<div style="overflow-x:auto"><table id="table"></table></div>
<h2>花草同室內圖比例檢查</h2>
<ul id="ratios"></ul>
<p><button id="reportButton" type="button">產生純文字報告（可以複製俾我）</button></p>
<textarea id="report" readonly></textarea>

<h2>放大比較：原圖 vs 壓縮版</h2>
<div class="controls">
  <label>圖片 <select id="pick"></select></label>
  <label>背景 <select id="bg">
    <option value="checker">棋盤格</option>
    <option value="#ff00ff">洋紅（易見白邊）</option>
    <option value="#1a1a1a">深色（易見白邊）</option>
    <option value="#ffffff">白色（易見灰邊）</option>
    <option value="#f4ecdf">網站紙色</option>
  </select></label>
  <label>放大 <select id="zoom">
    <option value="1">100%（原圖 1:1）</option>
    <option value="2" selected>200%</option>
    <option value="4">400%</option>
  </select></label>
  <label><input type="checkbox" id="alphaOnly"> 只睇透明度（白＝不透明，黑＝透明）</label>
</div>
<p class="muted">喺「全圖」撳一下，揀要放大嘅位置（例如頭紗、白裙邊、花葉、門口）。兩邊顯示同一個範圍，以原圖像素為準；壓縮版解像度較低嘅話，會睇得出變矇。</p>
<div class="view">
  <figure><figcaption>全圖（撳選位置）</figcaption><canvas id="overview" width="240" height="240"></canvas></figure>
  <figure><figcaption id="capA">原圖</figcaption><canvas id="viewA" width="420" height="420"></canvas></figure>
  <figure><figcaption id="capB">壓縮版</figcaption><canvas id="viewB" width="420" height="420"></canvas></figure>
</div>

<script>
/* 原圖 → 壓縮版。如果你用咗其他檔名，只需要改呢度。 */
const PAIRS=[
  ["opening-paper","images/opening-paper.webp","images/optimized/opening-paper.webp"],
  ["chapel-entrance-mobile","images/chapel-entrance-mobile.webp","images/optimized/chapel-entrance-mobile.webp"],
  ["chapel-entrance-desktop","images/chapel-entrance-desktop.webp","images/optimized/chapel-entrance-desktop.webp"],
  ["chapel-interior-mobile","images/chapel-interior-mobile.webp","images/optimized/chapel-interior-mobile.webp"],
  ["chapel-interior-desktop","images/chapel-interior-desktop.webp","images/optimized/chapel-interior-desktop.webp"],
  ["couple-illustration (WebP)","images/couple-illustration.png","images/optimized/couple-illustration.webp"],
  ["couple-illustration (PNG)","images/couple-illustration.png","images/optimized/couple-illustration.png"],
  ["chapel-foreground-mobile (WebP)","images/chapel-foreground-mobile.png","images/optimized/chapel-foreground-mobile.webp"],
  ["chapel-foreground-mobile (PNG)","images/chapel-foreground-mobile.png","images/optimized/chapel-foreground-mobile.png"],
  ["chapel-foreground-desktop (WebP)","images/chapel-foreground-desktop.png","images/optimized/chapel-foreground-desktop.webp"],
  ["chapel-foreground-desktop (PNG)","images/chapel-foreground-desktop.png","images/optimized/chapel-foreground-desktop.png"]
];
/* 網站 "auto" 模式：花草同室內圖比例相差 < 4% 先會用 frame（對齊）模式 */
const RATIO_CHECKS=[
  ["chapel-foreground-mobile (WebP)","chapel-interior-mobile"],
  ["chapel-foreground-mobile (PNG)","chapel-interior-mobile"],
  ["chapel-foreground-desktop (WebP)","chapel-interior-desktop"],
  ["chapel-foreground-desktop (PNG)","chapel-interior-desktop"]
];

const $=id=>document.getElementById(id);
const clamp=(n,a=0,b=1)=>Math.max(a,Math.min(b,n));
const kb=b=>b==null?"—":b>=1048576?`${(b/1048576).toFixed(2)} MB`:`${Math.round(b/1024)} KB`;
const pc=v=>`${(v*100).toFixed(1)}%`;
const cache=new Map();
const data={};
const ratioLines=[];

function alphaStats(bmp){
  const s=Math.min(1,800/Math.max(bmp.width,bmp.height));
  const w=Math.max(1,Math.round(bmp.width*s)),h=Math.max(1,Math.round(bmp.height*s));
  const c=document.createElement("canvas");
  c.width=w;c.height=h;
  const ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(bmp,0,0,w,h);
  const d=ctx.getImageData(0,0,w,h).data;
  let solid=0,clear=0;
  for(let i=3;i<d.length;i+=4){
    if(d[i]>=250) solid++;
    else if(d[i]<=5) clear++;
  }
  const n=w*h;
  return {opaque:solid/n,clear:clear/n,semi:(n-solid-clear)/n,sample:`${w}×${h}`};
}

function fetchImage(url){
  if(!cache.has(url)){
    cache.set(url,(async()=>{
      try{
        const res=await fetch(url,{cache:"no-store"});
        if(!res.ok) return {url,missing:true,note:`HTTP ${res.status}`};
        const blob=await res.blob();
        const bmp=await createImageBitmap(blob);
        return {url,bytes:blob.size,format:url.split(".").pop().toUpperCase(),w:bmp.width,h:bmp.height,bmp,alpha:alphaStats(bmp)};
      }catch(error){
        return {url,missing:true,note:String(error&&error.message||error)};
      }
    })());
  }
  return cache.get(url);
}

const hasAlpha=a=>a && (a.clear+a.semi)>=0.0005;
function alphaText(a){
  if(!a) return "—";
  if(!hasAlpha(a)) return "冇透明";
  return `有透明：不透明 ${pc(a.opaque)}／半透明 ${pc(a.semi)}／全透明 ${pc(a.clear)}（以 ${a.sample} 取樣）`;
}
function describe(x){
  if(!x) return "—";
  if(x.missing) return `未有檔案（${x.note}）`;
  return `${x.w}×${x.h}　${kb(x.bytes)}　${x.format}\n${alphaText(x.alpha)}`;
}
function notes(o,c){
  const n=[];
  if(o.missing) n.push("⚠ 原圖讀唔到");
  if(c.missing){n.push("未有壓縮版");return n}
  if(!o.missing){
    n.push(`檔案大小 = 原圖嘅 ${pc(c.bytes/o.bytes)}`);
    if(c.w>o.w||c.h>o.h) n.push("⚠ 比原圖大：即係放大咗，冇意義");
    if(Math.abs((c.w/c.h)/(o.w/o.h)-1)>0.01) n.push("⚠ 長闊比例改變咗");
    if(hasAlpha(o.alpha)&&!hasAlpha(c.alpha)) n.push("⚠ 透明背景消失咗");
    if(hasAlpha(o.alpha)&&Math.abs(c.alpha.semi-o.alpha.semi)>0.02) n.push("留意：半透明比例變化較大，請放大睇頭紗／邊緣");
  }
  return n;
}

async function main(){
  for(const [key,orig,opt] of PAIRS){
    const [o,c]=await Promise.all([fetchImage(orig),fetchImage(opt)]);
    data[key]={key,orig:o,opt:c};
    const option=document.createElement("option");
    option.value=key;
    option.textContent=key;
    $("pick").append(option);
  }

  const table=$("table");
  const head=table.insertRow();
  ["圖片","原圖","壓縮版","備註"].forEach(t=>{const th=document.createElement("th");th.textContent=t;head.append(th)});
  for(const key in data){
    const p=data[key];
    const row=table.insertRow();
    [key,`${p.orig.url}\n${describe(p.orig)}`,`${p.opt.url}\n${describe(p.opt)}`,notes(p.orig,p.opt).join("\n")]
      .forEach(t=>{row.insertCell().textContent=t});
  }

  for(const [fg,interior] of RATIO_CHECKS){
    for(const side of ["orig","opt"]){
      const a=data[fg][side],b=data[interior][side];
      if(a.missing||b.missing) continue;
      const diff=Math.abs((a.w/a.h)/(b.w/b.h)-1);
      const label=side==="orig"?"原圖":"壓縮版";
      const line=`${fg} vs ${interior}（${label}）：比例相差 ${pc(diff)} → ${diff<0.04?"網站會用 frame 模式（同室內圖對齊）":"⚠ 網站會改用 bottom 模式，擺位會改變"}`;
      if(!ratioLines.includes(line)) ratioLines.push(line);
    }
  }
  $("ratios").replaceChildren(...ratioLines.map(t=>{const li=document.createElement("li");li.textContent=t;return li}));

  $("status").textContent=`完成：已讀取 ${cache.size} 個路徑（讀唔到嘅會標示「未有檔案」）。`;
  draw();
}

$("reportButton").addEventListener("click",()=>{
  const lines=[`圖片檢查報告　${new Date().toISOString()}`,""];
  for(const key in data){
    const p=data[key];
    lines.push(`■ ${key}`);
    lines.push(`  原圖　 ${p.orig.url}　${describe(p.orig).replace("\n","　")}`);
    lines.push(`  壓縮版 ${p.opt.url}　${describe(p.opt).replace("\n","　")}`);
    const n=notes(p.orig,p.opt);
    if(n.length) lines.push(`  備註　 ${n.join("；")}`);
    lines.push("");
  }
  lines.push("■ 花草／室內比例",...ratioLines.map(t=>"  "+t));
  $("report").value=lines.join("\n");
  $("report").select();
});

/* ---------- 放大比較 ---------- */
let focus={x:.5,y:.5};
let lastOverview=null;
let lastView=null;

function paintBg(ctx,w,h){
  const v=$("bg").value;
  if(v!=="checker"){ctx.fillStyle=v;ctx.fillRect(0,0,w,h);return}
  for(let y=0;y<h;y+=16){
    for(let x=0;x<w;x+=16){
      ctx.fillStyle=(x/16+y/16)%2?"#cfcfcf":"#ffffff";
      ctx.fillRect(x,y,16,16);
    }
  }
}

function drawView(cv,img,r,z,base){
  const ctx=cv.getContext("2d",{willReadFrequently:true});
  const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  if(!img||img.missing){
    ctx.fillStyle="#eee";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#b00020";ctx.font="14px sans-serif";ctx.fillText("未有檔案",12,24);
    return;
  }
  const dw=r.rw*base.w*z,dh=r.rh*base.h*z;
  const sx=r.x*img.w,sy=r.y*img.h,sw=r.rw*img.w,sh=r.rh*img.h;
  if($("alphaOnly").checked){
    ctx.drawImage(img.bmp,sx,sy,sw,sh,0,0,dw,dh);
    const id=ctx.getImageData(0,0,W,H),d=id.data;
    for(let i=0;i<d.length;i+=4){const a=d[i+3];d[i]=d[i+1]=d[i+2]=a;d[i+3]=255}
    ctx.putImageData(id,0,0);
  }else{
    paintBg(ctx,W,H);
    ctx.drawImage(img.bmp,sx,sy,sw,sh,0,0,dw,dh);
  }
}

function draw(){
  const p=data[$("pick").value];
  if(!p) return;
  const base=!p.orig.missing?p.orig:(!p.opt.missing?p.opt:null);
  const ov=$("overview"),octx=ov.getContext("2d");
  octx.clearRect(0,0,ov.width,ov.height);
  if(!base){lastOverview=null;return}

  const s=Math.min(ov.width/base.w,ov.height/base.h);
  const w=base.w*s,h=base.h*s,ox=(ov.width-w)/2,oy=(ov.height-h)/2;
  paintBg(octx,ov.width,ov.height);
  octx.drawImage(base.bmp,ox,oy,w,h);
  lastOverview={ox,oy,w,h};

  const z=+$("zoom").value;
  const cv=$("viewA");
  const rw=Math.min(1,cv.width/(z*base.w)),rh=Math.min(1,cv.height/(z*base.h));
  const r={rw,rh,x:clamp(focus.x-rw/2,0,1-rw),y:clamp(focus.y-rh/2,0,1-rh)};
  lastView={r,dw:rw*base.w*z,dh:rh*base.h*z};

  drawView($("viewA"),p.orig,r,z,base);
  drawView($("viewB"),p.opt,r,z,base);

  octx.strokeStyle="#e00";octx.lineWidth=2;
  octx.strokeRect(ox+r.x*w,oy+r.y*h,r.rw*w,r.rh*h);

  const cap=(label,x)=>x.missing?`${label}：未有檔案`:`${label}：${x.url}　${x.w}×${x.h}　${kb(x.bytes)}`;
  $("capA").textContent=cap("原圖",p.orig);
  $("capB").textContent=cap("壓縮版",p.opt);
}

function canvasPoint(cv,e){
  const rect=cv.getBoundingClientRect();
  return {x:(e.clientX-rect.left)*cv.width/rect.width,y:(e.clientY-rect.top)*cv.height/rect.height};
}
$("overview").addEventListener("click",e=>{
  if(!lastOverview) return;
  const pt=canvasPoint($("overview"),e),o=lastOverview;
  focus={x:clamp((pt.x-o.ox)/o.w),y:clamp((pt.y-o.oy)/o.h)};
  draw();
});
for(const id of ["viewA","viewB"]){
  $(id).addEventListener("click",e=>{
    if(!lastView) return;
    const pt=canvasPoint($(id),e),v=lastView;
    focus={x:clamp(v.r.x+clamp(pt.x/v.dw)*v.r.rw),y:clamp(v.r.y+clamp(pt.y/v.dh)*v.r.rh)};
    draw();
  });
}
["pick","bg","zoom","alphaOnly"].forEach(id=>$(id).addEventListener("change",draw));

main();
</script>
</body>
</html>

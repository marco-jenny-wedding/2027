<style>
:root{
  --ink:#40564f;
  --muted:#76837a;
  --paper:#f7f4eb;

  /* 婚禮手帳色 */
  --paper-warm:#f4ecdf;
  --ivory:#fffdf7;
  --sea:#5d8ba0;
  --sea-soft:#a9c8d3;
  --sage:#8fa38c;
  --sage-deep:#546e63;
  --blush:#d9b3a8;

  --line:#bac6af66;
  --serif:"Noto Serif TC","Songti TC","PMingLiU","Noto Serif CJK TC",serif;
  --cute:"Maoken Wedding","Noto Serif TC","Songti TC","PMingLiU",serif;
  --opening-paper:none;
  --entrance-pos-portrait:50% 58%;
  --entrance-pos-landscape:50% 56%;
  --interior-pos-portrait:50% 52%;
  --interior-pos-landscape:50% 50%;
  --entrance-scroll:320vh;
  --topbar-height:80px;
}
*{box-sizing:border-box}
html{
  scroll-behavior:smooth;
  scroll-padding-top:calc(var(--topbar-height) + 16px);
}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:400 14px/2 var(--serif);
  letter-spacing:.025em;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body.waiting{overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
a{color:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #a27856;
  outline-offset:5px;
}
::selection{background:#ead8c6}
h1,h2,h3,p{overflow-wrap:anywhere}
h1,h2,h3,.cute{
  font-family:var(--cute);
  font-weight:400;
  font-synthesis:none;
}
[data-copy],.copy{white-space:pre-line}
.eyebrow{font:10px/1.9 Georgia,serif;letter-spacing:.2em}
.small{font-size:12px;line-height:2.2;color:var(--muted)}
.center{text-align:center}

.sr-only{
  position:absolute!important;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0 0 0 0);
  clip-path:inset(50%);
  white-space:nowrap;
  border:0;
}

/* 頂部 */
.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:40;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px 16px;
  padding:
    max(14px,env(safe-area-inset-top))
    max(18px,5%,env(safe-area-inset-right))
    14px
    max(18px,5%,env(safe-area-inset-left));
  background:#f6f0e5;
  border-bottom:1px solid #e2dccd;
  box-shadow:0 5px 20px rgba(64,86,79,.06);
  isolation:isolate;
}
.brand{
  flex:0 1 auto;
  min-width:0;
  font:23px/1.5 Georgia,serif;
  letter-spacing:.08em;
  color:#4d6556;
  overflow-wrap:anywhere;
}
.top-buttons{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  flex-wrap:wrap;
  gap:8px;
  margin-left:auto;
}
.control{
  min-height:44px;
  min-width:44px;
  padding:9px 13px;
  border:1px solid #d3cfbf;
  border-radius:30px;
  background:var(--ivory);
  font-size:11px;
  box-shadow:0 2px 8px rgba(64,86,79,.04);
}
.control:hover{background:#eef1e8}
.control[aria-pressed="true"]{
  background:#e6eee9;
  border-color:#a9bfb6;
}
#musicButton.is-playing{
  background:#e6eee9;
  border-color:#a9bfb6;
}
.primary{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  min-height:48px;
  padding:11px 25px;
  border:1px solid #b1baa1;
  border-radius:28px;
  background:#f8fbef;
  color:#4b6354;
  box-shadow:0 6px 20px #50664b12;
  font:400 20px/1.6 var(--cute);
}
.text-button{
  min-height:44px;
  padding:9px 13px;
  border:0;
  background:transparent;
  font-size:11px;
  color:#6a7b6f;
  text-decoration:underline;
  text-decoration-color:#a9bdb2;
  text-underline-offset:5px;
}
.text-button:hover{color:var(--ink)}

  overflow:hidden;
  background:
    radial-gradient(ellipse 60% 45% at 50% 50%,#fffaf1cc,transparent 70%),
    var(--paper-warm);
}
.intro-paper::before,
.intro-paper::after{
  content:"";
  position:absolute;
  background-image:var(--opening-paper);
  background-repeat:no-repeat;
}
@media (orientation:portrait){
  .intro-paper::before{
    left:0;
    right:0;
    top:var(--topbar-height);
    height:50vw;
    background-size:100vw auto;
    background-position:center top;
    -webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent);
    mask-image:linear-gradient(to bottom,#000 62%,transparent);
  }
  .intro-paper::after{
    left:0;
    right:0;
    bottom:0;
    height:50vw;
    background-size:100vw auto;
    background-position:center bottom;
    -webkit-mask-image:linear-gradient(to top,#000 62%,transparent);
    mask-image:linear-gradient(to top,#000 62%,transparent);
  }
}
@media (orientation:landscape){
  .intro-paper::before{
    top:0;
    bottom:0;
    left:0;
    width:50vh;
    background-size:auto 100vh;
    background-position:left center;
    -webkit-mask-image:linear-gradient(to right,#000 62%,transparent);
    mask-image:linear-gradient(to right,#000 62%,transparent);
  }
  .intro-paper::after{
    top:0;
    bottom:0;
    right:0;
    width:50vh;
    background-size:auto 100vh;
    background-position:right center;
    -webkit-mask-image:linear-gradient(to left,#000 62%,transparent);
    mask-image:linear-gradient(to left,#000 62%,transparent);
  }
}

.intro-inner{
  position:relative;
  z-index:1;
  width:min(100%,760px);
  min-height:100%;
  margin:auto;
  padding:
    calc(var(--topbar-height) + 18px)

  align-items:center;

.photo-card{

.petals{position:absolute;inset:-30px;pointer-events:none}
.petal{
  position:absolute;
  width:10px;
  height:15px;
  background:linear-gradient(130deg,#fbefe9,#ddb8ad);
  border-radius:90% 8% 80% 25%;
  opacity:.55;
  animation:petalFloat 6s ease-in-out infinite alternate;
  transition:opacity 1.1s ease,translate 1.1s ease;
}
.petal:nth-child(1){left:-4%;top:24%;rotate:35deg}
.petal:nth-child(2){right:-3%;top:12%;rotate:-30deg;animation-delay:-2s}
.petal:nth-child(3){right:4%;bottom:6%;rotate:60deg;animation-delay:-3.5s}
#intro.revealed .petal:nth-child(odd){translate:-40px 30px;opacity:0}
#intro.revealed .petal:nth-child(even){translate:40px 30px;opacity:0}
@keyframes petalFloat{
  from{transform:translateY(-6px) rotate(-8deg)}
  to{transform:translateY(8px) rotate(12deg)}
}
body.motion-paused .petal{animation-play-state:paused}

/* ==========================================================
   手繪教堂：入口 → 紙色 → 室內（由 scroll 控制）
   結構：
   .chapel-entrance（較高，提供 scroll 距離；不可設 overflow）
     └ .entrance-sticky（黏住畫面）
         ├ .scene-entrance（入口插畫 + 入口文字卡）
         └ .scene-interior（室內插畫 + 室內文字卡，隨 scroll 淡入）
   減少動態效果時：兩個畫面變成上下排列的靜態畫面。
   ========================================================== */
main{position:relative;z-index:2}

.chapel-entrance{
  position:relative;
  height:calc(100vh + var(--entrance-scroll));
  height:calc(100svh + var(--entrance-scroll));
  background:var(--paper-warm);
}
.entrance-sticky{
  position:sticky;
  top:0;
  height:100vh;
  height:100svh;
  min-height:480px;
  overflow:hidden;
  background:var(--paper-warm);
}
.scene{
  position:absolute;
  inset:0;
  overflow:hidden;
}
.scene-entrance{z-index:1}
.scene-interior{
  z-index:3;
  opacity:0;
  pointer-events:none;
  background:var(--paper-warm);
}

.entrance-stage,
.interior-stage{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  top:var(--topbar-height);
  overflow:hidden;
}
/* 上下邊緣融入紙色（固定，不隨縮放） */
.entrance-stage::after,
.interior-stage::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:linear-gradient(
    to bottom,
    var(--paper-warm) 0,
    rgba(244,236,223,0) 7%,
    rgba(244,236,223,0) 76%,
    rgba(244,236,223,.82) 100%
  );
}

.entrance-visual{
  position:absolute;
  inset:0;
  opacity:0;
  transform:scale(1.025);
  transition:
    opacity 1.1s ease .15s,
    transform 1.6s cubic-bezier(.2,.6,.2,1) .15s;
}
.chapel-entrance.is-shown .entrance-visual{
  opacity:1;
  transform:none;
}
.entrance-zoom,
.interior-zoom{
  position:absolute;
  inset:0;
  transform:none;
  will-change:transform;
}
.entrance-zoom{transform-origin:50% 62%}
.interior-zoom{transform-origin:50% 60%}

.entrance-zoom picture,
.entrance-zoom img,
.interior-zoom picture,
.interior-zoom img{
  display:block;
  width:100%;
  height:100%;
}
.entrance-zoom img,
.interior-zoom img{
  object-fit:cover;
  opacity:0;
  transition:opacity .8s ease;
}
.entrance-zoom img{object-position:var(--entrance-pos-portrait)}
.interior-zoom img{object-position:var(--interior-pos-portrait)}
.entrance-zoom img.is-loaded,
.interior-zoom img.is-loaded{opacity:1}
@media (orientation:landscape){
  .entrance-zoom img{object-position:var(--entrance-pos-landscape)}
  .interior-zoom img{object-position:var(--interior-pos-landscape)}
}

/* 入口 → 室內之間的暖米白紙色（只蓋住入口插畫，不蓋文字卡） */
.entrance-veil{
  position:absolute;
  inset:0;
  z-index:1;
  background:var(--paper-warm);
  opacity:0;
  pointer-events:none;
}

.entrance-fallback{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:24px 24px 30%;
  background:
    radial-gradient(ellipse 70% 50% at 50% 40%,#fffaf1,transparent 70%),
    linear-gradient(#e4eef0,var(--paper-warm) 62%);
  color:#7d8a80;
  font-size:12px;
  text-align:center;
}
.entrance-fallback .arch{
  width:min(150px,34vw);
  aspect-ratio:3/4;
  border:2px solid #b9c8bd;
  border-bottom:0;
  border-radius:50% 50% 0 0 / 38% 38% 0 0;
}

/* 文字卡（入口及室內共用風格） */
.entrance-card,
.interior-card{
  position:absolute;
  z-index:3;
  left:50%;
  bottom:max(18px,env(safe-area-inset-bottom));
  width:min(360px,calc(100% - 36px));
  margin-left:max(-180px,calc(-50% + 18px));
  padding:16px 20px 8px;
  background:rgba(255,253,247,.92);
  border:1px solid #ece3d3;
  border-radius:4px;
  box-shadow:0 18px 40px -26px rgba(80,90,78,.45);
  text-align:center;
}
.entrance-card{
  opacity:0;
  translate:0 10px;
  transition:opacity .8s ease .9s,translate .8s ease .9s;
}
.chapel-entrance.is-shown .entrance-card{
  opacity:1;
  translate:0 0;
}
/* 首次出現後，取消延遲，令向上 scroll 時即時返回 */
.chapel-entrance.cards-ready .entrance-card{
  transition:opacity .45s ease,translate .45s ease;
}
.chapel-entrance.is-shown .entrance-card.is-off{
  opacity:0;
  translate:0 -6px;
  pointer-events:none;
}
.interior-card{
  opacity:0;
  translate:0 10px;
  pointer-events:none;
  transition:opacity .6s ease,translate .6s ease;
}
.interior-card.is-on{
  opacity:1;
  translate:0 0;
  pointer-events:auto;
}

.entrance-card .eyebrow,
.interior-card .eyebrow{color:var(--sea)}
.entrance-card h2,
.interior-card h2{
  margin:4px 0 6px;
  font-size:clamp(20px,5vw,24px);
  line-height:1.6;
  color:var(--ink);
}
.interior-names{
  margin:0 0 4px;
  font:clamp(22px,5.5vw,27px)/1.6 var(--cute);
  letter-spacing:.06em;
  color:var(--sage-deep);
}
.entrance-note{
  margin:0;
  font-size:10px;
  line-height:1.8;
  color:#7f8b82;
}
.entrance-actions{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
  gap:2px 14px;
  margin-top:6px;
}
.scroll-cue{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:var(--sage-deep);
  transition:opacity .4s ease;
}
.chapel-entrance.is-walking .entrance-card .scroll-cue{opacity:.55}
.scroll-cue .arrow{
  display:inline-block;
  animation:cueBob 2.4s ease-in-out infinite;
}
@keyframes cueBob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(4px)}
}
body.motion-paused .scroll-cue .arrow{animation:none}

/* 橫屏：文字卡放左邊，避開正中門口及走道 */
@media (orientation:landscape){
  .entrance-card,
  .interior-card{
    left:max(4%,env(safe-area-inset-left));
    margin-left:0;
    bottom:8%;
    width:min(340px,38vw);
    text-align:left;
  }
  .entrance-actions{justify-content:flex-start}
}
@media (orientation:landscape) and (max-height:520px){
  .entrance-card,
  .interior-card{padding:10px 14px 4px}
  .entrance-card h2,
  .interior-card h2{font-size:18px}
  .interior-names{font-size:20px}
}

body.motion-paused #intro,
body.motion-paused .intro-inner,
body.motion-paused .entrance-visual,
body.motion-paused .entrance-card,
body.motion-paused .interior-card,
body.motion-paused .entrance-zoom img,
body.motion-paused .interior-zoom img{
  transition:none!important;
}

/* 減少動態效果：入口及室內上下排列，各佔一個畫面，靜態顯示 */
body.journey-static .chapel-entrance{height:auto}
body.journey-static .entrance-sticky{
  position:relative;
  height:auto;
  min-height:0;
  overflow:visible;
}
body.journey-static .scene{
  position:relative;
  inset:auto;
  height:100vh;
  height:100svh;
  min-height:480px;
}
body.journey-static .scene-interior{
  opacity:1!important;
  pointer-events:auto;
}
body.journey-static .entrance-zoom,
body.journey-static .interior-zoom{transform:none!important}
body.journey-static .entrance-veil{display:none}
body.journey-static .interior-card{
  opacity:1;
  translate:none;
  pointer-events:auto;
}
body.journey-static .chapel-entrance.is-shown .entrance-card.is-off{
  opacity:1;
  translate:none;
  pointer-events:auto;
}

  font-size:10px;
  line-height:2;
  color:#8a9583;
}
#toast{
  position:fixed;
  z-index:70;
  left:50%;
  bottom:max(20px,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:max-content;
  max-width:90%;
  padding:12px 18px;
  border-radius:12px;
  background:#40564ff2;
  color:#fffaf0;
  font-size:12px;
}
.noscript{
  position:relative;
  z-index:50;
  margin:100px auto 30px;
  padding:25px;
  max-width:600px;
  background:#fffdf5;
  text-align:center;
}

@media(max-width:760px){
  .topbar{
    padding-left:max(18px,env(safe-area-inset-left));
    padding-right:max(18px,env(safe-area-inset-right));
  }
  .control{font-size:10px;padding:9px 11px}
  .brand{font-size:21px}
  .intro-heading{font-size:24px}
  .photo-card{width:min(320px,78vw,42svh)}
  .content{padding:60px 20px 0}
  .walk-card{border-radius:65px 65px 20px 20px}
  .walk-labels{font-size:14px;padding-bottom:16px}
  #journeyText{font-size:21px}
  .paper{padding:28px 24px}
  .letter{margin:52px 0}
  .letter p{font-size:13px}
  .details{grid-template-columns:minmax(0,1fr);gap:30px}
}
@media(max-height:620px){
  .intro-inner{justify-content:flex-start}
  .photo-card{width:min(260px,68vw)}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
  }
}

function get(path){
  return path.split(".").reduce((value,key)=>value?.[key],C);
}

function format(value,extra={}){
  const values={...vars,...extra};
  return String(value??"").replace(
    /\{([A-Za-z0-9_]+)\}/g,
    (match,key)=>Object.prototype.hasOwnProperty.call(values,key)
      ?String(values[key]??"")
      :match
  );
}

function copy(path,extra={}){
  return format(get(path),extra);
}

function put(id,path,extra={}){
  const el=$(id);
  if(el) el.textContent=copy(path,extra);
}

function toast(path){
  put("toast",path);
  $("toast").hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$("toast").hidden=true,5000);
}

function link(id,value){
  try{
    const url=new URL(String(value||""));
    if(!["http:","https:"].includes(url.protocol)){
      throw new Error("Unsupported link protocol");
    }
    $(id).href=url.href;
    $(id).hidden=false;
  }catch{
    $(id).hidden=true;
  }
}

/* ==========================================================
   日期解析
   ========================================================== */
function parseDay(value){
  const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value));

  if(!match){
    throw new Error(copy("messages.dateFormat"));
  }

  const [year,month,dateDay]=match.slice(1).map(Number);
  const date=new Date(0);

  date.setUTCFullYear(year,month-1,dateDay);
  date.setUTCHours(0,0,0,0);

  if(
    date.getUTCFullYear()!==year ||
    date.getUTCMonth()!==month-1 ||
    date.getUTCDate()!==dateDay
  ){
    throw new Error(copy("messages.dateInvalid"));
  }

  return {
    index:Math.floor(date.getTime()/DAY),
    year,
    month,
    day:dateDay
  };
}

let wedding=null;

try{
  wedding=parseDay(C.weddingDate);

  const dateVars={
    year:wedding.year,
    month:wedding.month,
    day:wedding.day,
    month2:String(wedding.month).padStart(2,"0"),
    day2:String(wedding.day).padStart(2,"0"),
    monthEnglish:C.dates.months[wedding.month-1]
  };

  vars.dateLong=format(C.dates.long,dateVars);
  vars.dateDot=format(C.dates.dot,dateVars);
  vars.dateEnglish=format(C.dates.english,dateVars);
}catch(error){
  day.error=error.message;
}

if(wedding){
  try{
    const start=parseDay(C.journeyStartDate);

    if(start.index>=wedding.index){
      throw new Error(copy("messages.dateOrder"));
    }

    Object.assign(day,{
      valid:true,
      start:start.index,
      end:wedding.index
    });
  }catch(error){
    day.error=error.message;
  }
}

/* scroll 距離分三段：門外走近 → 紙色過渡 → 室內停留 */
let fracA=.5;
let fracT=.22;

(function setJourneyScroll(){
  const a=clamp(numeric(C.entranceScrollScreens,1.6),.5,4);
  const t=clamp(numeric(C.interiorTransitionScreens,.7),.3,2);
  const h=clamp(numeric(C.interiorHoldScreens,.9),.3,3);
  const total=a+t+h;

  fracA=a/total;
  fracT=t/total;

  // svh 唔受手機網址列伸縮影響；舊瀏覽器用 vh
  const unit=window.CSS?.supports?.("height","1svh")?"svh":"vh";
  root.style.setProperty("--entrance-scroll",`${(total*100).toFixed(1)}${unit}`);
})();

/* ==========================================================
   scroll 控制：入口走近 → 紙色 → 室內
   - 進度只由 scroll 位置決定，向上 scroll 自然反向。
   - 不鎖住、不劫持 scroll，冇自動播放。
   ========================================================== */
let zoomMax=1;
let focusY=.62;
let stageHeight=0;
let entranceTicking=false;

function parseFocusY(value,fallback){
  const parts=String(value||"").trim().split(/\s+/);
  const match=/^(-?\d+(?:\.\d+)?)%$/.exec(parts[1]||"");
  return match?clamp(Number(match[1])/100):fallback;
}

function measureEntrance(){
  const landscape=landscapeQuery.matches;
  const focus=String(
    (landscape?C.entranceFocusLandscape:C.entranceFocusPortrait)||""
  ).trim()||(landscape?"50% 72%":"50% 62%");

  entranceZoom.style.transformOrigin=focus;
  focusY=parseFocusY(focus,landscape?.72:.62);

  const rect=entranceStage.getBoundingClientRect();
  stageHeight=rect.height;

  const configured=clamp(numeric(C.entranceZoomMax,1.5),1,2);
  let allowed=configured;

  // 解像度保護：圖片放大到太模糊之前停止
  if(entranceImage.naturalWidth && rect.width && rect.height){
    const cover=Math.max(
      rect.width/entranceImage.naturalWidth,
      rect.height/entranceImage.naturalHeight
    );
    const dpr=Math.min(devicePixelRatio||1,2);
    const sharpness=clamp(numeric(C.entranceMinSharpness,.5),.2,1);
    allowed=1/(cover*dpr*sharpness);
  }

  zoomMax=clamp(allowed,Math.min(configured,1.15),configured);
}

function journeyDistance(){
  return Math.max(1,entrance.offsetHeight-entranceSticky.offsetHeight);
}

function setCards(entranceOn,interiorOn){
  entranceCard.classList.toggle("is-off",!entranceOn);
  interiorCard.classList.toggle("is-on",interiorOn);
}

function updateEntrance(){
  entranceTicking=false;

  // 減少動態效果：靜態，上下排列
  if(isStatic()){
    entranceZoom.style.transform="none";
    entranceVeil.style.opacity="0";
    sceneInterior.style.opacity="";
    interiorZoom.style.transform="";
    entrance.classList.remove("is-walking");
    setCards(true,true);
    return;
  }

  const rect=entrance.getBoundingClientRect();
  const p=clamp(-rect.top/journeyDistance());
  const pe=clamp(p/fracA);            // 門外走近 0→1
  const pt=clamp((p-fracA)/fracT);    // 紙色過渡 0→1

  if(pe>.3 && rect.bottom>0) startInteriorImage();

  entrance.classList.toggle("is-walking",pe>.03);

  // 暫停動畫：冇縮放、冇淡入淡出，只喺過渡中間簡單切換
  if(paused){
    const inside=pt>=.5;
    entranceZoom.style.transform="none";
    entranceVeil.style.opacity="0";
    sceneInterior.style.opacity=inside?"1":"0";
    interiorZoom.style.transform="none";
    setCards(!inside,inside);
    return;
  }

  /* 1. 門外走近（沿用已確認效果） */
  if(entranceHasImage){
    const eased=smooth(pe);
    const zoom=1+(zoomMax-1)*eased;

    let shift=(.5-focusY)*stageHeight*.35*eased;
    const slackDown=(zoom-1)*focusY*stageHeight;
    const slackUp=(zoom-1)*(1-focusY)*stageHeight;
    shift=clamp(shift,-slackUp,slackDown);

    entranceZoom.style.transform=
      `translate(0,${shift.toFixed(1)}px) scale(${zoom.toFixed(4)})`;
  }else{
    entranceZoom.style.transform="none";
  }

  /* 2. 暖米白紙色：沿用入口尾段，再加深少少 */
  const veil=
    .55*clamp((pe-.82)/.18)+
    .37*clamp(pt/.45);
  entranceVeil.style.opacity=veil.toFixed(3);

  /* 3. 室內淡入：紙色未到最深已開始出現，避免長時間空白 */
  const fade=smooth(clamp((pt-.3)/.6));
  sceneInterior.style.opacity=fade.toFixed(3);

  // 室內由 1.05 輕輕回到 1，似行入門後停定
  const settle=interiorHasImage?1+.05*(1-smooth(pt)):1;
  interiorZoom.style.transform=`scale(${settle.toFixed(4)})`;

  setCards(pt<.45,pt>=.5);
}

function requestEntranceUpdate(){
  if(entranceTicking) return;
  entranceTicking=true;
  requestAnimationFrame(updateEntrance);
}

// 鍵盤 Tab 去到未顯示嘅文字卡時，將畫面帶到該卡出現嘅位置
function scrollToJourney(progress){
  if(isStatic()) return;
  const top=entrance.getBoundingClientRect().top+scrollY+progress*journeyDistance();
  window.scrollTo({top,left:0,behavior:"instant"});
}

entranceCard.addEventListener("focusin",()=>{
  if(!isStatic() && entranceCard.classList.contains("is-off")){
    scrollToJourney(0);
  }
});

interiorCard.addEventListener("focusin",()=>{
  if(!isStatic() && !interiorCard.classList.contains("is-on")){
    scrollToJourney(fracA+fracT);
  }
});

},{passive:true});

function layoutSVG(){
  svgWidth=$("walkWorld").clientWidth<620?540:900;

  const center=svgWidth/2;
  const margin=78;
  const halfGap=58;
  const distance=center-halfGap-margin;
  const gx=margin+distance*day.progress;
  const bx=svgWidth-margin-distance*day.progress;

  $("coupleSvg").setAttribute("viewBox",`0 0 ${svgWidth} 350`);
  tr("gPosition",`translate(${gx} 291)`);
  tr("bPosition",`translate(${bx} 291)`);
  tr("togetherPeople",`translate(${center} 291)`);
  tr("svgArch",`translate(${center} 0)`);

  $("svgGlow").setAttribute("cx",center);
  $("svgGround").setAttribute("d",`M35 295H${svgWidth-35}`);
  $("svgDots").setAttribute("d",`M45 315H${svgWidth-45}`);

  svgDirty=true;
}

function coupleState(){
  const met=together();

  $("walkingPeople").setAttribute("visibility",met?"hidden":"visible");
  $("togetherPeople").setAttribute("visibility",met?"visible":"hidden");

  $("previewBadge").hidden=!preview;
  $("arrivalDate").hidden=!met;

  $("journeyFill").style.width=day.progress*100+"%";

  put(
    "previewButton",
    preview?"countdown.returnButton":"countdown.previewButton"
  );
  $("previewButton").setAttribute("aria-pressed",String(preview));

  if(day.valid){
    put("journeyText",met?"countdown.arrivedHeading":"countdown.waitingHeading");
    put("journeyNote",met?"countdown.arrivedNote":"countdown.waitingNote");
    put("coupleDesc",met?"countdown.svgArrived":"countdown.svgWaiting");
  }else{
    put("journeyText","messages.dateHeading");
    $("journeyNote").textContent=day.error;
    put("coupleDesc","countdown.svgInvalid");
  }

  layoutSVG();
}

function updateDay(force=false){
  if(!day.valid) return;

  const today=japanToday();
  if(!force && today===day.cached) return;

  day.cached=today;
  day.remaining=Math.max(0,day.end-today);
  day.arrived=today>=day.end;
  day.progress=clamp((today-day.start)/(day.end-day.start));
  vars.days=day.remaining;

  if(day.arrived) preview=false;

  $("daysNumber").textContent=day.remaining;
  $("dayCounter").hidden=day.arrived;
  $("arrivalMessage").hidden=!day.arrived;
  $("previewButton").hidden=day.arrived;

  put(
    "countdownNote",
    day.arrived?"countdown.afterNote":"countdown.beforeNote"
  );

  coupleState();
}

function scheduleDay(){
  clearTimeout(dayTimer);
  if(document.hidden || !day.valid) return;

  const until=(japanToday()+1)*DAY-JST-Date.now();

  dayTimer=setTimeout(()=>{
    updateDay();
    scheduleDay();
  },Math.max(100,Math.min(60000,until+80)));
}

function drawCouple(t){
  if(!together()){
    const s=Math.sin(t*7);
    const b=Math.sin(t*7+.45);

    tr("gMotion",`translate(0 ${-Math.abs(s)*3.3})`);
    tr("gLegL",`translate(-12 -29) rotate(${s*22})`);
    tr("gLegR",`translate(12 -29) rotate(${-s*22})`);
    tr("gArmL",`translate(-29 -77) rotate(${-s*18})`);
    tr("gArmR",`translate(29 -77) rotate(${s*18})`);
    tr("gHead",`rotate(${Math.sin(t*3.5)*1.2} 0 -90)`);

    tr("bMotion",`translate(0 ${-Math.abs(b)*2.8})`);
    tr("bLegL",`translate(-12 -20) rotate(${b*23})`);
    tr("bLegR",`translate(12 -20) rotate(${-b*23})`);
    tr("bArmR",`translate(25 -76) rotate(${b*14})`);
    tr("bArmL",`translate(-25 -76) rotate(${-b*5})`);
    tr("bVeil",`rotate(${Math.sin(t*2)*1.6} 0 -173)`);
    tr("bHead",`rotate(${Math.sin(t*3.5+.3)*1.2} 0 -90)`);
  }else{
    const cycle=(t%8)/8;
    const phase=cycle*Math.PI*2;
    const lean=Math.pow(Math.sin(Math.PI*cycle),2);

    tr("togetherSway",`rotate(${Math.sin(phase)*1.6} 0 0)`);
    tr("agHead",`rotate(${lean*7} 0 -90)`);
    tr("abHead",`rotate(${lean*7} 0 -90)`);
    tr("abVeil",`rotate(${Math.sin(phase+.7)*1.5} 0 -173)`);
    tr("abArmL",`translate(-25 -76) rotate(${Math.sin(phase)*3})`);

    for(let i=0;i<3;i++){
      const p=(cycle+i*.24)%1;
      $("heart"+i).setAttribute(
        "opacity",
        Math.pow(Math.sin(Math.PI*p),2)*.85
      );
      tr(
        "heart"+i,
        `translate(
          ${[0,-28,29][i]+Math.sin(p*Math.PI*2)*5}
          ${-170-p*62}
        ) scale(${[.6,.4,.35][i]})`
      );
    }
  }
}

$("previewButton").addEventListener("click",()=>{
  preview=!preview;
  animationTime=0;
  coupleState();
  if(preview && paused) toast("messages.previewPaused");
});

if("ResizeObserver" in window){
  new ResizeObserver(layoutSVG).observe($("walkWorld"));
}

if("IntersectionObserver" in window){
  new IntersectionObserver(entries=>{
    svgVisible=entries[0].isIntersecting;
    if(svgVisible) svgDirty=true;
  },{rootMargin:"120px"}).observe($("walkWorld"));
}

put("daysNumber","countdown.placeholder");
put("countdownNote","countdown.beforeNote");
updateDay(true);
coupleState();
drawCouple(0);
scheduleDay();

/* ==========================================================
   音樂
   唯一入口：右上角音樂掣。
   ========================================================== */
let audioContext;
let master;
let audioElement;

let musicPlaying=false;
let audioBusy=false;
let audioToken=0;

let musicTimer;
let noteIndex=0;
let nextNote=0;

const voices=new Set();
const volume=clamp(numeric(C.musicVolume,.22));

const melody=[
  72,76,79,76,74,77,81,77,
  71,74,79,74,72,76,79,84,
  81,79,76,74,72,76,74,67,
  69,72,76,72,67,71,74,71
];

const bass=[48,53,55,48,57,53,50,55];

function musicUI(){
  const button=$("musicButton");

  put("musicButton",musicPlaying?"controls.musicStop":"controls.musicPlay");

  const label=copy(
    musicPlaying?"controls.musicOnLabel":"controls.musicOffLabel"
  );

  button.setAttribute("aria-label",label);
  button.title=label;
  button.classList.toggle("is-playing",musicPlaying);
}

function tone(midi,when,duration,strength){
  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();

  osc.type="sine";
  osc.frequency.value=440*Math.pow(2,(midi-69)/12);

  gain.gain.setValueAtTime(0,when);
  gain.gain.linearRampToValueAtTime(strength,when+.025);
  gain.gain.exponentialRampToValueAtTime(.0001,when+duration);

  osc.connect(gain);
  gain.connect(master);
  voices.add(osc);

  osc.onended=()=>{
    voices.delete(osc);
    osc.disconnect();
    gain.disconnect();
  };

  osc.start(when);
  osc.stop(when+duration+.05);
}

function scheduleMusic(){
  if(!musicPlaying || audioContext?.state!=="running") return;

  if(nextNote<audioContext.currentTime){
    nextNote=audioContext.currentTime+.04;
  }

  while(nextNote<audioContext.currentTime+.3){
    tone(melody[noteIndex%melody.length],nextNote,1.6,.23);

    if(noteIndex%4===0){
      const r=bass[Math.floor(noteIndex/4)%bass.length];
      tone(r,nextNote,2.7,.16);
      tone(r+7,nextNote,2.5,.065);
    }

    noteIndex++;
    nextNote+=.49;
  }
}

function stopMusic(){
  audioToken++;
  musicPlaying=false;
  clearInterval(musicTimer);
  audioElement?.pause();

  for(const osc of voices){
    try{osc.stop()}catch{}
  }

  voices.clear();

  if(audioContext?.state==="running"){
    audioContext.suspend().catch(()=>{});
  }

  musicUI();
}

async function startMusic(){
  if(musicPlaying || audioBusy || document.hidden) return;

  audioBusy=true;
  const token=++audioToken;
  $("musicButton").disabled=true;

  try{
    if(String(C.musicUrl||"").trim()){
      if(!audioElement){
        audioElement=new Audio(C.musicUrl);
        audioElement.loop=true;
        audioElement.volume=volume;

        audioElement.addEventListener("error",()=>{
          stopMusic();
          toast("messages.musicFileFailed");
        });
      }

      await audioElement.play();
    }else{
      const API=window.AudioContext||window.webkitAudioContext;
      if(!API) throw new Error("Web Audio unavailable");

      if(!audioContext){
        audioContext=new API();
        master=audioContext.createGain();
        master.gain.value=volume;
        master.connect(audioContext.destination);
      }

      await audioContext.resume();

      if(audioContext.state!=="running"){
        throw new Error("Audio blocked");
      }
    }

    if(token!==audioToken || document.hidden){
      audioElement?.pause();

      if(audioContext?.state==="running"){
        await audioContext.suspend();
      }

      return;
    }

    musicPlaying=true;

    if(!audioElement){
      nextNote=audioContext.currentTime+.04;
      scheduleMusic();
      clearInterval(musicTimer);
      musicTimer=setInterval(scheduleMusic,120);
    }
  }catch(error){
    console.warn(error);
    musicPlaying=false;

    if(token===audioToken){
      toast("messages.musicBlocked");
    }
  }finally{
    audioBusy=false;
    $("musicButton").disabled=false;
    musicUI();
  }
}

musicUI();
$("musicButton").hidden=false;

$("musicButton").addEventListener("click",()=>{
  if(musicPlaying){
    stopMusic();
  }else{
    startMusic().catch(error=>console.warn("Music error:",error));
  }
});

/* ==========================================================
   合照及擦霧（已確認，未改）
   ========================================================== */
const intro=$("intro");
const fog=$("fogCanvas");
const photo=$("couplePhoto");

let pointerId=null;
let previousPoint=null;
let lastSample=0;
let fogContext=null;

photo.alt=format(C.photoAlt);
photo.style.objectPosition=C.photoPosition||"50% 50%";

photo.addEventListener("load",()=>{
  photo.hidden=false;
  $("photoFallback").hidden=true;
});

photo.addEventListener("error",()=>{
  photo.hidden=true;
  $("photoFallback").hidden=false;
  console.warn("Photo loading failed; showing fallback card.");
});

if(String(C.photoUrl||"").trim()){
  photo.src=C.photoUrl;
}

function showRevealMessage(moveFocus=false){
  if(requested || entered) return;

  $("revealMessage").hidden=false;
  $("enterButton").hidden=false;
  put("revealAnnouncement","intro.announcement");

  $("revealMessage").scrollIntoView({
    block:"nearest",
    behavior:reduced.matches?"instant":"smooth"
  });

  if(moveFocus){
    $("enterButton").focus({preventScroll:true});
  }
}

function revealPhoto(fromButton=false){
  if(revealed || requested || entered) return;

  revealed=true;
  pointerId=null;
  previousPoint=null;

  startEntranceImage();

  intro.classList.add("revealed");
  put("scratchHelp","intro.helpRevealed");

  const focusWasOnReveal=document.activeElement===$("revealButton");

  $("revealButton").hidden=true;
  $("enterButton").hidden=true;

  clearTimeout(revealTimer);

  revealTimer=setTimeout(()=>{
    if(!document.hidden){
      showRevealMessage(fromButton || focusWasOnReveal);
    }
  },reduced.matches?0:1000);
}

$("revealButton").addEventListener("click",()=>revealPhoto(true));

try{
  fogContext=fog.getContext("2d",{willReadFrequently:true});
  if(!fogContext) throw new Error("Canvas unavailable");

  const ctx=fogContext;

  const bg=ctx.createLinearGradient(0,0,600,750);
  bg.addColorStop(0,"#f3ece0");
  bg.addColorStop(.5,"#faf6ee");
  bg.addColorStop(1,"#e8eee9");

  ctx.fillStyle=bg;
  ctx.fillRect(0,0,600,750);

  for(let i=0;i<35;i++){
    const x=(Math.sin(i*7.19)+1)*300;
    const y=(Math.cos(i*4.73)+1)*375;
    const r=80+(i%5)*25;
    const gradient=ctx.createRadialGradient(x,y,0,x,y,r);

    gradient.addColorStop(0,"rgba(255,253,247,.55)");
    gradient.addColorStop(1,"rgba(255,253,247,0)");

    ctx.fillStyle=gradient;
    ctx.fillRect(x-r,y-r,r*2,r*2);
  }

  const tints=[
    [80,110,170,"rgba(169,200,211,.20)"],
    [520,150,150,"rgba(191,209,197,.18)"],
    [500,650,180,"rgba(217,179,168,.14)"]
  ];

  for(const [x,y,r,color] of tints){
    const gradient=ctx.createRadialGradient(x,y,0,x,y,r);
    gradient.addColorStop(0,color);
    gradient.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=gradient;
    ctx.fillRect(x-r,y-r,r*2,r*2);
  }

  let grain=7;
  for(let i=0;i<1600;i++){
    grain=(grain*16807)%2147483647;
    const x=grain%600;
    grain=(grain*16807)%2147483647;
    const y=grain%750;

    ctx.fillStyle=i%2
      ?"rgba(120,108,88,.05)"
      :"rgba(255,255,255,.35)";
    ctx.fillRect(x,y,1.3,1.3);
  }
}catch(error){
  console.warn(error);
  fog.hidden=true;
  $("fogHint").hidden=true;
  put("scratchHelp","intro.helpUnavailable");
}

const sampleCanvas=document.createElement("canvas");
sampleCanvas.width=60;
sampleCanvas.height=75;

let sampleContext=null;
try{
  sampleContext=sampleCanvas.getContext("2d",{willReadFrequently:true});
}catch(error){
  console.warn("Scratch sampler unavailable:",error);
}

function localPoint(event){
  const rect=fog.getBoundingClientRect();

  return {
    x:clamp((event.clientX-rect.left)/rect.width)*600,
    y:clamp((event.clientY-rect.top)/rect.height)*750
  };
}

function stamp(x,y){
  const radius=58;
  const ctx=fogContext;
  const brush=ctx.createRadialGradient(x,y,radius*.48,x,y,radius);

  brush.addColorStop(0,"rgba(0,0,0,1)");
  brush.addColorStop(1,"rgba(0,0,0,0)");

  ctx.globalCompositeOperation="destination-out";
  ctx.fillStyle=brush;
  ctx.fillRect(x-radius,y-radius,radius*2,radius*2);
}

function checkCoverage(force=false){
  if(!sampleContext || revealed) return;

  const now=performance.now();
  if(!force && now-lastSample<140) return;
  lastSample=now;

  try{
    sampleContext.clearRect(0,0,60,75);
    sampleContext.drawImage(fog,0,0,60,75);

    const pixels=sampleContext.getImageData(0,0,60,75).data;
    let alpha=0;

    for(let i=3;i<pixels.length;i+=4){
      alpha+=pixels[i];
    }

    const erased=1-alpha/(60*75*255);
    const threshold=clamp(numeric(C.revealThreshold,.35),.1,.8);

    if(erased>=threshold) revealPhoto();
  }catch(error){
    console.warn("Coverage sampling failed:",error);
  }
}

function eraseTo(point){
  if(!fogContext || revealed) return;

  intro.classList.add("scratching");

  const from=previousPoint||point;
  const steps=Math.max(
    1,
    Math.ceil(Math.hypot(point.x-from.x,point.y-from.y)/12)
  );

  for(let i=1;i<=steps;i++){
    const p=i/steps;
    stamp(
      from.x+(point.x-from.x)*p,
      from.y+(point.y-from.y)*p
    );
  }

  previousPoint=point;
  checkCoverage();
}

fog.addEventListener("pointerdown",event=>{
  if(
    revealed || requested || !event.isPrimary ||
    event.button!==0 || !fogContext
  ) return;

  pointerId=event.pointerId;
  previousPoint=null;

  try{fog.setPointerCapture(event.pointerId)}catch{}
  eraseTo(localPoint(event));
});

fog.addEventListener("pointermove",event=>{
  if(event.pointerId===pointerId && !revealed){
    eraseTo(localPoint(event));
  }
});

function endScratch(event){
  if(event.pointerId!==pointerId) return;

  pointerId=null;
  previousPoint=null;
  checkCoverage(true);
}

fog.addEventListener("pointerup",endScratch);
fog.addEventListener("pointercancel",endScratch);
fog.addEventListener("lostpointercapture",endScratch);

/* ==========================================================
   動畫控制
   ========================================================== */
function motionUI(){
  put("motionButton",paused?"controls.play":"controls.pause");
  $("motionButton").setAttribute("aria-pressed",String(paused));
  document.body.classList.toggle("motion-paused",paused);
}

motionUI();
$("motionButton").hidden=false;
syncTopbarHeight();

$("motionButton").addEventListener("click",()=>{
  paused=!paused;
  motionUI();
  svgDirty=true;
  requestEntranceUpdate();
});

function reducedChange(event){
  if(event.matches) paused=true;
  applyStaticClass();
  motionUI();
  svgDirty=true;
  measureEntrance();
  requestEntranceUpdate();
}

if(reduced.addEventListener){
  reduced.addEventListener("change",reducedChange);
}else{
  reduced.addListener(reducedChange);
}

/* ==========================================================
   流程：合照 → 手繪教堂入口（已確認，未改）
   ========================================================== */
function instantMotion(){
  return reduced.matches || paused;
}

function hideIntro(){
  intro.hidden=true;
  intro.inert=true;
}

function unlockPage(){
  startEntranceImage();
  document.body.classList.remove("waiting");
  document.body.classList.add("entered");
  $("mainContent").inert=false;
  entrance.classList.add("is-shown");
  setTimeout(()=>entrance.classList.add("cards-ready"),1900);
  measureEntrance();
  requestEntranceUpdate();
}

function focusInvitation(){
  $("countdownHeading").scrollIntoView({
    behavior:"instant",
    block:"start"
  });
  $("countdownHeading").focus({preventScroll:true});
}

function enterChapel(){
  if(!revealed || requested || entered) return;

  requested=true;
  leaving=true;
  clearTimeout(revealTimer);
  $("enterButton").disabled=true;

  window.scrollTo({top:0,left:0,behavior:"instant"});

  unlockPage();
  queueInterior();
  intro.inert=true;
  intro.classList.add("leaving");

  transitionTimer=setTimeout(()=>{
    leaving=false;
    entered=true;
    hideIntro();
    $("entranceHeading").focus({preventScroll:true});
  },instantMotion()?0:700);
}

function skipAll(){
  clearTimeout(revealTimer);
  clearTimeout(transitionTimer);

  requested=true;
  leaving=false;
  entered=true;

  unlockPage();
  hideIntro();
  focusInvitation();
}

$("enterButton").addEventListener("click",enterChapel);
$("skipButton").addEventListener("click",skipAll);
$("entranceSkip").addEventListener("click",focusInvitation);
$("interiorSkip").addEventListener("click",focusInvitation);

addEventListener("resize",()=>{
  layoutSVG();
});

$("mainContent").inert=true;
intro.hidden=false;
document.body.classList.add("waiting");
window.scrollTo({top:0,left:0,behavior:"instant"});

/* ==========================================================
   動畫循環（只負責倒數區 SVG 人物）
   ========================================================== */
function animate(now){
  if(document.hidden) return;

  const interval=mobileQuery.matches?1000/30:1000/60;

  if(lastFrame && now-lastFrame<interval-1){
    frame=requestAnimationFrame(animate);
    return;
  }

  const dt=lastFrame?Math.min((now-lastFrame)/1000,.07):0;
  lastFrame=now;

  if(svgVisible && (!paused || svgDirty)){
    if(!paused) animationTime+=dt;
    drawCouple(animationTime);
    svgDirty=false;
  }

  frame=requestAnimationFrame(animate);
}

function restartFrame(){
  cancelAnimationFrame(frame);
  lastFrame=0;

  if(!document.hidden){
    frame=requestAnimationFrame(animate);
  }
}

document.addEventListener("visibilitychange",()=>{
  cancelAnimationFrame(frame);
  clearTimeout(dayTimer);

  if(document.hidden){
    stopMusic();
    clearTimeout(revealTimer);
  }else{
    updateDay(true);
    scheduleDay();
    svgDirty=true;
    restartFrame();
    requestEntranceUpdate();

    if(revealed && !requested && !entered && $("revealMessage").hidden){
      showRevealMessage(false);
    }
  }
});

addEventListener("pageshow",()=>{
  updateDay(true);
  scheduleDay();
  restartFrame();
  measureEntrance();
  requestEntranceUpdate();
});

addEventListener("pagehide",()=>{
  stopMusic();
  cancelAnimationFrame(frame);
  clearTimeout(dayTimer);
});

restartFrame();

})();

<html lang="zh-HK">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#f7f3e9">
<meta id="pageDescription" name="description" content="">
<title></title>

<script>
/* ==========================================================
   ★★★ 主要修改區：平時只需要改呢一區 ★★★

   1. 文字放在雙引號 "..." 裏面。
   2. 換行用 \n，唔需要寫 HTML。
   3. 段落 / 流程可以在陣列內新增或刪除。
   4. 以下變數會自動代入：
      {names}              新人名字
      {initials}           名字縮寫
      {guestName}          賓客稱呼
      {dateLong}           中文日期
      {dateDot}            點號日期
      {dateEnglish}        英文日期
      {days}               剩餘日數
      {ceremonyTime}       行禮時間
      {ceremonySchedule}   行禮流程時間或「時間待定」
      {meetingTime}        集合時間
      {chapel}             教堂名字
      {location}           酒店名字

   注意：
   請勿在文字中直接貼 HTML 標籤。
   引號內需要雙引號時，請寫成 \"。
   ========================================================== */

window.INVITE = {
  /* ---------- A. 基本資料 ---------- */
  names: "新郎名字 & 新娘名字",
  initials: "A & B",
  guestName: "親愛的你",

  weddingDate: "2027-03-30",
  journeyStartDate: "2026-03-30",

  // 日本行禮時間；未定留空，格式例如 "14:00"。
  ceremonyTime: "",
  meetingTime: "集合時間待定",

  chapel: "Monterey Lumer Chapel",
  location: "Hotel Monterey Okinawa Spa & Resort",

  mapUrl: "https://www.google.com/maps/search/?api=1&query=Monterey+Lumer+Chapel+Okinawa",
  contactUrl: "",

  /* ---------- B. 相片、字體、音樂 ---------- */
  photoUrl: "images/couple.jpg",
  photoPosition: "50% 50%",
  photoAlt: "我們的合照",

  // 下載繁體字體檔後放入此位置，並保留原授權及版權資料。
  fontUrl: "fonts/MaokenAssortedSans-TC.ttf",

  // 留空使用內置合成音樂。
  musicUrl: "",
  musicVolume: 0.22,

  /* ---------- C. 互動設定 ---------- */
  revealThreshold: 0.35,

  // 合照及揭曉文字出現後，停留幾多秒先自動入教堂。
  // 想快啲可改為 1，想睇耐啲可改為 3。
  autoEnterDelaySeconds: 2,

  entranceSeconds: 2.5,
  sceneWaitSeconds: 12,

  /* ---------- D. 網頁標題及簡介 ---------- */
  page: {
    title: "一步一步，走向你｜沖繩婚禮請帖",
    description: "{dateLong}，一步一步，走向你。沖繩婚禮請帖。"
  },

  /* ---------- E. 日期顯示格式 ---------- */
  dates: {
    long: "{year} 年 {month} 月 {day} 日",
    dot: "{year}.{month2}.{day2}",
    english: "{day2} {monthEnglish} {year} · OKINAWA",
    months: [
      "JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE",
      "JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"
    ],
    invalidDisplay: "日期待確認"
  },

  /* ---------- F. 右上角控制 ---------- */
  controls: {
    pause: "暫停動畫",
    play: "播放動畫",
    musicOn: "音樂：開 ♫",
    musicOff: "音樂：關",
    musicEnableLabel: "開啟音樂",
    musicDisableLabel: "關閉音樂"
  },

  /* ---------- G. 捽霧合照開場 ---------- */
  intro: {
    eyebrow: "A LITTLE HAPPINESS, JUST FOR YOU",
    heading: "有一份小小的幸福，\n想先給你看。",

    fogSymbol: "♡",
    fogTitle: "輕輕捽開薄霧",
    fogSubtitle: "搵到我哋",
    help: "用手指輕輕捽開，或者按「直接揭曉」♡",
    helpRevealed: "搵到我哋喇 ♡",
    helpUnavailable: "按「直接揭曉」，打開我哋嘅小小心意。",

    // 相片載入失敗時顯示名字卡。
    fallbackSymbol: "♡",
    fallbackNames: "{names}",
    fallbackLine: "由兩個人，走到我們。",
    photoCaption: "{dateDot}",

    revealHeading: "由兩個人，走到我們。\n下一步，想有你見證。",
    revealButton: "直接揭曉 ♡",
    enterButton: "一齊走入教堂 →",
    skipButton: "直接閱讀請帖",

    announcement: "合照已揭曉，即將帶你走入教堂。",
  },

  /* ---------- H. 載入及提示文字 ---------- */
  messages: {
    sceneLoading: "教堂準備中；你可以先慢慢睇相。",
    sceneSlow: "教堂載入較慢；可先欣賞合照，或直接閱讀請帖。",
    sceneWaiting: "正準備教堂；亦可以直接閱讀請帖。",
    sceneReady: "教堂已準備好，等你一齊入嚟 ♡",
    sceneFailed: "教堂暫時未能載入；合照、Q 版人物及請帖仍可使用。",
    sceneLost: "3D 暫時中斷；合照、Q 版人物及請帖仍可使用。",

    musicFileFailed: "音樂未能載入，請檢查音樂檔案位置。",
    musicBlocked: "音樂未能播放，可再按右上角音樂掣。",
    previewPaused: "動畫目前已暫停；按右上角「播放動畫」觀看牽手效果。",

    dateHeading: "請檢查日期設定。",
    dateFormat: "日期必須使用 YYYY-MM-DD。",
    dateInvalid: "日期不存在。",
    dateOrder: "旅程開始日期必須早於婚禮日期。",
    timeInvalid: "行禮時間格式有誤，請使用 HH:MM，例如 14:00。"
  },

  /* ---------- I. 入教堂及文字卡 ---------- */
  church: {
    regionLabel: "教堂導覽",
    travel: "沿著樓梯，走近我們的約定。",
    travelSkip: "略過導覽，閱讀請帖",
    scrollHint: "向下捲動，走進教堂 ↓",

    first: {
      eyebrow: "THROUGH THE DOOR",
      heading: "推開門，\n就是海與光。",
      paragraph: "把城市嘅忙碌留低，跟住三月嘅海風，慢慢行入嚟。"
    },
    second: {
      eyebrow: "WITH YOU, BY THE SEA",
      heading: "這條路，\n多謝有你同行。",
      paragraph: "{dateLong}，邀請你喺沖繩，見證我哋交換承諾。"
    }
  },

  /* ---------- J. 公仔、倒數及相遇 ---------- */
  countdown: {
    eyebrow: "EVERY DAY, CLOSER TO EACH OTHER",
    heading: "餘下的每一天，\n都在走向你。",
    intro: "你行近一步，我亦行近一步。每一天，都更接近彼此。",

    leftLabel: "我，走向你",
    rightLabel: "你，亦走向我",

    waitingHeading: "仲有 {days} 日，我們在中間相遇。",
    waitingNote: "兩人每日各自近一步；同一日位置固定。",
    arrivedHeading: "終於，我們走到彼此身邊。",
    arrivedNote: "往後每一步，都一齊行。",

    counterLabel: "距離婚禮的日數",
    dayUnit: "日 DAYS",
    placeholder: "—",
    beforeNote: "以日本當地日期計算；唔顯示時、分、秒。",
    afterNote: "婚禮日期已到；往後的日子，繼續並肩同行。",
    arrivalMessage: "約定的日子已到，往後每一步，都一齊行。",
    arrivalDate: "{dateDot}",

    previewButton: "預覽相遇動畫 ♡",
    returnButton: "返回真實倒數",
    previewBadge: "相遇動畫預覽 · 真實倒數不變",

    svgTitle: "我們，一起走近彼此",
    svgWaiting: "距離婚禮還有 {days} 日，Q 版新郎新娘由左右兩邊走近彼此。",
    svgArrived: "Q 版新郎新娘在中央牽手，歪頭靠近，心心浮起。",
    svgInvalid: "Q 版新郎新娘；婚禮倒數日期有待確認。"
  },

  /* ---------- K. 感謝信 ---------- */
  letter: {
    eyebrow: "A LITTLE NOTE FOR YOU",
    heading: "多謝你，\n為我們遠道而來。",
    greeting: "{guestName}：",

    // 每一項係一段，可以加減。
    paragraphs: [
      "知道你會嚟，我哋已經開始期待嗰一日。",
      "{dateLong}，我哋會喺沖繩嘅海邊，交換承諾，展開人生下一段旅程。而你，會係呢個重要時刻入面，最珍貴嘅一部分。",
      "多謝你特登騰出時間，帶住祝福飛到我哋身邊。到時唔使急，慢慢感受海風、陽光，同沖繩嘅溫柔。我哋喺教堂見。"
    ],
    signature: "{names}"
  },

  /* ---------- L. 婚禮資料 ---------- */
  details: {
    eyebrow: "THE CEREMONY",
    heading: "把這一天，\n留給海與我們。",

    dateLabel: "DATE / 良日",
    dateValue: "{dateLong}",
    dateNote: "日本當地日期",

    timeLabel: "TIME / 約定",
    timeKnown: "{ceremonyTime} 開始行禮 · 日本時間",
    timeUnknown: "行禮時間待定",
    meeting: "{meetingTime}",

    venueLabel: "VENUE / 場所",
    venueValue: "{chapel}",
    venueNote: "{location}",

    mapButton: "查看教堂位置 ↗",
    contactButton: "有事搵我哋 ↗"
  },

  /* ---------- M. 出發小叮嚀 ---------- */
  reminders: {
    eyebrow: "BEFORE YOU ARRIVE",
    heading: "出發之前，小小叮嚀。",
    paragraphs: [
      "海邊可能有風，記得帶件薄外套。穿你覺得舒服又好看嘅衣服就好。",
      "交通、接送、集合位置及詳細時間，落實後我哋會再通知你。",
      "你嘅出席我哋已經記低，唔需要再回覆確認。只需要帶住自己，同一個好心情。"
    ]
  },

  /* ---------- N. 流程 ---------- */
  schedule: {
    ceremonyKnown: "{ceremonyTime} JST",
    ceremonyUnknown: "時間待定",

    // 可以新增更多流程項目。
    events: [
      {
        time: "時間待定",
        heading: "相聚 · 集合",
        paragraph: "一齊迎接呢個特別日子。"
      },
      {
        time: "{ceremonySchedule}",
        heading: "見證 · 行禮",
        paragraph: "海與光之間，交換承諾。"
      },
      {
        time: "時間待定",
        heading: "留念 · 合照",
        paragraph: "留下笑容、擁抱與祝福。"
      }
    ]
  },

  /* ---------- O. 頁尾 ---------- */
  footer: {
    japanese: "大切なあなたと、大切な一日を。",
    heading: "沖繩見。",
    paragraph: "有你同行，呢段回憶先至完整。",
    names: "{names}",
    date: "{dateEnglish}",

    // 此段係網站內容說明，唔係字體授權文件。
    // 可以修改；但唔好因此刪除 fonts 內原作者的授權資料。
    disclaimer: "教堂為 3D 風格示意，並非官方模型或精確建築重建。\nQ 版人物為本頁繪製的 SVG 插畫，並非真人肖像。\n倒數以日本日期及裝置時鐘計算；正式婚禮安排以通知為準。"
  }
};

/* ================= 主要修改區完 ================= */
document.title = window.INVITE.page.title;
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500&amp;family=Noto+Serif+JP:wght@400&amp;display=swap">

<style>
:root{
  --ink:#40564f;
  --muted:#79857a;
  --paper:#f7f4eb;
  --line:#bac6af66;
  --serif:"Noto Serif TC","Songti TC",serif;
  --cute:"Maoken Wedding","Noto Serif TC",serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:400 14px/2 var(--serif);
  letter-spacing:.025em;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body.waiting{overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
a{color:inherit}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #a27856;outline-offset:5px;
}
::selection{background:#ead8c6}
h1,h2,h3,p{overflow-wrap:anywhere}
h1,h2,h3,.cute{
  font-family:var(--cute);font-weight:400;font-synthesis:none;
}
[data-copy],.copy{
  white-space:pre-line;
}
.eyebrow{font:10px/1.9 Georgia,serif;letter-spacing:.2em}
.small{font-size:12px;line-height:2.2;color:var(--muted)}
.center{text-align:center}

#world{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(#95c9db,#e5eee5 70%,#dedcc7);
}
#world canvas{display:block;width:100%;height:100%}
#world::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,#faf5e777,transparent 30%);
}
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:40;
  padding:max(16px,env(safe-area-inset-top)) 5% 12px;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;pointer-events:none;
}
.brand{font:23px Georgia,serif;letter-spacing:.08em;text-shadow:0 1px 15px white}
.top-buttons{display:flex;gap:8px;pointer-events:auto}
.control{
  min-height:44px;min-width:44px;padding:9px 13px;
  border:1px solid #fff;border-radius:30px;
  background:#fffaf0ed;font-size:11px;
  box-shadow:0 3px 16px #465b5010;
}
.primary{
  display:inline-flex;justify-content:center;align-items:center;
  min-height:48px;padding:11px 25px;
  border:1px solid #b1baa1;border-radius:28px;
  background:#f8fbef;color:#4b6354;
  box-shadow:0 6px 20px #50664b12;
  font:400 20px/1.6 var(--cute);
}
.text-button{
  min-height:44px;padding:9px 13px;
  border:0;background:transparent;
  font-size:11px;color:#71816d;
  text-decoration:underline;text-underline-offset:5px;
}

/* 合照開場 */
#intro{
  position:fixed;inset:0;z-index:35;
  overflow-y:auto;overscroll-behavior:contain;
  background:
    radial-gradient(ellipse at 20% 15%,#fff8ec,transparent 60%),
    radial-gradient(ellipse at 90% 80%,#efdede77,transparent 50%),
    #f4f0e6;
  transition:opacity .45s ease;
}
#intro.leaving{opacity:0;pointer-events:none}
.intro-inner{
  position:relative;width:min(100%,760px);min-height:100%;
  margin:auto;padding:85px 22px max(24px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;
}
.intro-heading{margin:9px 0 18px;font-size:clamp(23px,4.5vw,33px);line-height:1.6}
.photo-card{
  position:relative;width:min(350px,78vw,43svh);
  padding:10px 10px 14px;background:#fffdf6;
  border:1px solid #fff;border-radius:22px;
  box-shadow:0 18px 55px -20px #75685955;
}
.photo-card::before{
  content:"";position:absolute;width:86px;height:25px;
  left:calc(50% - 43px);top:-11px;z-index:5;
  background:#d8d9ba99;transform:rotate(-4deg);pointer-events:none;
}
.photo-window{
  position:relative;width:100%;aspect-ratio:4/5;
  overflow:hidden;border-radius:15px;background:#eadfce;
  isolation:isolate;
}
.photo-fallback{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:22px;
  background:
    radial-gradient(circle at 30% 20%,#fffbed,transparent 65%),
    linear-gradient(150deg,#e1e9dc,#f1d9d4);
}
.photo-fallback .heart{font-size:62px;color:#c98e92;line-height:1.5}
.photo-fallback .names{font:22px/1.8 var(--cute)}
.photo-fallback .small{font-size:10px}
#couplePhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#fogCanvas{
  position:absolute;inset:0;width:100%;height:100%;z-index:2;
  touch-action:none;cursor:crosshair;transition:opacity 1s ease;
}
#fogHint{
  position:absolute;inset:0;z-index:3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#8d9684;pointer-events:none;transition:opacity .3s ease;
  font:20px/1.8 var(--cute);text-shadow:0 1px 4px white;
}
#fogHint .symbol{font:38px/1.7 Georgia,serif}
#fogHint small{font-size:12px}
#intro.scratching #fogHint,#intro.revealed #fogHint{opacity:0}
#intro.revealed #fogCanvas{opacity:0;pointer-events:none}
.photo-caption{padding-top:9px;font:11px/1.8 Georgia,serif;letter-spacing:.15em}
#scratchHelp{margin:14px 0 0}
#revealMessage{width:100%;margin-top:15px;animation:messageIn .65s ease both}
#revealMessage h2{font-size:clamp(23px,4vw,29px);line-height:1.65;margin:0 0 13px}
#loadStatus{display:block;font-size:10px;color:#7e877b;margin:8px 0 0}
.intro-links{display:flex;justify-content:center;gap:5px;flex-wrap:wrap}
@keyframes messageIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
.petals{position:absolute;inset:-35px;pointer-events:none}
.petal{
  position:absolute;width:13px;height:20px;
  background:linear-gradient(130deg,#fff1ec,#e6b8bd);
  border-radius:90% 8% 80% 25%;opacity:.75;
  animation:petalFloat 5s ease-in-out infinite alternate;
  transition:opacity 1.1s ease,translate 1.1s ease;
}
.petal:nth-child(1){left:-5%;top:20%;rotate:35deg}
.petal:nth-child(2){right:-4%;top:10%;rotate:-30deg;animation-delay:-2s}
.petal:nth-child(3){left:2%;bottom:14%;rotate:75deg;animation-delay:-3s}
.petal:nth-child(4){right:-6%;bottom:25%;rotate:-65deg;animation-delay:-1s}
.petal:nth-child(5){left:20%;top:-5%;rotate:10deg;animation-delay:-4s}
.petal:nth-child(6){right:20%;bottom:-4%;rotate:45deg;animation-delay:-2.5s}
#intro.revealed .petal:nth-child(odd){translate:-45px 35px;opacity:0}
#intro.revealed .petal:nth-child(even){translate:45px 35px;opacity:0}
@keyframes petalFloat{
  from{transform:translateY(-7px) rotate(-10deg)}
  to{transform:translateY(9px) rotate(15deg)}
}
body.motion-paused .petal{animation-play-state:paused}

/* 教堂及請帖 */
main{position:relative;z-index:2}
#experience{position:relative;height:100vh;height:100svh;pointer-events:none}
body.entered #experience{height:330vh;height:330svh}
.scene-note{
  position:absolute;width:min(380px,calc(100% - 44px));padding:27px;
  background:#fffdf2ed;border:1px solid white;
  border-radius:22px 22px 22px 4px;
  box-shadow:0 15px 45px #39584b17;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  pointer-events:auto;
}
.scene-note h2{font-size:33px;line-height:1.65;margin:12px 0}
.scene-note p{font-size:13px;line-height:2.2;color:var(--muted)}
.note-one{top:max(105px,20svh);left:8%}
.note-two{top:235svh;right:8%}
#travelPanel{
  position:fixed;z-index:38;left:18px;right:18px;
  bottom:max(24px,env(safe-area-inset-bottom));text-align:center;
}
#travelPanel p{margin:0;font:22px/1.8 var(--cute);text-shadow:0 1px 12px white,0 1px 3px white}
#travelPanel button{background:#fff9;border-radius:20px}
#scrollHint{
  position:fixed;z-index:20;right:5%;
  bottom:max(18px,env(safe-area-inset-bottom));
  padding:9px 14px;background:#fff9e9e8;border-radius:22px;
  font-size:11px;pointer-events:none;
}
.content{position:relative;padding:80px 24px 0;background:linear-gradient(#f6f3e9ed,#f7f4eb 350px)}
.container{max-width:980px;margin:auto}
.section-title{margin:14px 0 24px;font-size:clamp(30px,4.5vw,44px);line-height:1.7;letter-spacing:.045em}
.walk-card{
  margin-top:32px;overflow:hidden;
  border:1px solid #d7dac8;border-radius:95px 95px 22px 22px;
  background:
    radial-gradient(ellipse at 50% 35%,#fffdf2,transparent 65%),
    linear-gradient(#edf0e4,#f0e6d6);
  box-shadow:0 25px 45px -35px #53704d66;
}
#walkWorld{width:100%;overflow:hidden}
#coupleSvg{display:block;width:100%;height:auto}
.walk-labels{display:flex;justify-content:space-between;gap:15px;padding:0 9% 20px;font:17px/1.8 var(--cute);color:#8a947d}
.walk-caption{border-top:1px solid #c6cfbb77;padding:20px;text-align:center}
#journeyText{font:25px/1.8 var(--cute)}
.walk-caption p{font-size:11px;color:var(--muted);margin:8px 0}
.progress-track{width:min(430px,86%);height:4px;margin:15px auto;border-radius:10px;background:#dce0cc;overflow:hidden}
#journeyFill{width:0;height:100%;background:#b4a17e}
.preview-badge{display:inline-block;font-size:11px;background:#eddbcc;color:#987568;padding:4px 12px;border-radius:15px;margin-bottom:8px}
.day-counter{display:flex;justify-content:center;align-items:baseline;gap:12px;margin:24px 0 0}
.day-counter b{font:clamp(66px,10vw,90px)/1.4 Georgia,serif;color:#668b77;font-variant-numeric:tabular-nums}
.day-counter span{font-size:12px;color:var(--muted)}
.preview-button{min-height:44px;padding:10px 20px;border:1px solid #afbaa0;border-radius:24px;background:#fff8;font:17px/1.6 var(--cute)}
.paper{background:#fffdf5;border:1px solid #d9dbc966;border-radius:7px;padding:42px;box-shadow:0 20px 55px -40px #48655866}
.letter{margin:70px 0}
.letter p{font-size:14px;line-height:2.6;color:#758176}
.signature{text-align:right;font:26px/1.8 var(--cute);margin-top:30px}
.details{display:grid;grid-template-columns:1fr 1fr;gap:50px;padding:25px 0 65px}
.detail-row{padding:22px 0;border-bottom:1px solid var(--line)}
.detail-row small{display:block;color:#84907f;font-size:10px;letter-spacing:.12em;margin-bottom:8px}
.detail-row strong{font-size:20px;font-weight:400;line-height:1.8}
.detail-row p{font-size:12px;line-height:2;color:var(--muted);margin:7px 0 0}
.detail-row .venue{font:25px/1.6 Georgia,serif}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}
.pill{display:inline-flex;align-items:center;min-height:44px;padding:12px 18px;border:1px solid #a8b69b88;border-radius:22px;background:#fff8;text-decoration:none;font-size:12px}
.timeline{margin-top:28px;border-top:1px solid var(--line)}
.event{display:grid;grid-template-columns:90px 1fr;gap:12px;padding:22px 0;border-bottom:1px solid var(--line)}
.event time{font-size:12px;color:#7d907b}
.event h3{font-size:21px;margin:0 0 7px}
.event p{font-size:12px;color:var(--muted);margin:0}
footer{text-align:center;padding:65px 10px max(65px,env(safe-area-inset-bottom))}
footer h2{font-size:clamp(46px,7vw,70px);margin:20px 0}
.footer-name{font:27px/1.8 var(--cute);margin:25px 0 15px}
.jp{font:13px/2.2 "Noto Serif JP",var(--serif);color:#a08a73;letter-spacing:.08em}
.disclaimer{max-width:660px;margin:35px auto 0;font-size:10px;line-height:2;color:#8a9583}
#toast{
  position:fixed;z-index:70;left:50%;
  bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);
  width:max-content;max-width:90%;padding:12px 18px;
  border-radius:12px;background:#40564ff2;color:#fffaf0;font-size:12px;
}
body.no3d #world{background:linear-gradient(#cbe1df,#f3eddb)}
body.no3d #world canvas{display:none}
body.no3d.entered #experience{height:0}
body.no3d .scene-note{display:none}
@media(max-width:760px){
  .topbar{padding-left:18px;padding-right:18px}
  .control{font-size:10px;padding:9px 11px}
  .brand{font-size:21px}
  .intro-inner{padding-top:80px}
  .intro-heading{font-size:24px}
  .photo-card{width:min(330px,80vw,43svh)}
  .note-one{left:22px}.note-two{right:22px}
  .scene-note{padding:23px}.scene-note h2{font-size:29px}
  .content{padding:60px 20px 0}
  .walk-card{border-radius:65px 65px 20px 20px}
  .walk-labels{font-size:14px;padding-bottom:16px}
  #journeyText{font-size:21px}
  .paper{padding:28px 24px}
  .letter{margin:52px 0}.letter p{font-size:13px}
  .details{grid-template-columns:1fr;gap:30px}
}
@media(max-height:620px){
  .intro-inner{justify-content:flex-start}
  .photo-card{width:min(270px,70vw)}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}

function get(path){
  return path.split(".").reduce((value,key)=>value?.[key],C);
}
function format(value,extra={}){
  const values={...vars,...extra};
  return String(value??"").replace(/\{([A-Za-z0-9_]+)\}/g,(match,key)=>
    Object.prototype.hasOwnProperty.call(values,key)?String(values[key]??""):match
  );
}
function copy(path,extra={}){return format(get(path),extra)}
function put(id,path,extra={}){$(id).textContent=copy(path,extra)}

  }catch{$(id).hidden=true}
}

/* 日期解析 */
function parseDay(value){
  const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value));
  if(!match) throw new Error(copy("messages.dateFormat"));
  const [year,month,dateDay]=match.slice(1).map(Number);
  const date=new Date(0);
  date.setUTCFullYear(year,month-1,dateDay);
  date.setUTCHours(0,0,0,0);
  if(date.getUTCFullYear()!==year ||
     date.getUTCMonth()!==month-1 ||
     date.getUTCDate()!==dateDay){
    throw new Error(copy("messages.dateInvalid"));
  }
  return {index:Math.floor(date.getTime()/DAY),year,month,day:dateDay};
}

    monthEnglish:C.dates.months[wedding.month-1]

    const p=document.createElement("p");
    p.className=("copy "+className).trim();

    fragment.append(p);

}

function updateDay(force=false){
  if(!day.valid) return;
  const today=japanToday();
  if(!force&&today===day.cached) return;
  day.cached=today;
  day.remaining=Math.max(0,day.end-today);
  day.arrived=today>=day.end;
  day.progress=clamp((today-day.start)/(day.end-day.start));
  vars.days=day.remaining;
  if(day.arrived) preview=false;
  $("daysNumber").textContent=day.remaining;
  $("dayCounter").hidden=day.arrived;
  $("arrivalMessage").hidden=!day.arrived;
  $("previewButton").hidden=day.arrived;
  put("countdownNote",day.arrived?"countdown.afterNote":"countdown.beforeNote");
  coupleState();
}

  clearTimeout(dayTimer);
  if(document.hidden||!day.valid) return;
  const until=(japanToday()+1)*DAY-JST-Date.now();
  dayTimer=setTimeout(()=>{
    updateDay();
    scheduleDay();
  },Math.max(100,Math.min(60000,until+80)));
}
function drawCouple(t){

    tr("gMotion",`translate(0 ${-Math.abs(s)*3.3})`);
    tr("gLegL",`translate(-12 -29) rotate(${s*22})`);
    tr("gLegR",`translate(12 -29) rotate(${-s*22})`);
    tr("gArmL",`translate(-29 -77) rotate(${-s*18})`);
    tr("gArmR",`translate(29 -77) rotate(${s*18})`);
    tr("gHead",`rotate(${Math.sin(t*3.5)*1.2} 0 -90)`);
    tr("bMotion",`translate(0 ${-Math.abs(b)*2.8})`);
    tr("bLegL",`translate(-12 -20) rotate(${b*23})`);
    tr("bLegR",`translate(12 -20) rotate(${-b*23})`);
    tr("bArmR",`translate(25 -76) rotate(${b*14})`);
    tr("bArmL",`translate(-25 -76) rotate(${-b*5})`);
    tr("bVeil",`rotate(${Math.sin(t*2)*1.6} 0 -173)`);
    tr("bHead",`rotate(${Math.sin(t*3.5+.3)*1.2} 0 -90)`);
  }else{
    const cycle=(t%8)/8,phase=cycle*Math.PI*2;
    const lean=Math.pow(Math.sin(Math.PI*cycle),2);
    tr("togetherSway",`rotate(${Math.sin(phase)*1.6} 0 0)`);
    tr("agHead",`rotate(${lean*7} 0 -90)`);
    tr("abHead",`rotate(${lean*7} 0 -90)`);
    tr("abVeil",`rotate(${Math.sin(phase+.7)*1.5} 0 -173)`);
    tr("abArmL",`translate(-25 -76) rotate(${Math.sin(phase)*3})`);

      tr("heart"+i,`translate(${[0,-28,29][i]+Math.sin(p*Math.PI*2)*5} ${-170-p*62}) scale(${[.6,.4,.35][i]})`);

/* ==========================================================
   音樂
   ========================================================== */
let audioContext,master,audioElement;
let musicPlaying=false,audioBusy=false,audioToken=0;
let musicTimer,noteIndex=0,nextNote=0;
const voices=new Set();
const volume=clamp(numeric(C.musicVolume,.22));
const melody=[
  72,76,79,76,74,77,81,77,
  71,74,79,74,72,76,79,84,
  81,79,76,74,72,76,74,67,
  69,72,76,72,67,71,74,71
];
const bass=[48,53,55,48,57,53,50,55];
function musicUI(){
  put("musicButton",musicPlaying?"controls.musicOn":"controls.musicOff");
  $("musicButton").setAttribute("aria-pressed",String(musicPlaying));
  $("musicButton").setAttribute("aria-label",copy(
    musicPlaying?"controls.musicDisableLabel":"controls.musicEnableLabel"
  ));
}
function tone(midi,when,duration,strength){
  const osc=audioContext.createOscillator(),gain=audioContext.createGain();
  osc.type="sine";
  osc.frequency.value=440*Math.pow(2,(midi-69)/12);
  gain.gain.setValueAtTime(0,when);
  gain.gain.linearRampToValueAtTime(strength,when+.025);
  gain.gain.exponentialRampToValueAtTime(.0001,when+duration);
  osc.connect(gain);gain.connect(master);voices.add(osc);
  osc.onended=()=>{voices.delete(osc);osc.disconnect();gain.disconnect()};
  osc.start(when);osc.stop(when+duration+.05);
}
function scheduleMusic(){
  if(!musicPlaying||audioContext?.state!=="running") return;
  if(nextNote<audioContext.currentTime) nextNote=audioContext.currentTime+.04;
  while(nextNote<audioContext.currentTime+.3){
    tone(melody[noteIndex%melody.length],nextNote,1.6,.23);
    if(noteIndex%4===0){
      const root=bass[Math.floor(noteIndex/4)%bass.length];
      tone(root,nextNote,2.7,.16);tone(root+7,nextNote,2.5,.065);
    }
    noteIndex++;nextNote+=.49;
  }
}
function stopMusic(){
  audioToken++;musicPlaying=false;clearInterval(musicTimer);
  audioElement?.pause();
  for(const osc of voices){try{osc.stop()}catch{}}
  voices.clear();
  if(audioContext?.state==="running") audioContext.suspend().catch(()=>{});
  musicUI();
}
async function startMusic(){
  if(musicPlaying||audioBusy) return;
  audioBusy=true;
  const token=++audioToken;
  $("musicButton").disabled=true;
  try{
    if(String(C.musicUrl||"").trim()){
      if(!audioElement){
        audioElement=new Audio(C.musicUrl);
        audioElement.loop=true;audioElement.volume=volume;
        audioElement.addEventListener("error",()=>{
          stopMusic();toast("messages.musicFileFailed");
        });
      }
      await audioElement.play();
    }else{
      const API=window.AudioContext||window.webkitAudioContext;
      if(!API) throw new Error("Web Audio unavailable");
      if(!audioContext){
        audioContext=new API();
        master=audioContext.createGain();
        master.gain.value=volume;
        master.connect(audioContext.destination);
      }
      await audioContext.resume();
      if(audioContext.state!=="running") throw new Error("Audio blocked");
    }
    if(token!==audioToken||document.hidden){
      audioElement?.pause();
      if(audioContext?.state==="running") await audioContext.suspend();
      return;
    }
    musicPlaying=true;
    if(!audioElement){
      nextNote=audioContext.currentTime+.04;
      scheduleMusic();
      clearInterval(musicTimer);
      musicTimer=setInterval(scheduleMusic,120);
    }
  }catch(error){
    console.warn(error);musicPlaying=false;
    if(token===audioToken) toast("messages.musicBlocked");
  }finally{
    audioBusy=false;$("musicButton").disabled=false;musicUI();
  }
}
musicUI();
$("musicButton").hidden=false;
$("musicButton").addEventListener("click",()=>{
  if(musicPlaying) stopMusic();else void startMusic();
});

function revealPhoto(fromButton=false){
  if(revealed || requested || entered) return;

  revealed = true;
  pointerId = null;
  previousPoint = null;

  intro.classList.add("revealed");
  put("scratchHelp","intro.helpRevealed");

  $("enterButton").hidden = true;

  // 「直接揭曉」係使用者點擊，可在此嘗試啟動音樂。
  if(fromButton) void startMusic();

  clearTimeout(revealTimer);

  // 等薄霧淡出，再顯示揭曉文字。
  revealTimer = setTimeout(()=>{
    if(requested || entered) return;

    $("revealMessage").hidden = false;
    put("revealAnnouncement","intro.announcement");

    // 小螢幕確保合照下面嘅文字可以見到。
    $("revealMessage").scrollIntoView({
      block:"nearest",
      behavior:reduced.matches ? "instant" : "smooth"
    });

    // 停留指定秒數後，自動入教堂。
    const delay = clamp(
      numeric(C.autoEnterDelaySeconds,2),
      0,
      15
    ) * 1000;

    revealTimer = setTimeout(()=>{
      if(requested || entered) return;
      requestEntry();
    },delay);

  },reduced.matches ? 0 : 650);
}

$("revealButton").addEventListener("click",()=>revealPhoto(true));

try{
  fogContext=fog.getContext("2d",{willReadFrequently:true});
  if(!fogContext) throw new Error("Canvas unavailable");
  const ctx=fogContext;
  const bg=ctx.createLinearGradient(0,0,600,750);
  bg.addColorStop(0,"#f0f0e6");bg.addColorStop(.45,"#f8f4e9");bg.addColorStop(1,"#e2e9de");
  ctx.fillStyle=bg;ctx.fillRect(0,0,600,750);
  for(let i=0;i<35;i++){
    const x=(Math.sin(i*7.19)+1)*300,y=(Math.cos(i*4.73)+1)*375,r=80+(i%5)*25;
    const gradient=ctx.createRadialGradient(x,y,0,x,y,r);
    gradient.addColorStop(0,"rgba(255,255,251,.5)");
    gradient.addColorStop(1,"rgba(255,255,251,0)");
    ctx.fillStyle=gradient;ctx.fillRect(x-r,y-r,r*2,r*2);
  }
}catch(error){
  console.warn(error);fog.hidden=true;$("fogHint").hidden=true;
  put("scratchHelp","intro.helpUnavailable");
}
const sampleCanvas=document.createElement("canvas");
sampleCanvas.width=60;sampleCanvas.height=75;
const sampleContext=sampleCanvas.getContext("2d",{willReadFrequently:true});
function localPoint(event){
  const rect=fog.getBoundingClientRect();
  return {
    x:clamp((event.clientX-rect.left)/rect.width)*600,
    y:clamp((event.clientY-rect.top)/rect.height)*750
  };
}
function stamp(x,y){
  const radius=58,ctx=fogContext;
  const brush=ctx.createRadialGradient(x,y,radius*.48,x,y,radius);
  brush.addColorStop(0,"rgba(0,0,0,1)");
  brush.addColorStop(1,"rgba(0,0,0,0)");
  ctx.globalCompositeOperation="destination-out";
  ctx.fillStyle=brush;
  ctx.fillRect(x-radius,y-radius,radius*2,radius*2);
}
function checkCoverage(force=false){
  if(!sampleContext||revealed) return;
  const now=performance.now();
  if(!force&&now-lastSample<140) return;
  lastSample=now;
  try{
    sampleContext.clearRect(0,0,60,75);
    sampleContext.drawImage(fog,0,0,60,75);
    const pixels=sampleContext.getImageData(0,0,60,75).data;
    let alpha=0;
    for(let i=3;i<pixels.length;i+=4) alpha+=pixels[i];
    if(1-alpha/(60*75*255)>=clamp(numeric(C.revealThreshold,.35),.1,.8)) revealPhoto();
  }catch(error){console.warn("Coverage sampling failed:",error)}
}
function eraseTo(point){
  if(!fogContext||revealed) return;
  intro.classList.add("scratching");
  const from=previousPoint||point;
  const steps=Math.max(1,Math.ceil(Math.hypot(point.x-from.x,point.y-from.y)/12));
  for(let i=1;i<=steps;i++){
    const p=i/steps;
    stamp(from.x+(point.x-from.x)*p,from.y+(point.y-from.y)*p);
  }
  previousPoint=point;checkCoverage();
}
fog.addEventListener("pointerdown",event=>{
  if(revealed||requested||!event.isPrimary||event.button!==0||!fogContext) return;
  pointerId=event.pointerId;previousPoint=null;
  fog.setPointerCapture(event.pointerId);eraseTo(localPoint(event));
});
fog.addEventListener("pointermove",event=>{
  if(event.pointerId===pointerId&&!revealed) eraseTo(localPoint(event));
});
function endScratch(event){
  if(event.pointerId!==pointerId) return;
  pointerId=null;previousPoint=null;checkCoverage(true);
}
fog.addEventListener("pointerup",endScratch);
fog.addEventListener("pointercancel",endScratch);
// 使用者擦開合照後放手，嘗試啟動音樂。
// 獨立監聽，唔受 revealPhoto 重設 pointerId 影響。
fog.addEventListener("pointerup",()=>{
  if(revealed && !entered){
    void startMusic();
  }
});

function motionUI(){
  put("motionButton",paused?"controls.play":"controls.pause");
  $("motionButton").setAttribute("aria-pressed",String(paused));
  document.body.classList.toggle("motion-paused",paused);
}
motionUI();$("motionButton").hidden=false;
$("motionButton").addEventListener("click",()=>{
  paused=!paused;motionUI();svgDirty=true;
});
reduced.addEventListener?.("change",event=>{
  if(event.matches){
    paused=true;
    if(requested&&!entered&&sceneAPI&&sceneState==="ready") finishEntrance();
  }
  motionUI();svgDirty=true;
});
function hideIntro(){intro.hidden=true;intro.inert=true}
function updateScroll(){
  const visible=$("experience").getBoundingClientRect().bottom>0;
  $("scrollHint").hidden=!entered||sceneState!=="ready"||!visible;
  if(sceneAPI) sceneAPI.dirty=true;
}
function revealInvitation(direct=false){
  clearTimeout(waitTimer);clearTimeout(departureTimer);clearTimeout(revealTimer);
  const first=!entered;
  entered=true;requested=true;leaving=false;
  hideIntro();
  document.body.classList.remove("waiting");
  document.body.classList.add("entered");
  $("mainContent").inert=false;
  $("travelPanel").hidden=true;
  document.querySelectorAll("[data-story]").forEach(el=>el.hidden=sceneState!=="ready");
  if(sceneState!=="ready") document.body.classList.add("no3d");
  updateScroll();

  if(direct||sceneState!=="ready"){
    $("invitation").scrollIntoView({behavior:"instant",block:"start"});
    if(first) $("countdownHeading").focus({preventScroll:true});
  }else if(first){
    $("firstStoryHeading").focus({preventScroll:true});
  }
}
function finishEntrance(){
  if(entered) return;
  sceneAPI?.snap(0);revealInvitation(false);
}
function skipAll(){
  requested=true;revealInvitation(true);sceneAPI?.snap(1);
}
$("skipButton").addEventListener("click",skipAll);
$("travelSkip").addEventListener("click",skipAll);
function beginDeparture(){
  if(leaving||entered||sceneState!=="ready") return;
  leaving=true;clearTimeout(waitTimer);
  intro.classList.add("leaving");intro.inert=true;
  $("travelPanel").hidden=false;
  $("travelSkip").focus({preventScroll:true});
  departureTimer=setTimeout(()=>{
    if(entered||sceneState!=="ready") return;
    hideIntro();
    if(paused||reduced.matches) finishEntrance();else sceneAPI.start();
  },reduced.matches?0:450);
}
function requestEntry(){
  if(requested||!revealed) return;
 requested = true;
$("enterButton").disabled = true;
  if(sceneState==="failed"){
    revealInvitation(true);
  }else if(sceneState==="ready"){
    beginDeparture();
  }else{
    put("loadStatus","messages.sceneWaiting");
    waitTimer=setTimeout(()=>{
      if(!entered&&sceneState==="loading") failScene(new Error("3D loading timeout"));
    },clamp(numeric(C.sceneWaitSeconds,12),3,60)*1000);
  }
}

function failScene(error){
  console.warn("3D fallback:",error);
  sceneState="failed";
  if(sceneAPI) sceneAPI.failed=true;
  document.body.classList.add("no3d");
  put("loadStatus","messages.sceneFailed");
  $("scrollHint").hidden=true;
  document.querySelectorAll("[data-story]").forEach(el=>el.hidden=true);
  if(requested&&!entered) revealInvitation(true);

}

   ========================================================== */
function animate(now){
  if(document.hidden) return;
  const interval=mobileQuery.matches?1000/30:1000/60;
  if(lastFrame&&now-lastFrame<interval-1){
    frame=requestAnimationFrame(animate);return;
  }
  const dt=lastFrame?Math.min((now-lastFrame)/1000,.07):0;
  lastFrame=now;
  if(svgVisible&&(!paused||svgDirty)){
    if(!paused) animationTime+=dt;
    drawCouple(animationTime);svgDirty=false;
  }
  if(sceneAPI&&!sceneAPI.failed&&$("experience").getBoundingClientRect().bottom>0){
    try{sceneAPI.tick(dt)}catch(error){failScene(error)}
  }
  frame=requestAnimationFrame(animate);
}
function restartFrame(){
  cancelAnimationFrame(frame);lastFrame=0;
  if(!document.hidden) frame=requestAnimationFrame(animate);
}
document.addEventListener("visibilitychange",()=>{
  cancelAnimationFrame(frame);clearTimeout(dayTimer);
  if(document.hidden){
    stopMusic();
  }else{
    updateDay(true);scheduleDay();svgDirty=true;updateScroll();restartFrame();
  }
});
addEventListener("pageshow",()=>{
  updateDay(true);scheduleDay();updateScroll();restartFrame();
});

async function loadChurch(){

    const white=new THREE.MeshStandardMaterial({color:"#fffdf5",roughness:.64});
    const trim=new THREE.MeshStandardMaterial({color:"#ffffff",roughness:.42});
    const stone=new THREE.MeshStandardMaterial({color:"#d0cdbf",roughness:.88});
    const floor=new THREE.MeshPhysicalMaterial({color:"#f2f0e6",roughness:.25,metalness:.03,clearcoat:.7});
    const silver=new THREE.MeshStandardMaterial({color:"#c2d0cb",metalness:.65,roughness:.3});
    const gold=new THREE.MeshStandardMaterial({color:"#bba376",metalness:.45,roughness:.4});

      color:"#96bdc4",roughness:.18,transparent:true,opacity:.3,

    function beam(a,b,r=.07,material=white){

    for(let i=0;i<17;i++){

      const path=new THREE.CurvePath();
      path.add(new THREE.LineCurve3(
        new THREE.Vector3(-width,3.2,z),new THREE.Vector3(-width,spring,z)));
      path.add(new THREE.CubicBezierCurve3(
        new THREE.Vector3(-width,spring,z),new THREE.Vector3(-width,spring+2,z),

        new THREE.Vector3(width,spring,z),new THREE.Vector3(width,3.2,z)));
      const mesh=new THREE.Mesh(new THREE.TubeGeometry(path,mobile?60:90,r,8,false),trim);
      mesh.castShadow=!mobile;mesh.receiveShadow=true;scene.add(mesh);
    }
    for(const side of [-1,1]){
      box(3.6,4.65,2.5,side*5.55,5.525,-.8);
      box(3.85,.28,2.7,side*5.55,7.95,-.8,trim);
      box(.72,7,.85,side*4.08,6.7,.12);
      box(.94,.24,1.02,side*4.08,10.18,.12,trim);
      box(.86,.38,.95,side*4.08,9.83,.12,trim);

      for(let i=0;i<10;i++){

    const upperGlass=new THREE.Mesh(
      new THREE.ShapeGeometry(archShape(3.64,6.2,7.9,13.22)),glass);
    upperGlass.position.z=.01;scene.add(upperGlass);
    box(7.3,.13,.14,0,6.2,.15,trim);
    box(7.25,.11,.14,0,8.35,.15,trim);
    for(const x of [-2.45,-1.23,0,1.23,2.45]){

    /* 開門 */

    /* 室內、屋頂、海景窗 */
    for(let z=-3.4;z>=-24;z-=3.5) archFrame(z,5.7,7.1,12.25,.18);
    for(const side of [-1,1]){

    const bloomMatrices=[],leafMatrices=[],paleMatrices=[];
    const dummy=new THREE.Object3D();
    let seed=91;
    function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
    function matrix(arr,x,y,z,sx,sy,sz){
      dummy.position.set(x,y,z);
      dummy.rotation.set(random()*3,random()*3,random()*3);
      dummy.scale.set(sx,sy,sz);dummy.updateMatrix();arr.push(dummy.matrix.clone());

    for(const [x,y,z] of flowers){
      for(let i=0;i<(mobile?17:25);i++){
        const a=random()*Math.PI*2,r=Math.sqrt(random())*.42,s=.09+random()*.07;
        matrix(bloomMatrices,x+Math.cos(a)*r,y+(random()-.5)*.25,z+Math.sin(a)*r,s,s*.8,s);
      }
      for(let i=0;i<(mobile?24:36);i++){
        const a=random()*Math.PI*2,r=.15+random()*.43;
        matrix(i%3?leafMatrices:paleMatrices,
          x+Math.cos(a)*r,y-.08+(random()-.5)*.3,z+Math.sin(a)*r,.07,.16,.035);

      for(let i=0;i<(mobile?18:27);i++){

          x+(random()-.5)*.45,y-.15-random()*1.05,z+.3+(random()-.5)*.18,.06,.14,.03);

    function addInstances(material,matrices){

    /* 祭壇 */
    box(7.8,.22,3.4,0,3.4,-22.1,trim);

    box(.16,1.25,.7,-.97,4.22,-22.7,silver);

    let phase="outside",approachProgress=0,interiorProgress=0,doorProgress=0;

    const initialPosition=new THREE.Vector3();

      let distance=30;
      for(let attempt=0;attempt<100;attempt++){
        camera.position.set(0,6.2,distance);
        camera.lookAt(initialLook);camera.updateMatrixWorld(true);
        if(bounds.every(point=>{
          projected.copy(point).project(camera);
          return Math.abs(projected.x)<.88&&Math.abs(projected.y)<verticalLimit&&projected.z<1;
        })) break;
        distance+=1.2;
      }
      initialPosition.copy(camera.position);
      approachPath=new THREE.CatmullRomCurve3([
        initialPosition.clone(),
        new THREE.Vector3(.2,4.9,Math.max(22,distance*.62)),
        new THREE.Vector3(.1,3.7,14),
        new THREE.Vector3(0,4.55,7),
        new THREE.Vector3(0,5.1,2.55),
        new THREE.Vector3(0,5.1,-2.7)
      ],false,"catmullrom",.3);
      if(phase==="outside"){
        camera.position.copy(initialPosition);camera.lookAt(initialLook);
      }
    }
    function scrollTarget(){
      if(!entered) return 0;
      const section=$("experience");
      const distance=Math.max(1,section.offsetHeight-innerHeight);
      const top=section.getBoundingClientRect().top+scrollY;
      return clamp((scrollY-top)/distance);
    }
    const api={
      dirty:true,failed:false,
      start(){phase="approach";approachProgress=0;api.dirty=true},
      snap(progress=0){
        phase="inside";approachProgress=1;
        interiorProgress=clamp(progress);doorProgress=1;
        insidePath.getPointAt(interiorProgress,position);
        camera.position.copy(position);camera.lookAt(0,6.2+interiorProgress*.6,-25);
        leftDoor.rotation.y=-Math.PI*.52;rightDoor.rotation.y=Math.PI*.52;
        api.dirty=true;
      },
      resize(){
        if(api.failed) return;
        const oldPosition=camera.position.clone(),oldQuaternion=camera.quaternion.clone();
        renderer.setPixelRatio(Math.min(devicePixelRatio||1,innerWidth<760?1.25:1.65));
        renderer.setSize(innerWidth,innerHeight);fitOpening();
        if(phase!=="outside"){
          camera.position.copy(oldPosition);camera.quaternion.copy(oldQuaternion);
        }
        api.dirty=true;
      },
      tick(dt){
        let changed=api.dirty;
        if(phase==="approach"&&!paused){
          const duration=clamp(numeric(C.entranceSeconds,2.5),.8,10);
          approachProgress=Math.min(1,approachProgress+dt/duration);
          const eased=approachProgress*approachProgress*(3-2*approachProgress);
          approachPath.getPointAt(eased,position);
          camera.position.copy(position);
          look.copy(initialLook).lerp(insideLook,clamp(eased*1.6));camera.lookAt(look);
          doorProgress=clamp((12-position.z)/9);changed=true;
          if(approachProgress>=1){
            api.snap(0);revealInvitation(false);
          }
        }else if(phase==="inside"){
          const target=scrollTarget();
          if(Math.abs(target-interiorProgress)>.00002){
            interiorProgress=paused?target:
              interiorProgress+(target-interiorProgress)*(1-Math.exp(-dt*5));
            changed=true;
          }
          if(changed){
            insidePath.getPointAt(interiorProgress,position);
            camera.position.copy(position);camera.lookAt(0,6.2+interiorProgress*.6,-25);
          }
          doorProgress=1;
        }
        if(changed){
          leftDoor.rotation.y=-doorProgress*Math.PI*.52;
          rightDoor.rotation.y=doorProgress*Math.PI*.52;
          renderer.render(scene,camera);api.dirty=false;
        }
      }
    };
    renderer.domElement.addEventListener("webglcontextlost",event=>{
      event.preventDefault();api.failed=true;renderer.domElement.style.display="none";
      failScene(new Error("WebGL context lost"));toast("messages.sceneLost");
    });
    fitOpening();renderer.render(scene,camera);
    sceneAPI=api;sceneState="ready";
    document.body.classList.remove("no3d");
    put("loadStatus","messages.sceneReady");
    if(requested&&!entered) beginDeparture();
    updateScroll();
  }catch(error){
    if(renderer){renderer.domElement.remove();renderer.dispose()}
    if(scene){
      const geometries=new Set(),materials=new Set(),textures=new Set();
      scene.traverse(object=>{
        if(object.geometry) geometries.add(object.geometry);
        const list=Array.isArray(object.material)?object.material:[object.material];
        list.filter(Boolean).forEach(material=>{
          materials.add(material);if(material.map) textures.add(material.map);
        });
      });
      geometries.forEach(g=>g.dispose());
      textures.forEach(t=>t.dispose());
      materials.forEach(m=>m.dispose());
    }
    failScene(error);
  }finally{
    clearTimeout(loadingNotice);
  }
}
void loadChurch();

})();
</script>
